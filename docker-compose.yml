services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: feynman
      POSTGRES_PASSWORD: feynman
      POSTGRES_DB: feynman
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feynman"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880" # HTTP / WebSocket
      - "7881:7881" # RTC (TCP)
      - "7882:7882/udp" # RTC (UDP)
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"

volumes:
  pgdata:
  redisdata:
