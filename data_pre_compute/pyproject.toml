[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-pipeline"
version = "0.1.0"
description = "PDF to lecture pipeline with concept graph and script generation"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
lecture-pipeline = "lecture_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
