# Curriculum Graph Pipeline Configuration

llm:
  # Provider: "openai" or "anthropic"
  #provider: "openai"
  provider: "anthropic"

  # Model name (provider-specific)
  #model: "gpt-4o"
  model: "claude-sonnet-4-20250514"

  # API key — set via env var: ANTHROPIC_API_KEY or OPENAI_API_KEY
  # api_key: ""  # or set here (NOT recommended — use env var)

  # API base URL (for OpenAI-compatible servers like Ollama)
  # base_url: "http://localhost:11434/v1"

  # Temperature for generation
  temperature: 0.3

  # Max tokens for LLM responses
  max_tokens: 16384

pdf:
  # OCR fallback threshold: if extracted text per page is below this char count, use OCR
  ocr_threshold: 50

  # DPI for image extraction
  image_dpi: 200

  # Language for OCR
  ocr_language: "eng"

output:
  # Output directory for generated files
  output_dir: "./output"

neo4j:
  # Neo4j connection settings
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "password"
  database: "neo4j"
  embedding_dimensions: 1536
  embedding_model: "text-embedding-3-small"
  embedding_batch_size: 100

salience:
  # Salience scoring weights
  alpha: 0.6   # static salience weight
  beta: 0.4    # structural salience weight (PageRank)
