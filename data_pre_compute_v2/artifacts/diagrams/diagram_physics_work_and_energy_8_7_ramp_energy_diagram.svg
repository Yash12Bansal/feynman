<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<path id="ramp-slope" d="M 120 520 L 420 520 L 420 180" stroke="#e8e8ee" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<path id="ramp-hatch" d="M 120 520 L 110 535 M 155 520 L 145 535 M 190 520 L 180 535 M 225 520 L 215 535 M 260 520 L 250 535 M 295 520 L 285 535 M 330 520 L 320 535 M 365 520 L 355 535 M 400 520 L 390 535 M 420 520 L 430 505 M 420 470 L 430 455 M 420 425 L 430 410 M 420 380 L 430 365 M 420 335 L 430 320 M 420 290 L 430 275 M 420 245 L 430 230 M 420 200 L 430 185" stroke="rgba(232,232,238,0.45)" stroke-width="1.2" fill="none" stroke-dasharray=""/>
<line id="height-line" x1="120" y1="180" x2="120" y2="520" stroke="rgba(232,232,238,0.4)" stroke-width="1.2" stroke-dasharray="5,4"/>
<line id="height-line-top" x1="108" y1="180" x2="132" y2="180" stroke="rgba(232,232,238,0.4)" stroke-width="1.2" stroke-dasharray=""/>
<line id="height-line-bottom" x1="108" y1="520" x2="132" y2="520" stroke="rgba(232,232,238,0.4)" stroke-width="1.2" stroke-dasharray=""/>
<text id="height-label" x="96" y="352" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">h</text>
<circle id="ball-top" cx="420" cy="158" r="18" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="ball-top-label" x="452" y="154" font-size="11" fill="#9effc9" text-anchor="start" font-weight="normal">height h</text>
<defs><marker id="arrowhead_gravity-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="gravity-arrow" x1="420" y1="176" x2="420" y2="240" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_gravity-arrow)"/>
<text id="gravity-label" x="434" y="222" font-size="10" fill="#ff7a8a" text-anchor="start" font-weight="normal">gravity (conservative)</text>
<circle id="ball-bottom" cx="270" cy="499" r="18" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_velocity-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="velocity-arrow" x1="292" y1="499" x2="355" y2="499" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_velocity-arrow)"/>
<text id="velocity-label" x="360" y="494" font-size="12" fill="#ff7a8a" text-anchor="start" font-weight="600">v</text>
<rect id="pe-bar-top" x="540" y="200" width="44" height="220" rx="3" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<rect id="ke-bar-top" x="596" y="418" width="44" height="2" rx="0" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<line id="bar-top-baseline" x1="530" y1="420" x2="660" y2="420" stroke="rgba(232,232,238,0.5)" stroke-width="1.5" stroke-dasharray=""/>
<text id="pe-bar-top-label" x="562" y="452" font-size="11" fill="#9effc9" font-style="italic" text-anchor="middle">PE = mgh</text>
<text id="ke-bar-top-label" x="618" y="452" font-size="11" fill="#7fd4ff" font-style="italic" text-anchor="middle">KE = 0</text>
<text id="top-bars-label" x="595" y="476" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">at top</text>
<rect id="pe-bar-bottom" x="700" y="418" width="44" height="2" rx="0" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<rect id="ke-bar-bottom" x="756" y="200" width="44" height="220" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<line id="bar-bottom-baseline" x1="690" y1="420" x2="820" y2="420" stroke="rgba(232,232,238,0.5)" stroke-width="1.5" stroke-dasharray=""/>
<text id="pe-bar-bottom-label" x="722" y="452" font-size="11" fill="#9effc9" font-style="italic" text-anchor="middle">PE = 0</text>
<text id="ke-bar-bottom-label" x="778" y="452" font-size="11" fill="#7fd4ff" font-style="italic" text-anchor="middle">KE = \tfrac{1}{2}mv^2</text>
<text id="bottom-bars-label" x="755" y="476" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">at bottom</text>
<line id="total-energy-line" x1="528" y1="200" x2="818" y2="200" stroke="#7fd4ff" stroke-width="1.8" stroke-dasharray="8,5"/>
<text id="total-energy-label" x="673" y="190" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="600">Total E = constant</text>
</svg>