<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#f9f8f4"/>
<text id="title" x="450" y="42" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s Laws: The 4-Step Problem-Solving Recipe</text>
<rect id="step1_box" x="60" y="80" width="180" height="460" rx="12" fill="#e8f4fd" stroke="#4682b4" stroke-width="2.5"/>
<rect id="step1_header" x="60" y="80" width="180" height="48" rx="12" fill="#4682b4" stroke="#4682b4" stroke-width="2.5"/>
<rect id="step1_header_bottom" x="60" y="108" width="180" height="20" rx="0" fill="#4682b4" stroke="none" stroke-width="0"/>
<text id="step1_num" x="150" y="100" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 1</text>
<text id="step1_title" x="150" y="118" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Choose Your System</text>
<text id="step1_rule_label" x="150" y="155" font-size="12" fill="#1a4a7a" text-anchor="middle" font-weight="bold">Key Rule:</text>
<text id="step1_rule1" x="150" y="174" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">All parts must share</text>
<text id="step1_rule2" x="150" y="190" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">the SAME acceleration</text>
<text id="step1_rule3" x="150" y="206" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">(size &amp; direction)</text>
<line id="step1_divider" x1="80" y1="220" x2="220" y2="220" stroke="#4682b4" stroke-width="1" stroke-dasharray="4,3"/>
<rect id="step1_yes_box" x="80" y="230" width="140" height="50" rx="6" fill="#d4edda" stroke="#4CAF50" stroke-width="1.5"/>
<text id="step1_yes_label" x="150" y="248" font-size="10" fill="#1a5c2a" text-anchor="middle" font-weight="bold">YES: Two blocks</text>
<text id="step1_yes_desc" x="150" y="263" font-size="10" fill="#1a5c2a" text-anchor="middle" font-weight="normal">sliding together</text>
<text id="step1_yes_desc2" x="150" y="275" font-size="10" fill="#1a5c2a" text-anchor="middle" font-weight="normal">= one system</text>
<rect id="step1_no_box" x="80" y="292" width="140" height="60" rx="6" fill="#fde8e8" stroke="#D32F2F" stroke-width="1.5"/>
<text id="step1_no_label" x="150" y="310" font-size="10" fill="#7a1a1a" text-anchor="middle" font-weight="bold">NO: One part up,</text>
<text id="step1_no_desc" x="150" y="325" font-size="10" fill="#7a1a1a" text-anchor="middle" font-weight="normal">another sideways</text>
<text id="step1_no_desc2" x="150" y="340" font-size="10" fill="#7a1a1a" text-anchor="middle" font-weight="normal">= separate systems</text>
<rect id="step2_box" x="270" y="80" width="180" height="460" rx="12" fill="#fef9e7" stroke="#FF9800" stroke-width="2.5"/>
<rect id="step2_header" x="270" y="80" width="180" height="48" rx="12" fill="#FF9800" stroke="#FF9800" stroke-width="2.5"/>
<rect id="step2_header_bottom" x="270" y="108" width="180" height="20" rx="0" fill="#FF9800" stroke="none" stroke-width="0"/>
<text id="step2_num" x="360" y="100" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 2</text>
<text id="step2_title" x="360" y="118" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">List External Forces</text>
<text id="step2_rule_label" x="360" y="155" font-size="12" fill="#7a4a00" text-anchor="middle" font-weight="bold">ONLY forces from</text>
<text id="step2_rule2" x="360" y="172" font-size="12" fill="#7a4a00" text-anchor="middle" font-weight="bold">OUTSIDE the system</text>
<line id="step2_divider" x1="290" y1="188" x2="430" y2="188" stroke="#FF9800" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step2_include" x="360" y="208" font-size="11" fill="#4CAF50" text-anchor="middle" font-weight="bold">Include:</text>
<text id="step2_inc1" x="360" y="224" font-size="10" fill="#333" text-anchor="middle" font-weight="normal">Gravity (weight)</text>
<text id="step2_inc2" x="360" y="239" font-size="10" fill="#333" text-anchor="middle" font-weight="normal">Normal force</text>
<text id="step2_inc3" x="360" y="254" font-size="10" fill="#333" text-anchor="middle" font-weight="normal">Tension, friction, push</text>
<line id="step2_divider2" x1="290" y1="268" x2="430" y2="268" stroke="#FF9800" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step2_exclude" x="360" y="288" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="bold">Exclude:</text>
<text id="step2_exc1" x="360" y="304" font-size="10" fill="#333" text-anchor="middle" font-weight="normal">Forces between parts</text>
<text id="step2_exc2" x="360" y="319" font-size="10" fill="#333" text-anchor="middle" font-weight="normal">inside your system</text>
<text id="step2_exc3" x="360" y="334" font-size="10" fill="#888" text-anchor="middle" font-weight="normal">(internal forces)</text>
<rect id="step3_box" x="480" y="80" width="180" height="460" rx="12" fill="#f3e8fd" stroke="#9c27b0" stroke-width="2.5"/>
<rect id="step3_header" x="480" y="80" width="180" height="48" rx="12" fill="#9c27b0" stroke="#9c27b0" stroke-width="2.5"/>
<rect id="step3_header_bottom" x="480" y="108" width="180" height="20" rx="0" fill="#9c27b0" stroke="none" stroke-width="0"/>
<text id="step3_num" x="570" y="100" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 3</text>
<text id="step3_title" x="570" y="118" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Free Body Diagram</text>
<text id="step3_rule1" x="570" y="152" font-size="11" fill="#4a1a6a" text-anchor="middle" font-weight="bold">Draw the system</text>
<text id="step3_rule2" x="570" y="167" font-size="11" fill="#4a1a6a" text-anchor="middle" font-weight="normal">as a single dot.</text>
<text id="step3_rule3" x="570" y="182" font-size="11" fill="#4a1a6a" text-anchor="middle" font-weight="normal">Draw arrows for</text>
<text id="step3_rule4" x="570" y="197" font-size="11" fill="#4a1a6a" text-anchor="middle" font-weight="normal">every force. Label all.</text>
<circle id="step3_dot" cx="570" cy="290" r="10" fill="#9c27b0" stroke="#4a1a6a" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_step3_up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="step3_up" x1="570" y1="280" x2="570" y2="235" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_step3_up)"/>
<text id="step3_up_label" x="600" y="255" font-size="11" fill="#FF9800" text-anchor="start" font-weight="bold">N</text>
<defs><marker id="arrowhead_step3_down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="step3_down" x1="570" y1="300" x2="570" y2="345" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arrowhead_step3_down)"/>
<text id="step3_down_label" x="600" y="330" font-size="11" fill="#4CAF50" text-anchor="start" font-weight="bold">mg</text>
<defs><marker id="arrowhead_step3_right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="step3_right" x1="580" y1="290" x2="625" y2="290" stroke="#D32F2F" stroke-width="2.5" marker-end="url(#arrowhead_step3_right)"/>
<text id="step3_right_label" x="630" y="286" font-size="11" fill="#D32F2F" text-anchor="start" font-weight="bold">T</text>
<text id="step3_caption" x="570" y="380" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">Your map — never</text>
<text id="step3_caption2" x="570" y="394" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">skip this step!</text>
<rect id="step4_box" x="690" y="80" width="180" height="460" rx="12" fill="#e8fde8" stroke="#4CAF50" stroke-width="2.5"/>
<rect id="step4_header" x="690" y="80" width="180" height="48" rx="12" fill="#4CAF50" stroke="#4CAF50" stroke-width="2.5"/>
<rect id="step4_header_bottom" x="690" y="108" width="180" height="20" rx="0" fill="#4CAF50" stroke="none" stroke-width="0"/>
<text id="step4_num" x="780" y="100" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 4</text>
<text id="step4_title" x="780" y="118" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Apply Newton&#x27;s 2nd</text>
<text id="step4_tip" x="780" y="152" font-size="11" fill="#1a5c2a" text-anchor="middle" font-weight="bold">Tip: Point x-axis</text>
<text id="step4_tip2" x="780" y="167" font-size="11" fill="#1a5c2a" text-anchor="middle" font-weight="bold">along acceleration!</text>
<line id="step4_divider" x1="710" y1="180" x2="850" y2="180" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step4_xaxis" x="780" y="200" font-size="10" fill="#1a5c2a" text-anchor="middle" font-weight="bold">Along acceleration:</text>
<text id="step4_eq1" x="780" y="222" font-size="13" fill="#1a1a2e" font-style="italic" text-anchor="middle">\sum F_x = ma</text>
<line id="step4_divider2" x1="710" y1="248" x2="850" y2="248" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step4_yaxis" x="780" y="268" font-size="10" fill="#1a5c2a" text-anchor="middle" font-weight="bold">Perpendicular:</text>
<text id="step4_eq2" x="780" y="290" font-size="13" fill="#1a1a2e" font-style="italic" text-anchor="middle">\sum F_y = 0</text>
<text id="step4_note" x="780" y="318" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">(no acceleration</text>
<text id="step4_note2" x="780" y="332" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">perpendicular)</text>
<line id="step4_divider3" x1="710" y1="346" x2="850" y2="346" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step4_solve" x="780" y="366" font-size="11" fill="#1a5c2a" text-anchor="middle" font-weight="bold">Solve the equations!</text>
<defs><marker id="arrowhead_arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#888"/></marker></defs><line id="arrow1" x1="242" y1="310" x2="268" y2="310" stroke="#888" stroke-width="2" marker-end="url(#arrowhead_arrow1)"/>
<defs><marker id="arrowhead_arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#888"/></marker></defs><line id="arrow2" x1="452" y1="310" x2="478" y2="310" stroke="#888" stroke-width="2" marker-end="url(#arrowhead_arrow2)"/>
<defs><marker id="arrowhead_arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#888"/></marker></defs><line id="arrow3" x1="662" y1="310" x2="688" y2="310" stroke="#888" stroke-width="2" marker-end="url(#arrowhead_arrow3)"/>
<rect id="footer_box" x="60" y="562" width="810" height="58" rx="10" fill="#1a1a2e" stroke="none" stroke-width="0"/>
<text id="footer_text" x="450" y="586" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">This 4-step recipe works for almost every problem in mechanics.</text>
<text id="footer_text2" x="450" y="607" font-size="12" fill="#aac8ff" text-anchor="middle" font-weight="normal">Skip a step, and you risk the wrong answer — just like forgetting baking powder in a cake!</text>
</svg>