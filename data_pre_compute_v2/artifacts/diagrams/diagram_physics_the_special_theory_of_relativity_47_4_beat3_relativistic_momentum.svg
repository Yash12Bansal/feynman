<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="label-left" x="230" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Lorentz factor</text>
<text id="label-right" x="670" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Relativistic momentum</text>
<line id="divider" x1="450" y1="40" x2="450" y2="610" stroke="rgba(232,232,238,0.18)" stroke-width="1" stroke-dasharray="6,6"/>

<text id="gamma-eq-label" x="235" y="578" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">γ → ∞ as v → c</text>

<text id="momentum-caption" x="670" y="578" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">p → ∞ as v → c</text>
<text id="main-formula" x="670" y="610" font-size="20" fill="#9effc9" font-style="italic" text-anchor="middle">p = \gamma m_0 v</text>
<text id="gamma-formula" x="230" y="610" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">\gamma = \dfrac{1}{\sqrt{1 - v^2/c^2}}</text>
<text id="newtonian-label-left" x="155" y="540" font-size="10" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">γ = 1 (Newton)</text>
<text id="newtonian-label-right" x="595" y="540" font-size="10" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">p = m₀v (Newton)</text>
</svg>