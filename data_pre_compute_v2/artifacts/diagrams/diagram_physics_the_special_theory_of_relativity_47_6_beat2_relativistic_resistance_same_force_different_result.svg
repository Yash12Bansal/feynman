<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="label-left" x="225" y="58" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">v ≪ c</text>
<text id="label-right" x="675" y="58" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">v ≈ 0.99c</text>
