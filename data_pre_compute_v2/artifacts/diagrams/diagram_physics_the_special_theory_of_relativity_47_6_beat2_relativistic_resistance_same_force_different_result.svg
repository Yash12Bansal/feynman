<circle id="particle-left" cx="225" cy="290" r="22" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_force-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="force-left" x1="100" y1="290" x2="195" y2="290" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_force-left)"/>
<text id="force-left-label" x="92" y="284" font-size="13" fill="#9effc9" text-anchor="end" font-weight="600">F</text>
<defs><marker id="arrowhead_accel-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="accel-left" x1="255" y1="290" x2="370" y2="290" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_accel-left)"/>
<text id="accel-left-label" x="378" y="284" font-size="13" fill="#7fd4ff" text-anchor="start" font-weight="600">a</text>
