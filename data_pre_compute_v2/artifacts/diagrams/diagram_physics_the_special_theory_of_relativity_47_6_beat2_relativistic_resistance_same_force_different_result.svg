<text id="velocity-left-label" x="225" y="386" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">v</text>
<text id="gamma-left" x="225" y="440" font-size="15" fill="#e8e8ee" font-style="italic" text-anchor="middle">\gamma \approx 1</text>
<text id="momentum-left" x="225" y="490" font-size="13" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">p = m_0 v</text>
<circle id="particle-right" cx="675" cy="290" r="22" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_force-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="force-right" x1="550" y1="290" x2="645" y2="290" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_force-right)"/>
<text id="force-right-label" x="542" y="284" font-size="13" fill="#9effc9" text-anchor="end" font-weight="600">F</text>
<defs><marker id="arrowhead_accel-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="accel-right" x1="705" y1="290" x2="730" y2="290" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_accel-right)"/>
<text id="accel-right-label" x="738" y="284" font-size="12" fill="#7fd4ff" text-anchor="start" font-weight="600">a → 0</text>
<defs><marker id="arrowhead_velocity-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="velocity-right" x1="675" y1="325" x2="675" y2="370" stroke="#ff7a8a" stroke-width="2" marker-end="url(#arrowhead_velocity-right)"/>
<text id="velocity-right-label" x="675" y="386" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">v ≈ 0.99c</text>
<text id="gamma-right" x="675" y="440" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">\gamma \gg 1</text>
<text id="momentum-right" x="675" y="490" font-size="13" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">p = \gamma m_0 v \to \infty</text>
