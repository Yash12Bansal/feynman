<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="label-rest" x="225" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Clock at rest</text>
<text id="label-moving" x="660" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Clock in motion</text>
<line id="divider" x1="450" y1="40" x2="450" y2="610" stroke="rgba(232,232,238,0.18)" stroke-width="1" stroke-dasharray="6,6"/>
<rect id="mirror-top-rest" x="170" y="160" width="110" height="14" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<rect id="mirror-bot-rest" x="170" y="460" width="110" height="14" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<defs><marker id="arrowhead_pulse-up-rest" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="pulse-up-rest" x1="225" y1="460" x2="225" y2="178" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_pulse-up-rest)"/>
<defs><marker id="arrowhead_pulse-down-rest" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="pulse-down-rest" x1="225" y1="174" x2="225" y2="462" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_pulse-down-rest)"/>
<line id="path-label-line-rest" x1="240" y1="174" x2="240" y2="462" stroke="rgba(232,232,238,0.28)" stroke-width="1" stroke-dasharray="3,4"/>
<text id="d-label-rest" x="258" y="322" font-size="13" fill="#9effc9" text-anchor="start" font-weight="600">d</text>
<text id="tau-label" x="148" y="322" font-size="13" fill="#9effc9" text-anchor="end" font-weight="600">Δt₀</text>
<text id="tau-eq" x="148" y="340" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="end" font-weight="normal">= 2d/c</text>
<rect id="mirror-top-mov" x="565" y="200" width="110" height="14" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<rect id="mirror-bot-mov" x="565" y="460" width="110" height="14" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<path id="zigzag-path" d="M 590 460 L 680 207 L 770 460" stroke="#9effc9" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<line id="vertical-ref" x1="590" y1="207" x2="590" y2="460" stroke="rgba(232,232,238,0.28)" stroke-width="1" stroke-dasharray="3,4"/>
<line id="horiz-travel" x1="590" y1="490" x2="770" y2="490" stroke="#ff7a8a" stroke-width="1.8" stroke-dasharray=""/>
<defs><marker id="arrowhead_v-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="v-arrow" x1="590" y1="490" x2="770" y2="490" stroke="#ff7a8a" stroke-width="2.2" marker-end="url(#arrowhead_v-arrow)"/>
<text id="v-label" x="680" y="508" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">v</text>
<line id="d-vert-mov" x1="548" y1="207" x2="548" y2="460" stroke="rgba(232,232,238,0.28)" stroke-width="1" stroke-dasharray="3,4"/>
<text id="d-label-mov" x="536" y="338" font-size="13" fill="#9effc9" text-anchor="end" font-weight="600">d</text>
<line id="hyp-indicator" x1="590" y1="460" x2="680" y2="207" stroke="rgba(232,232,238,0.18)" stroke-width="1" stroke-dasharray=""/>
<text id="L-label" x="648" y="348" font-size="13" fill="#e8e8ee" text-anchor="start" font-weight="600">L</text>
<text id="dt-label" x="800" y="322" font-size="13" fill="#ff7a8a" text-anchor="start" font-weight="600">Δt</text>
<text id="dt-eq" x="800" y="340" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="start" font-weight="normal">= γ Δt₀</text>
<text id="gamma-def" x="450" y="590" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">γ = 1/√(1 − v²/c²)  &gt;  1</text>
<text id="proper-time-note" x="225" y="590" font-size="11" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">proper time  τ = Δt₀</text>
</svg>