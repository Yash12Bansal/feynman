<text id="ram-turnaround-label" x="332" y="304" font-size="10" fill="#ff7a8a" text-anchor="start" font-weight="normal">turnaround</text>
<text id="ram-end-label" x="215" y="113" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">reunite</text>
<text id="ram-tau-label" x="230" y="620" font-size="13" fill="#9effc9" font-style="italic" text-anchor="middle">\tau_{\text{Ram}} &lt; \tau_{\text{Balram}}</text>
<defs><marker id="arrowhead_balram-time-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.35)"/></marker></defs><line id="balram-time-axis" x1="570" y1="580" x2="570" y2="90" stroke="rgba(232,232,238,0.35)" stroke-width="1.5" marker-end="url(#arrowhead_balram-time-axis)"/>
<text id="balram-time-label" x="552" y="86" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">t</text>
<defs><marker id="arrowhead_balram-space-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.35)"/></marker></defs><line id="balram-space-axis" x1="570" y1="580" x2="830" y2="580" stroke="rgba(232,232,238,0.35)" stroke-width="1.5" marker-end="url(#arrowhead_balram-space-axis)"/>
<text id="balram-space-label" x="836" y="583" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="start" font-weight="normal">x</text>
