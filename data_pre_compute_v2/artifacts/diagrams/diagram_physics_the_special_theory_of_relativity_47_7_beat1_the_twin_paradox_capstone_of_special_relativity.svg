<text id="balram-end-label" x="685" y="113" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="start" font-weight="normal">reunite</text>
<text id="balram-tau-label" x="670" y="620" font-size="13" fill="#7fd4ff" font-style="italic" text-anchor="middle">\tau_{\text{Balram}} = \text{max}</text>
