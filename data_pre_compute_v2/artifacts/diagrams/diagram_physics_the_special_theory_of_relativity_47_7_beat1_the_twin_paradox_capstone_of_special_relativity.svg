<circle id="ram-turnaround" cx="310" cy="300" r="6" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<circle id="ram-end" cx="230" cy="120" r="6" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
