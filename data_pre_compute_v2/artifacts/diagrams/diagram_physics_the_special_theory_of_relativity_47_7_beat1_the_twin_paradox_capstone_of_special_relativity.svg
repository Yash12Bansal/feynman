<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="label-ram" x="230" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Ram (traveller)</text>
<text id="label-balram" x="670" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Balram (stays home)</text>
<line id="divider" x1="450" y1="40" x2="450" y2="610" stroke="rgba(232,232,238,0.18)" stroke-width="1.2" stroke-dasharray="6,6"/>
<defs><marker id="arrowhead_ram-time-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.35)"/></marker></defs><line id="ram-time-axis" x1="130" y1="580" x2="130" y2="90" stroke="rgba(232,232,238,0.35)" stroke-width="1.5" marker-end="url(#arrowhead_ram-time-axis)"/>
<text id="ram-time-label" x="112" y="86" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">t</text>
<defs><marker id="arrowhead_ram-space-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.35)"/></marker></defs><line id="ram-space-axis" x1="130" y1="580" x2="390" y2="580" stroke="rgba(232,232,238,0.35)" stroke-width="1.5" marker-end="url(#arrowhead_ram-space-axis)"/>
<text id="ram-space-label" x="396" y="583" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="start" font-weight="normal">x</text>
<path id="ram-worldline" d="M 230 540 L 310 300 L 230 120" stroke="#9effc9" stroke-width="3" fill="none" stroke-dasharray=""/>
