<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="x-axis" x1="100" y1="520" x2="820" y2="520" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/>
<line id="y-axis" x1="100" y1="60" x2="100" y2="520" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_x-axis-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="x-axis-arrow" x1="810" y1="520" x2="825" y2="520" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_x-axis-arrow)"/>
<defs><marker id="arrowhead_y-axis-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="y-axis-arrow" x1="100" y1="70" x2="100" y2="55" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_y-axis-arrow)"/>
<text id="x-axis-label" x="460" y="558" font-size="12" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">Force applied (cumulative)</text>
<text id="y-axis-label" x="38" y="295" font-size="12" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">Speed</text>
<text id="y-axis-label2" x="38" y="310" font-size="12" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">of particle</text>
<line id="c-line" x1="100" y1="290" x2="820" y2="290" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray="10,6"/>
<text id="c-label" x="832" y="294" font-size="14" fill="#ff7a8a" text-anchor="start" font-weight="600">c</text>
<text id="c-sublabel" x="832" y="308" font-size="10" fill="#ff7a8a" text-anchor="start" font-weight="normal">(speed of light)</text>
<path id="relativistic-curve" d="M 100 520 C 140 390, 200 330, 300 308 C 420 296, 560 291, 820 289" stroke="#9effc9" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<path id="tachyon-curve" d="M 100 62 C 140 190, 200 248, 300 270 C 420 282, 560 287, 820 289" stroke="#7fd4ff" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
<path id="tachyon-region-shade" d="M 100 62 C 140 190, 200 248, 300 270 C 420 282, 560 287, 820 289 L 820 62 Z" stroke="none" stroke-width="0" fill="rgba(127,212,255,0.07)" stroke-dasharray=""/>
<text id="tachyon-label" x="460" y="110" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">Tachyon world  (v &gt; c)</text>
<text id="tachyon-sublabel" x="460" y="128" font-size="10" fill="rgba(127,212,255,0.55)" text-anchor="middle" font-weight="normal">hypothetical — never observed</text>
<text id="real-world-label" x="460" y="470" font-size="12" fill="rgba(158,255,201,0.7)" text-anchor="middle" font-weight="normal">Our world  (v &lt; c)</text>
<text id="origin-label" x="88" y="534" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">0</text>
<line id="asymptote-tick" x1="94" y1="290" x2="100" y2="290" stroke="#ff7a8a" stroke-width="2" stroke-dasharray=""/>
<path id="approach-annotation-lower" d="M 680 310 Q 700 330 680 350" stroke="rgba(158,255,201,0.45)" stroke-width="1.2" fill="none" stroke-dasharray="3,3"/>
<text id="approach-label-lower" x="710" y="335" font-size="10" fill="rgba(158,255,201,0.65)" text-anchor="start" font-weight="normal">never reaches c</text>
<path id="approach-annotation-upper" d="M 680 268 Q 700 248 680 228" stroke="rgba(127,212,255,0.45)" stroke-width="1.2" fill="none" stroke-dasharray="3,3"/>
<text id="approach-label-upper" x="710" y="248" font-size="10" fill="rgba(127,212,255,0.65)" text-anchor="start" font-weight="normal">never reaches c</text>
<text id="tachyon-infinity-label" x="108" y="72" font-size="14" fill="rgba(127,212,255,0.75)" text-anchor="start" font-weight="normal">∞</text>
</svg>