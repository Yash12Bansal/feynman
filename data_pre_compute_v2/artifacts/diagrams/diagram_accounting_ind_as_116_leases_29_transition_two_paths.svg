<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="decision-node" x="60" y="280" width="200" height="90" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="decision-line1" x="160" y="315" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">New standard arrives</text>
<text id="decision-line2" x="160" y="338" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">choose a path</text>
<defs><marker id="arrowhead_full-retro-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="full-retro-branch" x1="260" y1="305" x2="500" y2="190" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_full-retro-branch)"/>
<text id="full-retro-label" x="350" y="230" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="600">Full retrospective</text>
<rect id="full-retro-box" x="510" y="110" width="300" height="110" rx="6" fill="none" stroke="#9effc9" stroke-width="2"/>
<text id="full-retro-text1" x="660" y="145" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Redo every period</text>
<text id="full-retro-text2" x="660" y="167" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">as if always applied</text>
<text id="full-retro-text3" x="660" y="195" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">+ a third balance sheet</text>
<rect id="third-balance-sheet" x="770" y="60" width="34" height="44" rx="3" fill="none" stroke="#9effc9" stroke-width="2"/>
<line id="tbs-line1" x1="776" y1="72" x2="798" y2="72" stroke="#9effc9" stroke-width="1.2" stroke-dasharray=""/>
<line id="tbs-line2" x1="776" y1="82" x2="798" y2="82" stroke="#9effc9" stroke-width="1.2" stroke-dasharray=""/>
<line id="tbs-line3" x1="776" y1="92" x2="798" y2="92" stroke="#9effc9" stroke-width="1.2" stroke-dasharray=""/>
<text id="tbs-label" x="787" y="122" font-size="10" fill="#9effc9" text-anchor="middle" font-weight="600">3rd B/S</text>
<defs><marker id="arrowhead_modified-retro-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="modified-retro-branch" x1="260" y1="345" x2="500" y2="460" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_modified-retro-branch)"/>
<text id="modified-retro-label" x="350" y="432" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">Modified retrospective</text>
<rect id="modified-retro-box" x="510" y="430" width="300" height="110" rx="6" fill="none" stroke="#ff7a8a" stroke-width="2"/>
<text id="modified-retro-text1" x="660" y="465" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Leave the past alone</text>
<text id="modified-retro-text2" x="660" y="487" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">adjust opening equity at</text>
<text id="modified-retro-text3" x="660" y="515" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">date of initial application</text>
<defs><marker id="arrowhead_equity-adjustment" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="equity-adjustment" x1="660" y1="600" x2="660" y2="545" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_equity-adjustment)"/>
<text id="equity-adjustment-label" x="660" y="618" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">Opening equity</text>
</svg>
