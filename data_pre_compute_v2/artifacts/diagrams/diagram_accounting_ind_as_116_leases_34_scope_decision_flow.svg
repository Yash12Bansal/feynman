<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="contract-box" x="320" y="30" width="260" height="56" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="contract-label" x="450" y="52" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Contract: right to operate</text>
<text id="contract-label2" x="450" y="70" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">air navigation system, 10 years</text>
<defs><marker id="arrowhead_to-gate-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="to-gate-arrow" x1="450" y1="86" x2="450" y2="132" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_to-gate-arrow)"/>
<path id="ind-as-116-gate" d="M 450 132 L 580 188 L 450 244 L 320 188 Z" stroke="#7fd4ff" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<text id="gate-label" x="450" y="184" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">Apply Ind AS 116</text>
<text id="gate-label2" x="450" y="200" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">to all leases</text>
<defs><marker id="arrowhead_exclusion-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="exclusion-branch" x1="580" y1="188" x2="740" y2="188" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_exclusion-branch)"/>
<text id="exclusion-label" x="660" y="174" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">EXCEPT service concession</text>
<text id="exclusion-label2" x="660" y="206" font-size="10" fill="rgba(255,122,138,0.8)" text-anchor="middle" font-weight="normal">(App. D, Ind AS 115)</text>
<rect id="price-control-test" x="600" y="240" width="240" height="60" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2"/>
<text id="price-label" x="720" y="264" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Does grantor control the</text>
<text id="price-label2" x="720" y="282" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">PRICE charged to users?</text>
<defs><marker id="arrowhead_price-to-residual" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="price-to-residual" x1="720" y1="300" x2="720" y2="346" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_price-to-residual)"/>
<rect id="residual-interest-test" x="600" y="350" width="240" height="60" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2"/>
<text id="residual-label" x="720" y="374" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Does grantor keep a significant</text>
<text id="residual-label2" x="720" y="392" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">RESIDUAL interest in infra?</text>
<defs><marker id="arrowhead_residual-to-result" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="residual-to-result" x1="720" y1="410" x2="720" y2="470" stroke="#ff7a8a" stroke-width="2" marker-end="url(#arrowhead_residual-to-result)"/>
<text id="no-label" x="736" y="444" font-size="11" fill="#ff7a8a" text-anchor="start" font-weight="600">NO</text>
<rect id="not-concession-result" x="560" y="474" width="320" height="64" rx="6" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<text id="result-label" x="720" y="500" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Price NOT controlled by grantor</text>
<text id="result-label2" x="720" y="518" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">→ NOT a service concession</text>
<path id="back-into-116-arrow" d="M 560 506 L 200 506 L 200 188 L 320 188" stroke="#9effc9" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<defs><marker id="arrowhead_back-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="back-arrowhead" x1="280" y1="188" x2="320" y2="188" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_back-arrowhead)"/>
<text id="back-label" x="200" y="340" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="600">back into Ind AS 116</text>
</svg>
