<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<defs><marker id="arrowhead_time-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="time-axis" x1="120" y1="520" x2="800" y2="520" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_time-axis)"/>
<defs><marker id="arrowhead_position-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="position-axis" x1="120" y1="520" x2="120" y2="110" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_position-axis)"/>
<text id="time-label" x="760" y="548" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Time (s)</text>
<text id="position-label" x="96" y="120" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Position (m)</text>
<line id="straight-line" x1="120" y1="520" x2="470" y2="200" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="straight-label" x="480" y="196" font-size="12" fill="#7fd4ff" text-anchor="start" font-weight="normal">constant velocity</text>
<path id="curved-line" d="M 120 520 Q 560 510 770 150" stroke="#9effc9" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<text id="curved-label" x="700" y="140" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">increasing velocity</text>
<path id="slope-triangle" d="M 230 420 L 340 420 L 340 320 Z" stroke="#ff7a8a" stroke-width="2" fill="none" stroke-dasharray=""/>
<text id="run-label" x="285" y="438" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">run = Δt</text>
<text id="rise-label" x="348" y="375" font-size="13" fill="#ff7a8a" font-style="italic" text-anchor="middle">\text{rise}=\Delta x</text>
</svg>