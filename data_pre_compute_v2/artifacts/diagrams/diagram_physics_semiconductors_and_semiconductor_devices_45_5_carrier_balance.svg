<defs><marker id="arrowhead_recombination-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8a0ff"/></marker></defs><line id="recombination-arrow" x1="560" y1="200" x2="560" y2="455" stroke="#e8a0ff" stroke-width="2.5" marker-end="url(#arrowhead_recombination-arrow)"/>
