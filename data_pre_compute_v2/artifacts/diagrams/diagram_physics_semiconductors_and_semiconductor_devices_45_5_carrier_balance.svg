<text id="np-product-label" x="709" y="311" font-size="13" fill="#e8e8ee" font-style="italic" text-anchor="middle">n \times p = \text{const}</text>
<text id="carrier-count-label" x="450" y="78" font-size="12" fill="rgba(232,232,238,0.75)" font-style="italic" text-anchor="middle">n \approx p \approx 7\times10^{15}\,\text{m}^{-3}\;(\text{Si, }300\text{ K})</text>
<text id="energy-axis-label" x="44" y="328" font-size="12" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">Energy</text>
<defs><marker id="arrowhead_energy-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.3)"/></marker></defs><line id="energy-axis" x1="54" y1="560" x2="54" y2="90" stroke="rgba(232,232,238,0.3)" stroke-width="1.5" marker-end="url(#arrowhead_energy-axis)"/>
