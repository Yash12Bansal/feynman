<defs><marker id="arrowhead_thermal-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ffcc55"/></marker></defs><line id="thermal-arrow" x1="340" y1="455" x2="340" y2="200" stroke="#ffcc55" stroke-width="2.5" marker-end="url(#arrowhead_thermal-arrow)"/>
