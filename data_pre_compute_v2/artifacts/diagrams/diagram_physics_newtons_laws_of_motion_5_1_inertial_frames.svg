<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
<rect x="0" y="0" width="900" height="660" fill="#f8f9fa"/>
<rect id="if_bg" x="0" y="0" width="900" height="660" rx="0" fill="#f8f9fa" stroke="none" stroke-width="0"/>
<text id="if_title" x="450" y="40" font-size="24" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Inertial vs. Non-Inertial Reference Frames</text>
<line id="if_divider_h" x1="40" y1="55" x2="860" y2="55" stroke="#ccc" stroke-width="1.5" stroke-dasharray=""/>
<line id="if_divider_v" x1="450" y1="55" x2="450" y2="590" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect id="if_left_header" x="48" y="62" width="390" height="44" rx="8" fill="#2e7d32" stroke="none" stroke-width="0"/>
<text id="if_left_header_t1" x="243" y="80" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">INERTIAL FRAME</text>
<text id="if_left_header_t2" x="243" y="98" font-size="12" fill="#c8e6c9" text-anchor="middle" font-weight="normal">Constant velocity train</text>
<rect id="if_right_header" x="462" y="62" width="390" height="44" rx="8" fill="#c62828" stroke="none" stroke-width="0"/>
<text id="if_right_header_t1" x="657" y="80" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">NON-INERTIAL FRAME</text>
<text id="if_right_header_t2" x="657" y="98" font-size="12" fill="#ffcdd2" text-anchor="middle" font-weight="normal">Accelerating train</text>
<rect id="if_train_left" x="60" y="130" width="360" height="140" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text id="if_train_left_label" x="240" y="148" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">Inside the train</text>
<rect id="if_table_left" x="155" y="230" width="170" height="12" rx="2" fill="#a0785a" stroke="#7a5a3a" stroke-width="1.5"/>
<rect id="if_glass_left" x="218" y="200" width="44" height="30" rx="4" fill="#b3d9f7" stroke="#4a90d9" stroke-width="2"/>
<text id="if_glass_left_label" x="240" y="220" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="bold">Glass</text>
<text id="if_left_glass_status" x="240" y="260" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">Glass stays still</text>
<defs><marker id="arrowhead_if_train_left_v" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker></defs><line id="if_train_left_v" x1="340" y1="200" x2="415" y2="200" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowhead_if_train_left_v)"/>
<text id="if_train_left_v_label" x="380" y="190" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">v = const</text>
<rect id="if_train_right" x="462" y="130" width="390" height="140" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text id="if_train_right_label" x="657" y="148" font-size="11" fill="#c62828" text-anchor="middle" font-weight="normal">Inside the train</text>
<rect id="if_table_right" x="570" y="230" width="170" height="12" rx="2" fill="#a0785a" stroke="#7a5a3a" stroke-width="1.5"/>
<rect id="if_glass_right" x="590" y="200" width="44" height="30" rx="4" fill="#b3d9f7" stroke="#4a90d9" stroke-width="2"/>
<text id="if_glass_right_label" x="612" y="220" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="bold">Glass</text>
<defs><marker id="arrowhead_if_glass_slide" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e53935"/></marker></defs><line id="if_glass_slide" x1="634" y1="215" x2="580" y2="215" stroke="#e53935" stroke-width="3" marker-end="url(#arrowhead_if_glass_slide)"/>
<text id="if_glass_slide_label" x="607" y="205" font-size="11" fill="#e53935" text-anchor="middle" font-weight="bold">slides back!</text>
<text id="if_right_glass_status" x="657" y="260" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">Glass slides backward</text>
<defs><marker id="arrowhead_if_train_right_a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c62828"/></marker></defs><line id="if_train_right_a" x1="762" y1="200" x2="845" y2="200" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead_if_train_right_a)"/>
<text id="if_train_right_a_label" x="810" y="190" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">a &gt; 0</text>
<rect id="if_left_analysis" x="60" y="290" width="360" height="130" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text id="if_left_a1" x="240" y="315" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">No net force on glass</text>
<text id="if_left_latex1" x="240" y="345" font-size="14" fill="#2e7d32" font-style="italic" text-anchor="middle">\sum F = 0</text>
<text id="if_left_latex2" x="240" y="375" font-size="13" fill="#2e7d32" font-style="italic" text-anchor="middle">\Rightarrow a = 0 \text{ (stays still)}</text>
<text id="if_left_a2" x="240" y="405" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">First Law WORKS correctly here</text>
<rect id="if_right_analysis" x="462" y="290" width="390" height="130" rx="8" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
<text id="if_right_a1" x="657" y="315" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">No real force pushes glass back...</text>
<text id="if_right_a2" x="657" y="335" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">yet it accelerates backward!</text>
<text id="if_right_latex1" x="657" y="370" font-size="13" fill="#c62828" font-style="italic" text-anchor="middle">\sum F = 0 \text{ but } a \neq 0 \text{ ???}</text>
<text id="if_right_a3" x="657" y="405" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">First Law BREAKS DOWN here</text>
<rect id="if_key_bg" x="60" y="440" width="792" height="80" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text id="if_key_title" x="456" y="465" font-size="15" fill="#e65100" text-anchor="middle" font-weight="bold">Key Definition</text>
<text id="if_key_def1" x="456" y="488" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Inertial Frame: Newton&#x27;s First Law holds. The frame is not accelerating.</text>
<text id="if_key_def2" x="456" y="508" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Non-Inertial Frame: The frame itself accelerates — the law appears to fail.</text>
<rect id="if_bonus_bg" x="60" y="535" width="792" height="50" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text id="if_bonus_text" x="456" y="557" font-size="13" fill="#1a237e" text-anchor="middle" font-weight="bold">Bonus Rule: Any frame moving at CONSTANT VELOCITY relative to an inertial frame is also inertial.</text>
<text id="if_bonus_text2" x="456" y="575" font-size="12" fill="#3949ab" text-anchor="middle" font-weight="normal">The key word is CONSTANT — the moment the frame speeds up or slows down, it becomes non-inertial.</text>
</svg>