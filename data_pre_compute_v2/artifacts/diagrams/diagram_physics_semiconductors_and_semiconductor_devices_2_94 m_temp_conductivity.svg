<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="valence-band" x="160" y="420" width="580" height="90" rx="4" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="valence-band-label" x="450" y="471" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Valence Band</text>
<rect id="conduction-band" x="160" y="140" width="580" height="90" rx="4" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="conduction-band-label" x="450" y="191" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Conduction Band</text>
<defs><marker id="arrowhead_band-gap-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="band-gap-arrow" x1="770" y1="230" x2="770" y2="420" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_band-gap-arrow)"/>
<defs><marker id="arrowhead_band-gap-arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="band-gap-arrow-up" x1="770" y1="420" x2="770" y2="230" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_band-gap-arrow-up)"/>
<text id="band-gap-label" x="800" y="328" font-size="11" fill="#e8e8ee" text-anchor="start" font-weight="normal">Band gap ΔE</text>
<circle id="electron-hole-pair" cx="240" cy="175" r="10" fill="#7fd4ff" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<circle id="hole-circle" cx="240" cy="455" r="10" fill="none" stroke="#ff7a8a" stroke-width="2" stroke-dasharray=""/>
<line id="jump-arrow" x1="240" y1="230" x2="240" y2="420" stroke="#ff7a8a" stroke-width="1.8" stroke-dasharray="6,4"/>
<text id="eh-pair-label" x="255" y="328" font-size="10" fill="#ff7a8a" text-anchor="start" font-weight="normal">electron-hole pair</text>
<circle id="extra-electron-1" cx="400" cy="175" r="3" fill="#7fd4ff" stroke="#7fd4ff" stroke-width="1.5" stroke-dasharray=""/>
<circle id="extra-hole-1" cx="400" cy="455" r="3" fill="none" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray=""/>
<circle id="extra-electron-2" cx="460" cy="175" r="-3" fill="#7fd4ff" stroke="#7fd4ff" stroke-width="1.5" stroke-dasharray=""/>
<circle id="extra-hole-2" cx="460" cy="455" r="-3" fill="none" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray=""/>
<text id="low-temp-label" x="220" y="543" font-size="11" fill="rgba(232,232,238,0.7)" text-anchor="start" font-weight="normal">Low T: few pairs, high resistivity</text>
<text id="high-temp-label" x="220" y="118" font-size="11" fill="rgba(232,232,238,0.7)" text-anchor="start" font-weight="normal">High T: many pairs, low resistivity</text>
<text id="pair-count-display" x="450" y="600" font-size="15" fill="#e8e8ee" font-style="italic" text-anchor="middle">n \propto T^{3/2} \cdot e^{-\Delta E / 2kT}</text>
<text id="temp-readout" x="450" y="626" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">T = temperature K</text>
<line id="gap-left-bound" x1="160" y1="230" x2="160" y2="420" stroke="rgba(232,232,238,0.18)" stroke-width="1" stroke-dasharray="3,5"/>
<line id="gap-right-bound" x1="740" y1="230" x2="740" y2="420" stroke="rgba(232,232,238,0.18)" stroke-width="1" stroke-dasharray="3,5"/>
</svg>
