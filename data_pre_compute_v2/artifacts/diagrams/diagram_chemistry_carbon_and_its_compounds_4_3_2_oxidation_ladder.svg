<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="lower-rung" x1="250" y1="470" x2="650" y2="470" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray="6 5"/>
<line id="upper-rung" x1="250" y1="200" x2="650" y2="200" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect id="ethanol-box" x="320" y="440" width="260" height="60" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="ethanol-text" x="450" y="475" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">ethanol (an alcohol)</text>
<rect id="acid-box" x="300" y="170" width="300" height="60" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="acid-text" x="450" y="205" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">ethanoic acid (a carboxylic acid)</text>
<defs><marker id="arrowhead_oxidation-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="oxidation-arrow" x1="450" y1="440" x2="450" y2="230" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_oxidation-arrow)"/>
<text id="oxygen-tag" x="475" y="340" font-size="13" fill="#ff7a8a" text-anchor="start" font-weight="600">+ oxygen</text>
<text id="agent-label" x="560" y="345" font-size="14" fill="rgba(232,232,238,0.85)" font-style="italic" text-anchor="middle">\text{[O] from } K_2Cr_2O_7 / H^+</text>
</svg>