<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="rest-frame-label" x="230" y="60" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Rest frame</text>
<text id="moving-frame-label" x="670" y="60" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Moving frame</text>
<rect id="rod-rest" x="70" y="290" width="320" height="28" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<line id="rest-dim-left" x1="70" y1="250" x2="70" y2="290" stroke="rgba(232,232,238,0.55)" stroke-width="1.2" stroke-dasharray="4 4"/>
<line id="rest-dim-right" x1="390" y1="250" x2="390" y2="290" stroke="rgba(232,232,238,0.55)" stroke-width="1.2" stroke-dasharray="4 4"/>
<defs><marker id="arrowhead_rest-dim-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="rest-dim-arrow" x1="70" y1="262" x2="390" y2="262" stroke="#e8e8ee" stroke-width="1.5" marker-end="url(#arrowhead_rest-dim-arrow)"/>
<text id="rest-length-label" x="222" y="242" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">L_0</text>
<rect id="rod-moving" x="540" y="290" width="200" height="28" rx="3" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<defs><marker id="arrowhead_velocity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="velocity" x1="760" y1="304" x2="850" y2="304" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_velocity)"/>
<text id="velocity-label" x="855" y="302" font-size="13" fill="#9effc9" text-anchor="start" font-weight="600">v</text>
<line id="moving-dim-left" x1="540" y1="250" x2="540" y2="290" stroke="rgba(232,232,238,0.55)" stroke-width="1.2" stroke-dasharray="4 4"/>
<line id="moving-dim-right" x1="740" y1="250" x2="740" y2="290" stroke="rgba(232,232,238,0.55)" stroke-width="1.2" stroke-dasharray="4 4"/>
<defs><marker id="arrowhead_moving-dim-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="moving-dim-arrow" x1="540" y1="262" x2="740" y2="262" stroke="#e8e8ee" stroke-width="1.5" marker-end="url(#arrowhead_moving-dim-arrow)"/>
<text id="length-label" x="560" y="410" font-size="18" fill="#ff7a8a" font-style="italic" text-anchor="middle">L = L_0\sqrt{1 - \frac{v^2}{c^2}}</text>
</svg>