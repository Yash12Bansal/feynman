<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="logit-label" x="230" y="70" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">logits  z</text>
<text id="prob-label" x="670" y="70" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">softmax  p</text>
