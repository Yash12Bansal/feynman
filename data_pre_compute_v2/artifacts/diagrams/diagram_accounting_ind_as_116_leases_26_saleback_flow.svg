<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="seller-lessee-box" x="90" y="250" width="200" height="110" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="seller-lessee-label" x="190" y="295" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">Seller-lessee</text>
<text id="seller-lessee-sub" x="190" y="318" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">owns &amp; uses</text>
<rect id="buyer-lessor-box" x="610" y="250" width="200" height="110" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="buyer-lessor-label" x="710" y="295" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">Buyer-lessor</text>
<text id="buyer-lessor-sub" x="710" y="318" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">buys &amp; leases out</text>
<path id="building-icon" d="M 420 470 L 420 540 L 480 540 L 480 470 L 450 445 Z M 433 495 L 445 495 M 455 495 L 467 495 M 433 515 L 445 515 M 455 515 L 467 515" stroke="#e8e8ee" stroke-width="2" fill="none" stroke-dasharray=""/>
<text id="building-label" x="450" y="560" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">building stays put</text>
<defs><marker id="arrowhead_asset-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="asset-arrow" x1="300" y1="235" x2="600" y2="235" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_asset-arrow)"/>
<text id="asset-label" x="450" y="225" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="600">asset (building)</text>
<defs><marker id="arrowhead_cash-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="cash-arrow" x1="600" y1="300" x2="300" y2="300" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_cash-arrow)"/>
<text id="cash-label" x="450" y="290" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="600">cash</text>
<defs><marker id="arrowhead_lease-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="lease-arrow" x1="600" y1="365" x2="300" y2="365" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_lease-arrow)"/>
<text id="lease-label" x="450" y="390" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">right-of-use (lease)</text>
</svg>
