<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="left-label" x="225" y="52" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Ball on a train</text>
<text id="right-label" x="675" y="52" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Light from a moving source</text>
