<line id="left-ground" x1="60" y1="430" x2="420" y2="430" stroke="rgba(232,232,238,0.45)" stroke-width="1.5" stroke-dasharray=""/>
<path id="left-hatch" d="M 70 430 L 62 444 M 100 430 L 92 444 M 130 430 L 122 444 M 160 430 L 152 444 M 190 430 L 182 444 M 220 430 L 212 444 M 250 430 L 242 444 M 280 430 L 272 444 M 310 430 L 302 444 M 340 430 L 332 444 M 370 430 L 362 444 M 400 430 L 392 444 M 420 430 L 412 444" stroke="rgba(232,232,238,0.45)" stroke-width="1.2" fill="none" stroke-dasharray=""/>
