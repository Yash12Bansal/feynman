<text id="light-c-label" x="718" y="295" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">c</text>
<circle id="platform-observer-right" cx="820" cy="510" r="14" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-right-body" x1="820" y1="524" x2="820" y2="555" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-right-legs-l" x1="820" y1="555" x2="805" y2="575" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-right-legs-r" x1="820" y1="555" x2="835" y2="575" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-right-arms" x1="803" y1="538" x2="837" y2="538" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<text id="wrong-result" x="675" y="555" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">c + u</text>
<line id="cross-1" x1="643" y1="540" x2="707" y2="570" stroke="#ff7a8a" stroke-width="3" stroke-dasharray=""/>
<line id="cross-2" x1="707" y1="540" x2="643" y2="570" stroke="#ff7a8a" stroke-width="3" stroke-dasharray=""/>
<text id="correct-result" x="675" y="600" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Platform still measures: c</text>
<text id="left-caption" x="225" y="620" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Speeds add — Galilean relativity</text>
<text id="right-caption" x="675" y="620" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Speed of light is invariant — always c</text>
</svg>