<text id="ball-u-label" x="237" y="347" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">u</text>
<circle id="platform-observer-left" cx="390" cy="510" r="14" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-left-body" x1="390" y1="524" x2="390" y2="555" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-left-legs-l" x1="390" y1="555" x2="375" y2="575" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-left-legs-r" x1="390" y1="555" x2="405" y2="575" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-left-arms" x1="373" y1="538" x2="407" y2="538" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<text id="galilean-result" x="225" y="560" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Platform sees: v + u</text>
<line id="right-ground" x1="480" y1="430" x2="840" y2="430" stroke="rgba(232,232,238,0.45)" stroke-width="1.5" stroke-dasharray=""/>
<path id="right-hatch" d="M 490 430 L 482 444 M 520 430 L 512 444 M 550 430 L 542 444 M 580 430 L 572 444 M 610 430 L 602 444 M 640 430 L 632 444 M 670 430 L 662 444 M 700 430 L 692 444 M 730 430 L 722 444 M 760 430 L 752 444 M 790 430 L 782 444 M 820 430 L 812 444" stroke="rgba(232,232,238,0.45)" stroke-width="1.2" fill="none" stroke-dasharray=""/>
<path id="rocket-body" d="M 530 355 L 600 355 L 615 375 L 600 395 L 530 395 Z" stroke="#e8e8ee" stroke-width="2" fill="none" stroke-dasharray=""/>
<path id="rocket-fin" d="M 530 390 L 510 410 L 530 395 Z" stroke="#e8e8ee" stroke-width="1.8" fill="none" stroke-dasharray=""/>
<defs><marker id="arrowhead_rocket-velocity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="rocket-velocity" x1="615" y1="375" x2="680" y2="375" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_rocket-velocity)"/>
