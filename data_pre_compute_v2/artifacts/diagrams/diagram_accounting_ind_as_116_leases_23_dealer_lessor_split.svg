<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="asset-box" x="90" y="285" width="90" height="80" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="asset-label" x="135" y="390" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Asset</text>
<line id="commencement-line" x1="320" y1="120" x2="320" y2="540" stroke="#7fd4ff" stroke-width="2" stroke-dasharray="6 5"/>
<text id="commencement-label" x="320" y="108" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">Commencement (day 1)</text>
<line id="asset-to-node" x1="180" y1="325" x2="320" y2="325" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_sale-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="sale-branch" x1="320" y1="325" x2="760" y2="210" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_sale-branch)"/>
<text id="sale-branch-label" x="470" y="248" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Sale</text>
<text id="sale-formula" x="480" y="282" font-size="13" fill="#9effc9" font-style="italic" text-anchor="middle">\text{Revenue} - \text{Cost} = \text{Profit}</text>
<circle id="selling-profit-marker" cx="760" cy="210" r="9" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="selling-profit-label" x="778" y="196" font-size="12" fill="#9effc9" text-anchor="start" font-weight="600">selling profit (one-off)</text>
<defs><marker id="arrowhead_lease-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="lease-branch" x1="320" y1="325" x2="760" y2="440" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_lease-branch)"/>
<text id="lease-branch-label" x="470" y="415" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Finance lease</text>
<text id="lease-formula" x="470" y="455" font-size="13" fill="#7fd4ff" font-style="italic" text-anchor="middle">\text{Net investment in lease}</text>
<g id="finance-income-stream" transform="translate(0,0)"><defs><marker id="arrowhead_fi-1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="fi-1" x1="470" y1="510" x2="470" y2="475" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrowhead_fi-1)"/><defs><marker id="arrowhead_fi-2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="fi-2" x1="545" y1="510" x2="545" y2="475" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrowhead_fi-2)"/><defs><marker id="arrowhead_fi-3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="fi-3" x1="620" y1="510" x2="620" y2="470" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrowhead_fi-3)"/><defs><marker id="arrowhead_fi-4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="fi-4" x1="695" y1="510" x2="695" y2="465" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrowhead_fi-4)"/><defs><marker id="arrowhead_fi-5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="fi-5" x1="770" y1="510" x2="770" y2="460" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrowhead_fi-5)"/></g>
<text id="finance-income-label" x="620" y="535" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">finance income each period</text>
</svg>
