<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="named-asset-box" x="300" y="30" width="300" height="56" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="named-asset-label" x="450" y="63" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">Contract names a specific asset</text>
<line id="lead-in" x1="450" y1="86" x2="450" y2="130" stroke="rgba(232,232,238,0.55)" stroke-width="2" stroke-dasharray=""/>
<path id="gate-practical" d="M 450 130 L 580 200 L 450 270 L 320 200 Z" stroke="#7fd4ff" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<text id="gate-practical-label-1" x="450" y="192" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">Can supplier practically</text>
<text id="gate-practical-label-2" x="450" y="208" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">swap it during use?</text>
<path id="gate-economic" d="M 450 320 L 580 390 L 450 460 L 320 390 Z" stroke="#7fd4ff" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<text id="gate-economic-label-1" x="450" y="382" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">Does supplier benefit</text>
<text id="gate-economic-label-2" x="450" y="398" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">economically from swap?</text>
<defs><marker id="arrowhead_arrow-practical-yes" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="arrow-practical-yes" x1="450" y1="270" x2="450" y2="320" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_arrow-practical-yes)"/>
<text id="arrow-practical-yes-label" x="462" y="298" font-size="11" fill="#9effc9" text-anchor="start" font-weight="600">YES</text>
<defs><marker id="arrowhead_arrow-economic-yes" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="arrow-economic-yes" x1="580" y1="390" x2="700" y2="390" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_arrow-economic-yes)"/>
<text id="arrow-economic-yes-label" x="640" y="380" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="600">YES</text>
<rect id="outcome-no-lease" x="700" y="350" width="170" height="80" rx="6" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<text id="outcome-no-lease-label-1" x="785" y="378" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Substantive right</text>
<text id="outcome-no-lease-label-2" x="785" y="394" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">no identified asset</text>
<text id="outcome-no-lease-label-3" x="785" y="410" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">no lease</text>
<defs><marker id="arrowhead_arrow-no-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="arrow-no-branch" x1="320" y1="200" x2="150" y2="200" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_arrow-no-branch)"/>
<line id="no-branch-vert-practical" x1="150" y1="200" x2="150" y2="545" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_no-branch-economic" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="no-branch-economic" x1="320" y1="390" x2="150" y2="390" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_no-branch-economic)"/>
<defs><marker id="arrowhead_no-branch-into-outcome" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="no-branch-into-outcome" x1="150" y1="545" x2="300" y2="545" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_no-branch-into-outcome)"/>
<text id="arrow-no-branch-label-1" x="235" y="192" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">NO</text>
<text id="arrow-no-branch-label-2" x="235" y="382" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">NO</text>
<rect id="outcome-identified" x="300" y="520" width="300" height="80" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="outcome-identified-label-1" x="450" y="548" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="normal">Not substantive</text>
<text id="outcome-identified-label-2" x="450" y="564" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="normal">asset is identified</text>
<text id="outcome-identified-label-3" x="450" y="580" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="600">lease can exist</text>
</svg>
