<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
<rect x="0" y="0" width="900" height="580" fill="#fafafa"/>
<text id="gf_title" x="450" y="38" font-size="24" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Why the Horse and Cart Actually Move</text>
<text id="gf_subtitle" x="450" y="62" font-size="15" fill="#555" text-anchor="middle" font-weight="normal">The ground pushes the horse forward — that is the key!</text>
<rect id="gf_ground" x="50" y="390" width="800" height="30" rx="0" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
<text id="gf_ground_label" x="450" y="438" font-size="14" fill="#5d4037" text-anchor="middle" font-weight="normal">Ground / Road</text>
<rect id="gf_horse_body" x="180" y="270" width="160" height="110" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text id="gf_horse_text" x="260" y="322" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">HORSE</text>
<text id="gf_horse_mass" x="260" y="345" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">pushes hooves back</text>
<rect id="gf_cart_body" x="540" y="280" width="200" height="100" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
<text id="gf_cart_text" x="640" y="328" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">CART</text>
<text id="gf_cart_mass" x="640" y="350" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">wheels roll on road</text>
<line id="gf_rope" x1="340" y1="325" x2="540" y2="325" stroke="#795548" stroke-width="6" stroke-dasharray=""/>
<text id="gf_rope_label" x="440" y="315" font-size="13" fill="#795548" text-anchor="middle" font-weight="normal">rope</text>
<circle id="gf_wheel1" cx="580" cy="390" r="18" fill="#90a4ae" stroke="#455a64" stroke-width="2" stroke-dasharray=""/>
<circle id="gf_wheel2" cx="700" cy="390" r="18" fill="#90a4ae" stroke="#455a64" stroke-width="2" stroke-dasharray=""/>
<circle id="gf_hoof1" cx="220" cy="390" r="10" fill="#4e342e" stroke="#3e2723" stroke-width="2" stroke-dasharray=""/>
<circle id="gf_hoof2" cx="300" cy="390" r="10" fill="#4e342e" stroke="#3e2723" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_gf_ground_horse_fwd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="gf_ground_horse_fwd" x1="260" y1="388" x2="260" y2="240" stroke="#4CAF50" stroke-width="5" marker-end="url(#arrowhead_gf_ground_horse_fwd)"/>
<rect id="gf_gnd_horse_bg" x="60" y="245" width="165" height="52" rx="6" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1"/>
<text id="gf_gnd_horse_lbl1" x="143" y="263" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">Ground pushes horse</text>
<text id="gf_gnd_horse_lbl2" x="143" y="280" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="normal">FORWARD (friction)</text>
<text id="gf_gnd_horse_val" x="143" y="298" font-size="13" fill="#2e7d32" font-style="italic" text-anchor="middle">900\text{ N}</text>
<defs><marker id="arrowhead_gf_cart_pull_horse" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="gf_cart_pull_horse" x1="540" y1="325" x2="370" y2="325" stroke="#D32F2F" stroke-width="4" marker-end="url(#arrowhead_gf_cart_pull_horse)"/>
<text id="gf_cart_pull_lbl1" x="440" y="355" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">Cart pulls horse BACK</text>
<text id="gf_cart_pull_val" x="440" y="375" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">500\text{ N}</text>
<defs><marker id="arrowhead_gf_horse_pull_cart" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="gf_horse_pull_cart" x1="340" y1="305" x2="510" y2="305" stroke="#4CAF50" stroke-width="4" marker-end="url(#arrowhead_gf_horse_pull_cart)"/>
<text id="gf_horse_pull_lbl1" x="440" y="292" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">Horse pulls cart FORWARD</text>
<text id="gf_horse_pull_val" x="440" y="275" font-size="13" fill="#2e7d32" font-style="italic" text-anchor="middle">500\text{ N}</text>
<defs><marker id="arrowhead_gf_road_cart_back" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="gf_road_cart_back" x1="640" y1="388" x2="640" y2="360" stroke="#D32F2F" stroke-width="4" marker-end="url(#arrowhead_gf_road_cart_back)"/>
<rect id="gf_road_cart_bg" x="720" y="340" width="145" height="52" rx="6" fill="#ffebee" stroke="#D32F2F" stroke-width="1"/>
<text id="gf_road_cart_lbl1" x="793" y="358" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">Road friction on</text>
<text id="gf_road_cart_lbl2" x="793" y="375" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="normal">cart BACKWARD</text>
<text id="gf_road_cart_val" x="793" y="393" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">100\text{ N}</text>
<defs><marker id="arrowhead_gf_motion_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="gf_motion_arrow" x1="200" y1="200" x2="760" y2="200" stroke="#FF9800" stroke-width="5" marker-end="url(#arrowhead_gf_motion_arrow)"/>
<text id="gf_motion_label" x="480" y="190" font-size="15" fill="#e65100" text-anchor="middle" font-weight="bold">Direction of motion</text>
<rect id="gf_summary_box" x="130" y="470" width="640" height="90" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text id="gf_sum1" x="450" y="494" font-size="14" fill="#bf360c" text-anchor="middle" font-weight="normal">Horse: 900 N forward (ground) - 500 N backward (cart) = 400 N net forward</text>
<text id="gf_sum2" x="450" y="516" font-size="14" fill="#bf360c" text-anchor="middle" font-weight="normal">Cart:  500 N forward (horse) - 100 N backward (road) = 400 N net forward</text>
<text id="gf_sum3" x="450" y="542" font-size="14" fill="#bf360c" text-anchor="middle" font-weight="bold">Same net force on both — they accelerate together!</text>
<text id="gf_star_label" x="260" y="218" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">★ The crucial force!</text>
</svg>