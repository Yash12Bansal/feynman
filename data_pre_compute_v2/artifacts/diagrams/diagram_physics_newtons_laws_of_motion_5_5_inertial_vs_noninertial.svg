<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680">
<rect x="0" y="0" width="900" height="680" fill="#ffffff"/>
<text id="main_title" x="450" y="38" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Pseudo Forces: Two Frames of Reference</text>
<line id="divider" x1="450" y1="60" x2="450" y2="650" stroke="#cccccc" stroke-width="2" stroke-dasharray="8,5"/>
<text id="left_header" x="225" y="78" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">Ground Observer (Inertial Frame)</text>
<text id="right_header" x="675" y="78" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">Inside the Car (Noninertial Frame)</text>
<rect id="left_car_body" x="60" y="130" width="320" height="160" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<circle id="left_wheel1" cx="120" cy="295" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<circle id="left_wheel2" cx="320" cy="295" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<line id="left_ceiling_mount" x1="220" y1="130" x2="220" y2="145" stroke="#555" stroke-width="4" stroke-dasharray=""/>
<line id="left_string" x1="220" y1="145" x2="220" y2="255" stroke="#555" stroke-width="2.5" stroke-dasharray=""/>
<circle id="left_bob" cx="220" cy="265" r="14" fill="#1565c0" stroke="#0d47a1" stroke-width="2" stroke-dasharray=""/>
<text id="left_bob_label" x="245" y="270" font-size="13" fill="#1565c0" text-anchor="start" font-weight="normal">bob</text>
<defs><marker id="arrowhead_left_car_accel" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker></defs><line id="left_car_accel" x1="310" y1="210" x2="400" y2="210" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowhead_left_car_accel)"/>
<text id="left_accel_label" x="395" y="200" font-size="14" fill="#2e7d32" font-style="italic" text-anchor="middle">a_{frame}</text>
<defs><marker id="arrowhead_left_bob_inertia" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#888"/></marker></defs><line id="left_bob_inertia" x1="220" y1="340" x2="220" y2="340" stroke="#888" stroke-width="1" marker-end="url(#arrowhead_left_bob_inertia)"/>
<text id="left_explanation" x="225" y="345" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Bob stays put (inertia).</text>
<text id="left_explanation2" x="225" y="365" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Car moves forward under it.</text>
<text id="left_forces_title" x="225" y="400" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Forces on bob:</text>
<defs><marker id="arrowhead_left_tension_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="left_tension_arrow" x1="155" y1="460" x2="155" y2="420" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_left_tension_arrow)"/>
<text id="left_tension_label" x="138" y="418" font-size="14" fill="#FF9800" font-style="italic" text-anchor="middle">T</text>
<defs><marker id="arrowhead_left_gravity_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="left_gravity_arrow" x1="225" y1="420" x2="225" y2="460" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arrowhead_left_gravity_arrow)"/>
<text id="left_gravity_label" x="235" y="465" font-size="14" fill="#4CAF50" font-style="italic" text-anchor="middle">mg</text>
<text id="left_no_pseudo" x="225" y="500" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">No pseudo force needed!</text>
<text id="left_newton" x="225" y="530" font-size="13" fill="#2e7d32" font-style="italic" text-anchor="middle">\sum F = ma \text{ works directly}</text>
<rect id="right_car_body" x="510" y="130" width="320" height="160" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
<circle id="right_wheel1" cx="570" cy="295" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<circle id="right_wheel2" cx="770" cy="295" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<line id="right_ceiling_mount" x1="670" y1="130" x2="670" y2="145" stroke="#555" stroke-width="4" stroke-dasharray=""/>
<line id="right_string" x1="670" y1="145" x2="640" y2="248" stroke="#555" stroke-width="2.5" stroke-dasharray=""/>
<circle id="right_bob" cx="633" cy="258" r="14" fill="#1565c0" stroke="#0d47a1" stroke-width="2" stroke-dasharray=""/>
<text id="right_bob_label" x="615" y="258" font-size="13" fill="#1565c0" text-anchor="end" font-weight="normal">bob</text>
<path id="right_angle_arc" d="M 670.0 185.0 A 40.0 40.0 0 0 1 656.3191942669732 182.58770483143633" stroke="#888" stroke-width="1.5" fill="none"/>
<text id="right_angle_label" x="650" y="192" font-size="14" fill="#555" font-style="italic" text-anchor="middle">\theta</text>
<line id="right_vertical_ref" x1="670" y1="145" x2="670" y2="200" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
<text id="right_explanation" x="675" y="345" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Bob appears stationary at angle.</text>
<text id="right_explanation2" x="675" y="365" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Must explain equilibrium!</text>
<text id="right_forces_title" x="675" y="400" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Forces on bob (in car frame):</text>
<circle id="right_force_bob" cx="675" cy="450" r="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_right_tension_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="right_tension_arrow" x1="675" y1="450" x2="695" y2="415" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_right_tension_arrow)"/>
<text id="right_tension_label" x="705" y="410" font-size="14" fill="#FF9800" font-style="italic" text-anchor="middle">T</text>
<defs><marker id="arrowhead_right_gravity_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="right_gravity_arrow" x1="675" y1="450" x2="675" y2="490" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arrowhead_right_gravity_arrow)"/>
<text id="right_gravity_label" x="688" y="498" font-size="14" fill="#4CAF50" font-style="italic" text-anchor="middle">mg</text>
<defs><marker id="arrowhead_right_pseudo_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="right_pseudo_arrow" x1="675" y1="450" x2="620" y2="450" stroke="#D32F2F" stroke-width="2.5" marker-end="url(#arrowhead_right_pseudo_arrow)"/>
<text id="right_pseudo_label" x="590" y="438" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">F_{pseudo} = -ma_{frame}</text>
<text id="right_pseudo_note" x="675" y="530" font-size="13" fill="#c62828" text-anchor="middle" font-weight="normal">Pseudo force added to restore</text>
<text id="right_pseudo_note2" x="675" y="548" font-size="13" fill="#c62828" text-anchor="middle" font-weight="normal">Newton&#x27;s 2nd Law in this frame.</text>
<text id="right_angle_formula" x="675" y="580" font-size="15" fill="#c62828" font-style="italic" text-anchor="middle">\tan\theta = \frac{a_{frame}}{g}</text>
<rect id="key_box" x="60" y="610" width="780" height="55" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
<text id="key_title" x="130" y="630" font-size="13" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Key Idea:</text>
<text id="key_text" x="530" y="630" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Pseudo force = -(mass) x (frame acceleration). It is NOT real — it is a bookkeeping tool for noninertial frames.</text>
<rect id="pseudo_highlight" x="510" y="425" width="210" height="30" rx="5" fill="none" stroke="#D32F2F" stroke-width="1.5"/>
</svg>