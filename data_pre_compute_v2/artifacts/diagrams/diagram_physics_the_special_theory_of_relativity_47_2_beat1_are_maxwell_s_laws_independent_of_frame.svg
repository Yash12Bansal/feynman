<defs><marker id="arrowhead_light-direction" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="light-direction" x1="804" y1="370" x2="830" y2="370" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_light-direction)"/>
<text id="c-label" x="745" y="350" font-size="13" fill="#9effc9" font-style="italic" text-anchor="middle">c</text>
<text id="maxwell-speed" x="675" y="510" font-size="15" fill="rgba(232,232,238,0.7)" font-style="italic" text-anchor="middle">c = \frac{1}{\sqrt{\mu_0 \varepsilon_0}}</text>
<text id="maxwell-caption" x="675" y="580" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">predicts one fixed speed</text>
<text id="question-mark" x="450" y="325" font-size="36" fill="rgba(232,232,238,0.18)" text-anchor="middle" font-weight="600">?</text>
</svg>