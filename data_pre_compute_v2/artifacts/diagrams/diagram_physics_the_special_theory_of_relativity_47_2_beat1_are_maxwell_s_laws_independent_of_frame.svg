<line id="observer-left-arm2" x1="225" y1="310" x2="250" y2="328" stroke="#7fd4ff" stroke-width="1.8" stroke-dasharray=""/>
<line id="observer-left-leg1" x1="225" y1="340" x2="208" y2="370" stroke="#7fd4ff" stroke-width="1.8" stroke-dasharray=""/>
<line id="observer-left-leg2" x1="225" y1="340" x2="242" y2="370" stroke="#7fd4ff" stroke-width="1.8" stroke-dasharray=""/>
<text id="newton-relativity" x="225" y="510" font-size="15" fill="rgba(232,232,238,0.7)" font-style="italic" text-anchor="middle">F = ma</text>
<text id="newton-caption" x="225" y="580" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">same in all inertial frames</text>
