<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="speeding-label" x="230" y="130" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Speeding up</text>
<text id="slowing-label" x="670" y="130" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Slowing down</text>
<rect id="block-speeding" x="110" y="250" width="60" height="60" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<defs><marker id="arrowhead_velocity-speeding" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="velocity-speeding" x1="170" y1="240" x2="340" y2="240" stroke="#7fd4ff" stroke-width="3" marker-end="url(#arrowhead_velocity-speeding)"/>
<defs><marker id="arrowhead_accel-speeding" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="accel-speeding" x1="170" y1="350" x2="320" y2="350" stroke="#9effc9" stroke-width="3" marker-end="url(#arrowhead_accel-speeding)"/>
<text id="v-speeding-label" x="348" y="246" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">\vec{v}</text>
<text id="a-speeding-label" x="328" y="356" font-size="16" fill="#9effc9" font-style="italic" text-anchor="middle">\vec{a}</text>
<rect id="block-slowing" x="550" y="250" width="60" height="60" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<defs><marker id="arrowhead_velocity-slowing" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="velocity-slowing" x1="610" y1="240" x2="780" y2="240" stroke="#7fd4ff" stroke-width="3" marker-end="url(#arrowhead_velocity-slowing)"/>
<defs><marker id="arrowhead_accel-slowing" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="accel-slowing" x1="760" y1="350" x2="590" y2="350" stroke="#ff7a8a" stroke-width="3" marker-end="url(#arrowhead_accel-slowing)"/>
<text id="v-slowing-label" x="788" y="246" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">\vec{v}</text>
<text id="a-slowing-label" x="562" y="356" font-size="16" fill="#ff7a8a" font-style="italic" text-anchor="middle">\vec{a}</text>
<text id="speeding-caption" x="230" y="430" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">a parallel to v</text>
<text id="slowing-caption" x="670" y="430" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">a opposite to v</text>
</svg>