<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<defs><marker id="arrowhead_time-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="time-axis" x1="130" y1="500" x2="800" y2="500" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_time-axis)"/>
<defs><marker id="arrowhead_force-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="force-axis" x1="130" y1="500" x2="130" y2="110" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_force-axis)"/>
<text id="time-axis-label" x="770" y="528" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">time (ms)</text>
<text id="force-axis-label" x="150" y="120" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="start" font-weight="normal">force (N)</text>
<path id="area-shade" d="M 380 500 C 420 500 430 180 460 180 C 490 180 500 500 540 500 Z" stroke="none" stroke-width="0" fill="rgba(159,255,201,0.18)" stroke-dasharray=""/>
<path id="force-curve" d="M 380 500 C 420 500 430 180 460 180 C 490 180 500 500 540 500" stroke="#7fd4ff" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<line id="ti-line" x1="380" y1="500" x2="380" y2="520" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<line id="tf-line" x1="540" y1="500" x2="540" y2="520" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_contact-interval" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="contact-interval" x1="380" y1="545" x2="540" y2="545" stroke="#ff7a8a" stroke-width="2" marker-end="url(#arrowhead_contact-interval)"/>
<defs><marker id="arrowhead_contact-interval-back" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="contact-interval-back" x1="540" y1="545" x2="380" y2="545" stroke="#ff7a8a" stroke-width="2" marker-end="url(#arrowhead_contact-interval-back)"/>
<text id="ti-label" x="378" y="538" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">t_i</text>
<text id="tf-label" x="542" y="538" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">t_f</text>
<text id="contact-label" x="460" y="575" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">brief contact</text>
<circle id="peak-marker" cx="460" cy="180" r="6" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<line id="peak-guide" x1="130" y1="180" x2="460" y2="180" stroke="rgba(232,232,238,0.35)" stroke-width="1" stroke-dasharray="5 5"/>
<text id="peak-text" x="472" y="175" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">F_{max}</text>
<text id="impulse-text" x="600" y="320" font-size="16" fill="#9effc9" font-style="italic" text-anchor="middle">J = \int F\,dt</text>
</svg>