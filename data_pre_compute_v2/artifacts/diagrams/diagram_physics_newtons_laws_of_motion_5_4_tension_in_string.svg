<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="ts_title" x="450" y="40" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Tension in a String</text>
<line id="ts_center_div" x1="450" y1="60" x2="450" y2="630" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>
<text id="ts_left_title" x="225" y="75" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold">Massless String (ideal)</text>
<text id="ts_right_title" x="675" y="75" font-size="16" fill="#6a1b9a" text-anchor="middle" font-weight="bold">Massive String (real)</text>
<rect id="ts_left_ceiling" x="150" y="95" width="150" height="14" rx="2" fill="#b0bec5" stroke="#555" stroke-width="2"/>
<line id="ts_left_h1" x1="160" y1="95" x2="148" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_left_h2" x1="185" y1="95" x2="173" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_left_h3" x1="210" y1="95" x2="198" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_left_h4" x1="235" y1="95" x2="223" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_left_h5" x1="260" y1="95" x2="248" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_left_string" x1="225" y1="109" x2="225" y2="300" stroke="#1565C0" stroke-width="4" stroke-dasharray=""/>
<rect id="ts_left_block" x="185" y="300" width="80" height="55" rx="4" fill="#90caf9" stroke="#1565C0" stroke-width="2.5"/>
<text id="ts_left_block_label" x="225" y="333" font-size="13" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Block M</text>
<text id="ts_left_t_top" x="130" y="140" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">T = Mg</text>
<text id="ts_left_t_mid" x="130" y="210" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">T = Mg</text>
<text id="ts_left_t_bot" x="130" y="285" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">T = Mg</text>
<line id="ts_left_tick1" x1="215" y1="140" x2="235" y2="140" stroke="#D32F2F" stroke-width="2" stroke-dasharray=""/>
<line id="ts_left_tick2" x1="215" y1="210" x2="235" y2="210" stroke="#D32F2F" stroke-width="2" stroke-dasharray=""/>
<line id="ts_left_tick3" x1="215" y1="280" x2="235" y2="280" stroke="#D32F2F" stroke-width="2" stroke-dasharray=""/>
<line id="ts_left_connect1" x1="155" y1="140" x2="215" y2="140" stroke="#D32F2F" stroke-width="1" stroke-dasharray="3,3"/>
<line id="ts_left_connect2" x1="155" y1="210" x2="215" y2="210" stroke="#D32F2F" stroke-width="1" stroke-dasharray="3,3"/>
<line id="ts_left_connect3" x1="155" y1="280" x2="215" y2="280" stroke="#D32F2F" stroke-width="1" stroke-dasharray="3,3"/>
<rect id="ts_left_key" x="60" y="390" width="330" height="55" rx="6" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
<text id="ts_left_key1" x="225" y="410" font-size="12" fill="#0d47a1" text-anchor="middle" font-weight="bold">Massless string: tension is the same</text>
<text id="ts_left_key2" x="225" y="428" font-size="12" fill="#0d47a1" text-anchor="middle" font-weight="normal">everywhere along the string.</text>
<text id="ts_left_eq" x="225" y="448" font-size="14" fill="#D32F2F" font-style="italic" text-anchor="middle">T_{\text{everywhere}} = Mg</text>
<rect id="ts_right_ceiling" x="600" y="95" width="150" height="14" rx="2" fill="#b0bec5" stroke="#555" stroke-width="2"/>
<line id="ts_right_h1" x1="610" y1="95" x2="598" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_right_h2" x1="635" y1="95" x2="623" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_right_h3" x1="660" y1="95" x2="648" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_right_h4" x1="685" y1="95" x2="673" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<line id="ts_right_h5" x1="710" y1="95" x2="698" y2="82" stroke="#888" stroke-width="1.5" stroke-dasharray=""/>
<rect id="ts_right_string_seg1" x="666" y="109" width="18" height="64" rx="2" fill="#ce93d8" stroke="#6a1b9a" stroke-width="2"/>
<rect id="ts_right_string_seg2" x="666" y="173" width="18" height="64" rx="2" fill="#ba68c8" stroke="#6a1b9a" stroke-width="2"/>
<rect id="ts_right_string_seg3" x="666" y="237" width="18" height="63" rx="2" fill="#ab47bc" stroke="#6a1b9a" stroke-width="2"/>
<text id="ts_right_seg1_label" x="657" y="143" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">m/3</text>
<text id="ts_right_seg2_label" x="657" y="207" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">m/3</text>
<text id="ts_right_seg3_label" x="657" y="270" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">m/3</text>
<rect id="ts_right_block" x="635" y="300" width="80" height="55" rx="4" fill="#90caf9" stroke="#1565C0" stroke-width="2.5"/>
<text id="ts_right_block_label" x="675" y="333" font-size="13" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Block M</text>
<text id="ts_right_t_top" x="790" y="118" font-size="12" fill="#D32F2F" text-anchor="start" font-weight="bold">T(top) = Mg + mg</text>
<text id="ts_right_t_mid" x="790" y="210" font-size="12" fill="#D32F2F" text-anchor="start" font-weight="bold">T(mid) = Mg + mg/2</text>
<text id="ts_right_t_bot" x="790" y="298" font-size="12" fill="#D32F2F" text-anchor="start" font-weight="bold">T(bot) = Mg</text>
<line id="ts_right_tick1" x1="684" y1="118" x2="790" y2="118" stroke="#D32F2F" stroke-width="1" stroke-dasharray="3,3"/>
<line id="ts_right_tick2" x1="684" y1="210" x2="790" y2="210" stroke="#D32F2F" stroke-width="1" stroke-dasharray="3,3"/>
<line id="ts_right_tick3" x1="684" y1="298" x2="790" y2="298" stroke="#D32F2F" stroke-width="1" stroke-dasharray="3,3"/>
<defs><marker id="arrowhead_ts_right_arrow_top" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="ts_right_arrow_top" x1="675" y1="109" x2="675" y2="80" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_ts_right_arrow_top)"/>
<defs><marker id="arrowhead_ts_right_arrow_mid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="ts_right_arrow_mid" x1="675" y1="173" x2="675" y2="144" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_ts_right_arrow_mid)"/>
<defs><marker id="arrowhead_ts_right_arrow_bot" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="ts_right_arrow_bot" x1="675" y1="237" x2="675" y2="208" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_ts_right_arrow_bot)"/>
<rect id="ts_right_key" x="470" y="390" width="390" height="70" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
<text id="ts_right_key1" x="665" y="410" font-size="12" fill="#4a148c" text-anchor="middle" font-weight="bold">Massive string: tension increases from bottom to top.</text>
<text id="ts_right_key2" x="665" y="428" font-size="11" fill="#4a148c" text-anchor="middle" font-weight="normal">Top must support block AND the entire string weight.</text>
<text id="ts_right_key3" x="665" y="446" font-size="11" fill="#4a148c" text-anchor="middle" font-weight="normal">Bottom only supports the block.</text>
<text id="ts_fbd_title" x="450" y="500" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Free-Body Diagram: Cut the string at any point</text>
<line id="ts_fbd_string_top" x1="450" y1="515" x2="450" y2="540" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<line id="ts_fbd_cut" x1="430" y1="540" x2="470" y2="540" stroke="#D32F2F" stroke-width="2.5" stroke-dasharray="5,3"/>
<text id="ts_fbd_cut_label" x="490" y="544" font-size="11" fill="#D32F2F" text-anchor="start" font-weight="bold">cut here</text>
<line id="ts_fbd_string_bot" x1="450" y1="540" x2="450" y2="565" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<defs><marker id="arrowhead_ts_fbd_t_up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="ts_fbd_t_up" x1="450" y1="540" x2="450" y2="515" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_ts_fbd_t_up)"/>
<defs><marker id="arrowhead_ts_fbd_t_down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="ts_fbd_t_down" x1="450" y1="540" x2="450" y2="565" stroke="#1565C0" stroke-width="3" marker-end="url(#arrowhead_ts_fbd_t_down)"/>
<text id="ts_fbd_t_up_label" x="390" y="525" font-size="11" fill="#e65100" text-anchor="end" font-weight="bold">Upper part</text>
<text id="ts_fbd_t_up_label2" x="390" y="538" font-size="11" fill="#e65100" text-anchor="end" font-weight="normal">pulls up</text>
<text id="ts_fbd_t_down_label" x="510" y="558" font-size="11" fill="#1565C0" text-anchor="start" font-weight="bold">Lower part</text>
<text id="ts_fbd_t_down_label2" x="510" y="571" font-size="11" fill="#1565C0" text-anchor="start" font-weight="normal">pulls down</text>
<text id="ts_fbd_3rd_law" x="450" y="600" font-size="12" fill="#1a1a2e" text-anchor="middle" font-weight="bold">These two pulls are a Newton&#x27;s Third Law pair — equal magnitude, opposite direction!</text>
<text id="ts_fbd_tension_def" x="450" y="620" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">Their common magnitude is the TENSION at that point.</text>
</svg>