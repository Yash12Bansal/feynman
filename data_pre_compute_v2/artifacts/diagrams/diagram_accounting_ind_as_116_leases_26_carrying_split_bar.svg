<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="full-carrying-bar" x="150" y="270" width="600" height="90" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="carrying-label" x="450" y="250" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">Previous carrying amount</text>
<rect id="retained-portion" x="150" y="270" width="360" height="90" rx="4" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<rect id="transferred-portion" x="510" y="270" width="240" height="90" rx="4" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<line id="split-divider" x1="510" y1="260" x2="510" y2="370" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text id="retained-label" x="330" y="320" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">Rights retained</text>
<text id="retained-sub" x="330" y="400" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">carried as right-of-use asset</text>
<text id="transferred-label" x="630" y="320" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="600">Rights transferred</text>
<defs><marker id="arrowhead_gain-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="gain-arrow" x1="630" y1="440" x2="630" y2="375" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_gain-arrow)"/>
<text id="gain-label" x="630" y="462" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">gain or loss recognised here only</text>
</svg>
