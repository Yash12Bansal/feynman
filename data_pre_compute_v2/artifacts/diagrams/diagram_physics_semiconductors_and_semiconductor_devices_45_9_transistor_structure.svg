<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="emitter-region" x="100" y="180" width="220" height="240" rx="4" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<rect id="base-region" x="320" y="180" width="80" height="240" rx="0" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<rect id="collector-region" x="400" y="180" width="220" height="240" rx="4" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="emitter-region-label" x="210" y="305" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Emitter (n)</text>
<text id="base-region-label" x="360" y="298" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">Base</text>
<text id="base-region-label2" x="360" y="313" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">(p)</text>
<text id="collector-region-label" x="510" y="305" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Collector (n)</text>
<line id="eb-junction" x1="320" y1="170" x2="320" y2="430" stroke="rgba(232,232,238,0.85)" stroke-width="2" stroke-dasharray="6,4"/>
<text id="eb-junction-label" x="320" y="155" font-size="10" fill="rgba(232,232,238,0.75)" text-anchor="middle" font-weight="normal">EB junction — forward biased</text>
<line id="cb-junction" x1="400" y1="170" x2="400" y2="430" stroke="rgba(232,232,238,0.85)" stroke-width="2" stroke-dasharray="6,4"/>
<text id="cb-junction-label" x="400" y="140" font-size="10" fill="rgba(232,232,238,0.75)" text-anchor="middle" font-weight="normal">CB junction — reverse biased</text>
<line id="emitter-wire" x1="210" y1="420" x2="210" y2="510" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="emitter-terminal" x1="170" y1="510" x2="250" y2="510" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="emitter-terminal-label" x="210" y="535" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">E</text>
<line id="base-wire" x1="360" y1="420" x2="360" y2="510" stroke="#ff7a8a" stroke-width="2" stroke-dasharray=""/>
<line id="base-terminal" x1="320" y1="510" x2="400" y2="510" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="base-terminal-label" x="360" y="535" font-size="14" fill="#ff7a8a" text-anchor="middle" font-weight="600">B</text>
<line id="collector-wire" x1="510" y1="420" x2="510" y2="510" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<line id="collector-terminal" x1="470" y1="510" x2="550" y2="510" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="collector-terminal-label" x="510" y="535" font-size="14" fill="#9effc9" text-anchor="middle" font-weight="600">C</text>
<defs><marker id="arrowhead_electron-flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="electron-flow-arrow" x1="150" y1="300" x2="580" y2="300" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_electron-flow-arrow)"/>
<text id="electron-flow-label" x="365" y="285" font-size="10" fill="rgba(232,232,238,0.65)" text-anchor="middle" font-weight="normal">electron flow</text>
<text id="ib-label" x="360" y="565" font-size="12" fill="#ff7a8a" font-style="italic" text-anchor="middle">I_B \text{ (tiny)}</text>
<text id="ic-label" x="510" y="565" font-size="12" fill="#9effc9" font-style="italic" text-anchor="middle">I_C \text{ (large)}</text>
<text id="doping-emitter-note" x="210" y="332" font-size="10" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">heavily doped</text>
<text id="doping-collector-note" x="510" y="332" font-size="10" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">mod. doped</text>
<text id="doping-base-note" x="360" y="345" font-size="10" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">thin</text>
</svg>
