<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="x-axis" x1="100" y1="530" x2="780" y2="530" stroke="#e8e8ee" stroke-width="1.8" stroke-dasharray=""/>
<line id="y-axis" x1="100" y1="530" x2="100" y2="80" stroke="#e8e8ee" stroke-width="1.8" stroke-dasharray=""/>
<defs><marker id="arrowhead_x-axis-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="x-axis-arrow" x1="775" y1="530" x2="790" y2="530" stroke="#e8e8ee" stroke-width="1.8" marker-end="url(#arrowhead_x-axis-arrow)"/>
<defs><marker id="arrowhead_y-axis-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="y-axis-arrow" x1="100" y1="85" x2="100" y2="70" stroke="#e8e8ee" stroke-width="1.8" marker-end="url(#arrowhead_y-axis-arrow)"/>
<text id="x-axis-label" x="790" y="545" font-size="13" fill="#e8e8ee" text-anchor="start" font-weight="600">v</text>
<text id="y-axis-label" x="88" y="68" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">p</text>
<text id="origin-label" x="88" y="545" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">0</text>
<line id="c-dashed" x1="720" y1="80" x2="720" y2="530" stroke="#ff7a8a" stroke-width="1.8" stroke-dasharray="7,5"/>
<text id="c-label" x="720" y="555" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">c</text>
<path id="newtonian-curve" d="M 100 530 L 720 90" stroke="rgba(232,232,238,0.5)" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
<text id="newtonian-label" x="560" y="248" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="start" font-weight="normal">p = mv</text>
<path id="relativistic-curve" d="M 100 530 C 280 490 460 420 580 330 C 640 284 675 240 693 196 C 703 170 710 145 714 118 C 716 105 718 93 719 82" stroke="#9effc9" stroke-width="2.8" fill="none" stroke-dasharray=""/>
<text id="relativistic-label" x="598" y="318" font-size="11" fill="#9effc9" text-anchor="start" font-weight="normal">p = γm₀v</text>
<defs><marker id="arrowhead_highlight-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="highlight-arrow" x1="620" y1="175" x2="712" y2="128" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_highlight-arrow)"/>
<text id="highlight-label-line1" x="530" y="162" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">p → ∞</text>
<text id="highlight-label-line2" x="530" y="178" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">as v → c</text>
<rect id="callout-box" x="160" y="130" width="310" height="62" rx="5" fill="none" stroke="#ff7a8a" stroke-width="1.5"/>
<text id="callout-line1" x="315" y="153" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Infinite momentum needed</text>
<text id="callout-line2" x="315" y="169" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">to reach c — impossible for</text>
<text id="callout-line3" x="315" y="185" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">any massive particle</text>
<line id="callout-connector" x1="470" y1="161" x2="718" y2="300" stroke="rgba(255,122,138,0.45)" stroke-width="1.2" stroke-dasharray="4,4"/>
<circle id="diverge-dot" cx="714" cy="118" r="5" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="tick-half-c" x1="410" y1="526" x2="410" y2="534" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<text id="tick-half-c-label" x="410" y="548" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">0.5c</text>
</svg>