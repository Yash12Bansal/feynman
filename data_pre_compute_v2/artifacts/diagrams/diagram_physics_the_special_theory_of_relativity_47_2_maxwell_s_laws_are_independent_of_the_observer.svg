<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="axis" x1="60" y1="340" x2="860" y2="340" stroke="rgba(232,232,238,0.35)" stroke-width="1.5" stroke-dasharray=""/>
<text id="axis-label" x="870" y="344" font-size="12" fill="rgba(232,232,238,0.45)" text-anchor="start" font-weight="normal">x</text>
<circle id="observer-a" cx="140" cy="340" r="16" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="a-label" x="140" y="372" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">A</text>
<text id="a-sublabel" x="140" y="388" font-size="10" fill="rgba(127,212,255,0.65)" text-anchor="middle" font-weight="normal">at rest</text>
<circle id="observer-b" cx="430" cy="340" r="16" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_b-velocity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="b-velocity" x1="448" y1="340" x2="510" y2="340" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_b-velocity)"/>
<text id="b-label" x="430" y="372" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">B</text>
<text id="b-sublabel" x="430" y="388" font-size="10" fill="rgba(158,255,201,0.65)" text-anchor="middle" font-weight="normal">v = 0.5c</text>
<circle id="light-pulse" cx="720" cy="340" r="10" fill="none" stroke="#ffe97a" stroke-width="2.5" stroke-dasharray=""/>
<text id="light-label" x="720" y="322" font-size="10" fill="#ffe97a" text-anchor="middle" font-weight="normal">light pulse</text>
<line id="dist-a-line" x1="140" y1="300" x2="720" y2="300" stroke="#7fd4ff" stroke-width="1.5" stroke-dasharray="6 4"/>
<defs><marker id="arrowhead_dist-a-arrow-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="dist-a-arrow-left" x1="300" y1="300" x2="140" y2="300" stroke="#7fd4ff" stroke-width="1.5" marker-end="url(#arrowhead_dist-a-arrow-left)"/>
<defs><marker id="arrowhead_dist-a-arrow-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="dist-a-arrow-right" x1="560" y1="300" x2="720" y2="300" stroke="#7fd4ff" stroke-width="1.5" marker-end="url(#arrowhead_dist-a-arrow-right)"/>
<text id="dist-a-label" x="430" y="292" font-size="13" fill="#7fd4ff" font-style="italic" text-anchor="middle">d_A = c \cdot t</text>
<line id="dist-b-line" x1="430" y1="260" x2="720" y2="260" stroke="#9effc9" stroke-width="1.5" stroke-dasharray="6 4"/>
<defs><marker id="arrowhead_dist-b-arrow-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="dist-b-arrow-left" x1="540" y1="260" x2="430" y2="260" stroke="#9effc9" stroke-width="1.5" marker-end="url(#arrowhead_dist-b-arrow-left)"/>
<defs><marker id="arrowhead_dist-b-arrow-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="dist-b-arrow-right" x1="610" y1="260" x2="720" y2="260" stroke="#9effc9" stroke-width="1.5" marker-end="url(#arrowhead_dist-b-arrow-right)"/>
<text id="dist-b-label" x="575" y="252" font-size="13" fill="#9effc9" font-style="italic" text-anchor="middle">d_B = c \cdot t \;\text{(?)}</text>
<line id="a-vert-tick" x1="140" y1="295" x2="140" y2="345" stroke="#7fd4ff" stroke-width="1.2" stroke-dasharray="3 3"/>
<line id="b-vert-tick" x1="430" y1="255" x2="430" y2="345" stroke="#9effc9" stroke-width="1.2" stroke-dasharray="3 3"/>
<line id="light-vert-tick" x1="720" y1="255" x2="720" y2="330" stroke="#ffe97a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text id="paradox-label" x="450" y="175" font-size="13" fill="rgba(232,232,238,0.75)" text-anchor="middle" font-weight="normal">Both measure the same distance to the light pulse</text>
<line id="paradox-underline" x1="200" y1="180" x2="700" y2="180" stroke="rgba(232,232,238,0.2)" stroke-width="1" stroke-dasharray=""/>
<text id="postulate-1" x="230" y="490" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Laws of nature identical in all inertial frames</text>
<text id="postulate-2" x="670" y="490" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Speed of light c is the same for every observer</text>
<line id="divider" x1="450" y1="470" x2="450" y2="510" stroke="rgba(232,232,238,0.2)" stroke-width="1" stroke-dasharray=""/>
<text id="postulate-header" x="450" y="460" font-size="11" fill="rgba(232,232,238,0.35)" text-anchor="middle" font-weight="normal">Einstein&#x27;s two postulates</text>
<text id="c-value" x="720" y="410" font-size="12" fill="#ffe97a" font-style="italic" text-anchor="middle">c \approx 3 \times 10^{8}\,\text{m/s}</text>
<text id="consequence-label" x="450" y="555" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">∴ clocks and rulers must differ between frames</text>
</svg>