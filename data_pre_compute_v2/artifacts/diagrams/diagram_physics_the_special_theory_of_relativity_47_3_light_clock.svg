<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="label-rest" x="225" y="72" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">At rest</text>
<text id="label-moving" x="645" y="72" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Moving</text>
<rect id="clock-rest-box" x="155" y="160" width="140" height="260" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<line id="mirror-rest-top" x1="155" y1="160" x2="295" y2="160" stroke="#7fd4ff" stroke-width="5" stroke-dasharray=""/>
<line id="mirror-rest-bottom" x1="155" y1="420" x2="295" y2="420" stroke="#7fd4ff" stroke-width="5" stroke-dasharray=""/>
<defs><marker id="arrowhead_clock-rest-path" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="clock-rest-path" x1="225" y1="400" x2="225" y2="185" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_clock-rest-path)"/>
<defs><marker id="arrowhead_clock-rest-path-down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="clock-rest-path-down" x1="225" y1="185" x2="225" y2="400" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_clock-rest-path-down)"/>
<text id="tick-label-rest" x="312" y="295" font-size="18" fill="#9effc9" font-style="italic" text-anchor="middle">t_0</text>
<rect id="clock-moving-box" x="490" y="160" width="140" height="260" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<rect id="clock-moving-box-shifted" x="630" y="160" width="140" height="260" rx="3" fill="none" stroke="rgba(100,200,255,0.35)" stroke-width="2"/>
<line id="mirror-moving-top" x1="490" y1="160" x2="630" y2="160" stroke="#7fd4ff" stroke-width="5" stroke-dasharray=""/>
<line id="mirror-moving-bottom" x1="490" y1="420" x2="630" y2="420" stroke="#7fd4ff" stroke-width="5" stroke-dasharray=""/>
<line id="mirror-moving-top-shifted" x1="630" y1="160" x2="770" y2="160" stroke="rgba(100,200,255,0.35)" stroke-width="4" stroke-dasharray="5 4"/>
<path id="clock-moving-path" d="M 560 420 L 700 160 L 770 420" stroke="#9effc9" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<defs><marker id="arrowhead_velocity-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="velocity-arrow" x1="490" y1="488" x2="640" y2="488" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_velocity-arrow)"/>
<text id="velocity-label" x="650" y="494" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">v</text>
<text id="tick-label-moving" x="800" y="295" font-size="18" fill="#9effc9" font-style="italic" text-anchor="middle">t &gt; t_0</text>
<line id="divider" x1="440" y1="100" x2="440" y2="560" stroke="rgba(232,232,238,0.18)" stroke-width="1" stroke-dasharray="6 5"/>
<text id="path-length-rest" x="225" y="540" font-size="13" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">d = c \, t_0</text>
<text id="path-length-moving" x="660" y="540" font-size="13" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">d&#x27; = c \, t</text>
</svg>