<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="main_title" x="450" y="38" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Pseudo Forces: Two Frames of Reference</text>
<line id="divider" x1="450" y1="60" x2="450" y2="620" stroke="#cccccc" stroke-width="2" stroke-dasharray="8,4"/>
<text id="left_header" x="225" y="75" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">INERTIAL FRAME (Ground Observer)</text>
<text id="right_header" x="675" y="75" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">NON-INERTIAL FRAME (Inside Car)</text>
<rect id="left_panel" x="20" y="85" width="410" height="510" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
<rect id="right_panel" x="470" y="85" width="410" height="510" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<rect id="left_car_body" x="60" y="160" width="260" height="120" rx="12" fill="#b0bec5" stroke="#455a64" stroke-width="2.5"/>
<rect id="left_car_roof" x="100" y="120" width="180" height="45" rx="8" fill="#90a4ae" stroke="#455a64" stroke-width="2"/>
<circle id="left_wheel1" cx="110" cy="285" r="22" fill="#37474f" stroke="#263238" stroke-width="2" stroke-dasharray=""/>
<circle id="left_wheel2" cx="270" cy="285" r="22" fill="#37474f" stroke="#263238" stroke-width="2" stroke-dasharray=""/>
<circle id="left_person_head" cx="190" cy="175" r="18" fill="#ffcc80" stroke="#e65100" stroke-width="2" stroke-dasharray=""/>
<rect id="left_person_body" x="178" y="193" width="24" height="50" rx="4" fill="#5c6bc0" stroke="#283593" stroke-width="1.5"/>
<line id="left_ground" x1="40" y1="307" x2="390" y2="307" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<defs><marker id="arrowhead_left_car_accel" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker></defs><line id="left_car_accel" x1="330" y1="220" x2="400" y2="220" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowhead_left_car_accel)"/>
<text id="left_accel_label" x="415" y="215" font-size="15" fill="#2e7d32" font-style="italic" text-anchor="middle">a_0</text>
<text id="left_car_label" x="190" y="250" font-size="12" fill="#455a64" text-anchor="middle" font-weight="normal">Car accelerates forward</text>
<defs><marker id="arrowhead_left_net_force" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="left_net_force" x1="190" y1="218" x2="240" y2="218" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_left_net_force)"/>
<text id="left_net_label" x="248" y="210" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">F_{net}</text>
<rect id="left_explanation_box" x="45" y="330" width="370" height="240" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text id="left_exp_title" x="230" y="355" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">What the ground observer sees:</text>
<text id="left_exp1" x="230" y="380" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Person tends to stay at rest (inertia).</text>
<text id="left_exp2" x="230" y="400" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Seat pushes person forward with real force.</text>
<text id="left_exp3" x="230" y="420" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Newton&#x27;s 2nd law works perfectly:</text>
<text id="left_newton" x="230" y="448" font-size="16" fill="#2e7d32" font-style="italic" text-anchor="middle">\sum F = m a_0</text>
<text id="left_exp4" x="230" y="480" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">No pseudo force needed.</text>
<rect id="left_no_pseudo" x="100" y="492" width="260" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
<text id="left_no_pseudo_text" x="230" y="516" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">Inertial Frame:</text>
<text id="left_no_pseudo_text2" x="230" y="540" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">NO pseudo force required</text>
<rect id="right_car_body" x="510" y="160" width="260" height="120" rx="12" fill="#b0bec5" stroke="#455a64" stroke-width="2.5"/>
<rect id="right_car_roof" x="550" y="120" width="180" height="45" rx="8" fill="#90a4ae" stroke="#455a64" stroke-width="2"/>
<circle id="right_wheel1" cx="560" cy="285" r="22" fill="#37474f" stroke="#263238" stroke-width="2" stroke-dasharray=""/>
<circle id="right_wheel2" cx="720" cy="285" r="22" fill="#37474f" stroke="#263238" stroke-width="2" stroke-dasharray=""/>
<circle id="right_person_head" cx="640" cy="175" r="18" fill="#ffcc80" stroke="#e65100" stroke-width="2" stroke-dasharray=""/>
<rect id="right_person_body" x="628" y="193" width="24" height="50" rx="4" fill="#5c6bc0" stroke="#283593" stroke-width="1.5"/>
<line id="right_ground" x1="490" y1="307" x2="860" y2="307" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<defs><marker id="arrowhead_right_pseudo_force" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c62828"/></marker></defs><line id="right_pseudo_force" x1="628" y1="210" x2="555" y2="210" stroke="#c62828" stroke-width="3.5" marker-end="url(#arrowhead_right_pseudo_force)"/>
<text id="right_pseudo_label" x="530" y="200" font-size="14" fill="#c62828" font-style="italic" text-anchor="middle">-ma_0</text>
<text id="right_pseudo_name" x="530" y="225" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">Pseudo Force</text>
<defs><marker id="arrowhead_right_seat_force" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="right_seat_force" x1="652" y1="210" x2="710" y2="210" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_right_seat_force)"/>
<text id="right_seat_label" x="720" y="225" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="normal">Seat force</text>
<rect id="right_explanation_box" x="495" y="330" width="370" height="240" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
<text id="right_exp_title" x="680" y="355" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">What the car passenger sees:</text>
<text id="right_exp1" x="680" y="380" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Person appears stationary in the car.</text>
<text id="right_exp2" x="680" y="400" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Feels pushed backward — but why?</text>
<text id="right_exp3" x="680" y="420" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Add pseudo force to fix Newton&#x27;s law:</text>
<text id="right_newton" x="680" y="448" font-size="15" fill="#c62828" font-style="italic" text-anchor="middle">\sum F + (-ma_0) = 0</text>
<text id="right_exp4" x="680" y="480" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Pseudo force makes the math work.</text>
<rect id="right_pseudo_box" x="550" y="492" width="260" height="60" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
<text id="right_pseudo_box_text" x="680" y="516" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">Non-Inertial Frame:</text>
<text id="right_pseudo_box_text2" x="680" y="540" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">MUST add pseudo force</text>
<text id="observer_left" x="60" y="310" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">Observer</text>
<circle id="observer_head" cx="60" cy="290" r="10" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray=""/>
</svg>