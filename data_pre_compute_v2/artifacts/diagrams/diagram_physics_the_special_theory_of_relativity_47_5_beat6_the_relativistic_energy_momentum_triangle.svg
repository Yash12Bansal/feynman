<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<path id="triangle" d="M 240 500 L 240 160 L 660 500 Z" stroke="#e8e8ee" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<rect id="right_angle_marker" x="240" y="468" width="32" height="32" rx="0" fill="none" stroke="#7fd4ff" stroke-width="2"/>
<line id="vertical_leg" x1="240" y1="500" x2="240" y2="160" stroke="#7fd4ff" stroke-width="3" stroke-dasharray=""/>
<line id="horizontal_leg" x1="240" y1="500" x2="660" y2="500" stroke="#9effc9" stroke-width="3" stroke-dasharray=""/>
<line id="hypotenuse" x1="240" y1="160" x2="660" y2="500" stroke="#ff7a8a" stroke-width="3" stroke-dasharray=""/>
<circle id="vertex_bottom_left" cx="240" cy="500" r="4" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<circle id="vertex_top" cx="240" cy="160" r="4" fill="none" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/>
<circle id="vertex_bottom_right" cx="660" cy="500" r="4" fill="none" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/>
<text id="vertical_label" x="170" y="335" font-size="18" fill="#7fd4ff" font-style="italic" text-anchor="middle">m_0 c^2</text>
<text id="vertical_sublabel" x="168" y="358" font-size="11" fill="rgba(127,212,255,0.75)" text-anchor="middle" font-weight="normal">rest energy</text>
<text id="horizontal_label" x="450" y="548" font-size="18" fill="#9effc9" font-style="italic" text-anchor="middle">pc</text>
<text id="horizontal_sublabel" x="450" y="566" font-size="11" fill="rgba(158,255,201,0.75)" text-anchor="middle" font-weight="normal">momentum term</text>
<text id="hypotenuse_label" x="490" y="305" font-size="22" fill="#ff7a8a" font-style="italic" text-anchor="middle">E</text>
<text id="hypotenuse_sublabel" x="510" y="328" font-size="11" fill="rgba(255,122,138,0.75)" text-anchor="middle" font-weight="normal">total energy</text>
<text id="equation" x="450" y="610" font-size="15" fill="rgba(232,232,238,0.6)" font-style="italic" text-anchor="middle">E^2 = (m_0 c^2)^2 + (pc)^2</text>
</svg>