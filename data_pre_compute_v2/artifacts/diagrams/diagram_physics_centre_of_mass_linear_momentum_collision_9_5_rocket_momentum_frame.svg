<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="system-boundary" x="150" y="240" width="600" height="180" rx="12" fill="none" stroke="rgba(232,232,238,0.55)" stroke-width="1.5"/>
<text id="boundary-label" x="160" y="232" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="start" font-weight="normal">isolated system  (no external force)</text>
<path id="rocket-body" d="M 520 300 L 620 300 L 660 330 L 620 360 L 520 360 L 500 330 Z" stroke="#e8e8ee" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<path id="rocket-fins" d="M 520 300 L 505 282 L 535 300 M 520 360 L 505 378 L 535 360" stroke="#e8e8ee" stroke-width="2" fill="none" stroke-dasharray=""/>
<text id="rocket-mass-label" x="570" y="336" font-size="15" fill="#e8e8ee" text-anchor="middle" font-weight="600">M</text>
<path id="gas-jet" d="M 500 330 q -22 -16 -44 -6 q 14 -18 -4 -26 q -22 16 -40 4 q 12 18 -8 24 q 22 -10 40 8 q -10 16 8 22 q 18 -14 38 -2 q -10 -16 6 -22 q 10 4 -1 -2 Z" stroke="#ff7a8a" stroke-width="2" fill="none" stroke-dasharray=""/>
<defs><marker id="arrowhead_gas-jet-speed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="gas-jet-speed" x1="470" y1="330" x2="400" y2="330" stroke="#ff7a8a" stroke-width="2" marker-end="url(#arrowhead_gas-jet-speed)"/>
<text id="gas-jet-speed-label" x="432" y="320" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">u (rel. rocket)</text>
<defs><marker id="arrowhead_gas-momentum-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="gas-momentum-arrow" x1="470" y1="395" x2="330" y2="395" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_gas-momentum-arrow)"/>
<text id="gas-momentum-label" x="322" y="392" font-size="14" fill="#ff7a8a" font-style="italic" text-anchor="middle">-\,dm\,(v-u)</text>
<defs><marker id="arrowhead_rocket-velocity-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="rocket-velocity-arrow" x1="660" y1="270" x2="800" y2="270" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_rocket-velocity-arrow)"/>
<text id="rocket-velocity-label" x="808" y="274" font-size="14" fill="#9effc9" font-style="italic" text-anchor="middle">v + dv</text>
<text id="conservation-eq" x="450" y="500" font-size="18" fill="#7fd4ff" font-style="italic" text-anchor="middle">M\,dv = u\,(-dm)</text>
<text id="conservation-caption" x="450" y="540" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">momentum gained forward  =  momentum carried back</text>
</svg>