<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<circle id="rest-particle" cx="150" cy="200" r="16" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="rest-mass-label" x="138" y="245" font-size="14" fill="#7fd4ff" font-style="italic" text-anchor="middle">m_0</text>
<circle id="moving-particle" cx="560" cy="200" r="22" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_velocity-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="velocity-arrow" x1="588" y1="200" x2="670" y2="200" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_velocity-arrow)"/>
<text id="velocity-label" x="678" y="205" font-size="14" fill="#ff7a8a" font-style="italic" text-anchor="middle">v</text>
<text id="moving-mass-label" x="552" y="250" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">m</text>
<defs><marker id="arrowhead_push-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="push-arrow" x1="470" y1="200" x2="532" y2="200" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_push-arrow)"/>
<text id="push-label" x="470" y="185" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="normal">work</text>
<rect id="total-energy-bar" x="130" y="360" width="640" height="70" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<rect id="rest-energy-segment" x="130" y="360" width="380" height="70" rx="4" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<rect id="kinetic-energy-segment" x="510" y="360" width="260" height="70" rx="4" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="total-label" x="410" y="480" font-size="18" fill="#e8e8ee" font-style="italic" text-anchor="middle">E = mc^{2}</text>
<text id="rest-seg-label" x="320" y="400" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">rest energy</text>
<text id="rest-seg-math" x="295" y="525" font-size="15" fill="#7fd4ff" font-style="italic" text-anchor="middle">m_0 c^{2}</text>
<text id="kinetic-seg-label" x="640" y="400" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">kinetic energy</text>
<text id="kinetic-seg-math" x="600" y="525" font-size="15" fill="#9effc9" font-style="italic" text-anchor="middle">\tfrac{1}{2}m v^{2}</text>
</svg>