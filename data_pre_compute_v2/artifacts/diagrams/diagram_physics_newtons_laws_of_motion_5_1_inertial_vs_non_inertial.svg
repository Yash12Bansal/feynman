<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="main_title" x="450" y="38" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s First Law of Motion</text>
<text id="subtitle" x="450" y="62" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">Zero net force  →  zero acceleration (only valid in inertial frames)</text>
<line id="divider" x1="450" y1="80" x2="450" y2="590" stroke="#ccc" stroke-width="2" stroke-dasharray="8,4"/>
<text id="left_header" x="225" y="100" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">INERTIAL FRAME</text>
<text id="left_subheader" x="225" y="118" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Constant velocity train</text>
<text id="right_header" x="675" y="100" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">NON-INERTIAL FRAME</text>
<text id="right_subheader" x="675" y="118" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Braking train</text>
<rect id="left_train_body" x="60" y="155" width="330" height="130" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<rect id="left_train_window" x="90" y="170" width="70" height="50" rx="4" fill="#b3e5fc" stroke="#2e7d32" stroke-width="2"/>
<rect id="left_train_window2" x="185" y="170" width="70" height="50" rx="4" fill="#b3e5fc" stroke="#2e7d32" stroke-width="2"/>
<rect id="left_train_window3" x="280" y="170" width="70" height="50" rx="4" fill="#b3e5fc" stroke="#2e7d32" stroke-width="2"/>
<circle id="left_wheel1" cx="130" cy="290" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<circle id="left_wheel2" cx="320" cy="290" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<line id="left_track" x1="40" y1="312" x2="410" y2="312" stroke="#888" stroke-width="4" stroke-dasharray=""/>
<defs><marker id="arrowhead_left_velocity_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker></defs><line id="left_velocity_arrow" x1="370" y1="215" x2="420" y2="215" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowhead_left_velocity_arrow)"/>
<text id="left_velocity_label" x="395" y="207" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">v = const</text>
<rect id="left_bottle" x="200" y="238" width="22" height="38" rx="4" fill="#4fc3f7" stroke="#0277bd" stroke-width="2"/>
<rect id="left_bottle_cap" x="205" y="232" width="12" height="8" rx="2" fill="#0277bd" stroke="#0277bd" stroke-width="1"/>
<text id="left_bottle_label" x="211" y="295" font-size="11" fill="#0277bd" text-anchor="middle" font-weight="normal">bottle</text>
<text id="left_result" x="225" y="345" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">Bottle stays still — no sliding!</text>
<rect id="left_law_box" x="70" y="360" width="310" height="60" rx="8" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.5"/>
<text id="left_law_eq" x="225" y="388" font-size="15" fill="#2e7d32" font-style="italic" text-anchor="middle">\sum F = 0 \Rightarrow a = 0</text>
<text id="left_law_note" x="225" y="412" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">First Law applies correctly here</text>
<rect id="right_train_body" x="510" y="155" width="330" height="130" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
<rect id="right_train_window" x="540" y="170" width="70" height="50" rx="4" fill="#b3e5fc" stroke="#c62828" stroke-width="2"/>
<rect id="right_train_window2" x="635" y="170" width="70" height="50" rx="4" fill="#b3e5fc" stroke="#c62828" stroke-width="2"/>
<rect id="right_train_window3" x="730" y="170" width="70" height="50" rx="4" fill="#b3e5fc" stroke="#c62828" stroke-width="2"/>
<circle id="right_wheel1" cx="580" cy="290" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<circle id="right_wheel2" cx="770" cy="290" r="22" fill="#555" stroke="#333" stroke-width="2" stroke-dasharray=""/>
<line id="right_track" x1="490" y1="312" x2="860" y2="312" stroke="#888" stroke-width="4" stroke-dasharray=""/>
<defs><marker id="arrowhead_right_brake_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c62828"/></marker></defs><line id="right_brake_arrow" x1="820" y1="215" x2="760" y2="215" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead_right_brake_arrow)"/>
<text id="right_brake_label" x="800" y="207" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">braking!</text>
<rect id="right_bottle" x="590" y="238" width="22" height="38" rx="4" fill="#4fc3f7" stroke="#0277bd" stroke-width="2"/>
<rect id="right_bottle_cap" x="595" y="232" width="12" height="8" rx="2" fill="#0277bd" stroke="#0277bd" stroke-width="1"/>
<defs><marker id="arrowhead_right_bottle_motion" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF6F00"/></marker></defs><line id="right_bottle_motion" x1="614" y1="257" x2="648" y2="257" stroke="#FF6F00" stroke-width="2.5" marker-end="url(#arrowhead_right_bottle_motion)"/>
<text id="right_bottle_label" x="601" y="295" font-size="11" fill="#0277bd" text-anchor="middle" font-weight="normal">bottle</text>
<text id="right_bottle_slides" x="648" y="248" font-size="11" fill="#FF6F00" text-anchor="start" font-weight="bold">slides forward!</text>
<text id="right_result" x="675" y="345" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">Bottle accelerates — no real force!</text>
<rect id="right_law_box" x="520" y="360" width="310" height="60" rx="8" fill="#fff3e0" stroke="#c62828" stroke-width="1.5"/>
<text id="right_law_eq" x="675" y="388" font-size="14" fill="#c62828" font-style="italic" text-anchor="middle">\sum F = 0 \;\text{but}\; a \neq 0 \;\text{???}</text>
<text id="right_law_note" x="675" y="412" font-size="11" fill="#c62828" text-anchor="middle" font-weight="normal">First Law breaks down — non-inertial frame!</text>
<rect id="bottom_rule_box" x="80" y="445" width="740" height="80" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<text id="bottom_rule_title" x="450" y="468" font-size="14" fill="#1a237e" text-anchor="middle" font-weight="bold">Key Rule: Inertial Frames</text>
<text id="bottom_rule_line1" x="450" y="490" font-size="13" fill="#283593" text-anchor="middle" font-weight="normal">Newton&#x27;s First Law only works in inertial frames (zero acceleration frames).</text>
<text id="bottom_rule_line2" x="450" y="510" font-size="13" fill="#283593" text-anchor="middle" font-weight="normal">Any frame moving at constant velocity relative to an inertial frame is also inertial.</text>
<rect id="examples_box" x="80" y="545" width="340" height="48" rx="8" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.5"/>
<text id="examples_inertial" x="250" y="563" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="normal">Inertial: ground, constant-speed train,</text>
<text id="examples_inertial2" x="250" y="582" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="normal">drifting spaceship (no thrust)</text>
<rect id="examples_box2" x="480" y="545" width="340" height="48" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
<text id="examples_noninertial" x="650" y="563" font-size="12" fill="#c62828" text-anchor="middle" font-weight="normal">Non-inertial: braking train, falling elevator,</text>
<text id="examples_noninertial2" x="650" y="582" font-size="12" fill="#c62828" text-anchor="middle" font-weight="normal">accelerating rocket</text>
</svg>