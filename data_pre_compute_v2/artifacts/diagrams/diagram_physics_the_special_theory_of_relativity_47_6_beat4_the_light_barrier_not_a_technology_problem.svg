<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>

<line id="asymptote-line" x1="60" y1="109" x2="580" y2="109" stroke="#7fd4ff" stroke-width="2" stroke-dasharray="8 5"/>
<text id="c-label" x="590" y="114" font-size="15" fill="#7fd4ff" text-anchor="start" font-weight="600">c</text>
<defs><marker id="arrowhead_crossing-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="crossing-arrow" x1="430" y1="175" x2="430" y2="95" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_crossing-arrow)"/>
<path id="red-x-left" d="M 410 88 L 450 128" stroke="#ff7a8a" stroke-width="4" fill="none" stroke-dasharray=""/>
<path id="red-x-right" d="M 450 88 L 410 128" stroke="#ff7a8a" stroke-width="4" fill="none" stroke-dasharray=""/>
<text id="not-tech-label" x="430" y="155" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">NOT a technology problem</text>
<text id="infinite-energy-label" x="430" y="170" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">— infinite energy required</text>
<text id="energy-axis-label" x="320" y="500" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Energy input  →  ∞</text>
<rect id="inset-border" x="630" y="60" width="240" height="420" rx="6" fill="none" stroke="rgba(232,232,238,0.2)" stroke-width="1.5"/>
<text id="inset-title" x="750" y="90" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Barrier comparison</text>
<line id="inset-divider" x1="630" y1="270" x2="870" y2="270" stroke="rgba(232,232,238,0.15)" stroke-width="1" stroke-dasharray=""/>
<text id="sound-title" x="750" y="125" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">Sound barrier</text>
<path id="sound-wave-arc" d="M 700 160 Q 720 145 740 160 Q 760 175 780 160 Q 800 145 820 160" stroke="#e8e8ee" stroke-width="1.8" fill="none" stroke-dasharray=""/>
<defs><marker id="arrowhead_sound-cross-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="sound-cross-arrow" x1="690" y1="195" x2="810" y2="195" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_sound-cross-arrow)"/>
<text id="sound-check" x="750" y="230" font-size="22" fill="#9effc9" text-anchor="middle" font-weight="600">✓</text>
<text id="sound-caption" x="750" y="255" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Engineering solved it</text>
<text id="light-title" x="750" y="305" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">Light barrier</text>
<path id="light-wave-arc" d="M 700 335 Q 715 320 730 335 Q 745 350 760 335 Q 775 320 790 335 Q 805 350 820 335" stroke="#7fd4ff" stroke-width="1.8" fill="none" stroke-dasharray=""/>
<defs><marker id="arrowhead_light-block-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="light-block-arrow" x1="690" y1="370" x2="810" y2="370" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_light-block-arrow)"/>
<path id="light-x-left" d="M 728 355 L 772 390" stroke="#ff7a8a" stroke-width="3.5" fill="none" stroke-dasharray=""/>
<path id="light-x-right" d="M 772 355 L 728 390" stroke="#ff7a8a" stroke-width="3.5" fill="none" stroke-dasharray=""/>
<text id="infinity-symbol" x="750" y="430" font-size="26" fill="#ff7a8a" text-anchor="middle" font-weight="600">∞</text>
<text id="light-caption" x="750" y="458" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Impossible in principle</text>
<text id="speed-axis-label" x="48" y="270" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Speed</text>
</svg>