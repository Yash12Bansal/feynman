<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="leg_horizontal" x1="180" y1="420" x2="540" y2="420" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<line id="leg_vertical" x1="540" y1="420" x2="540" y2="160" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<line id="hypotenuse" x1="180" y1="420" x2="540" y2="160" stroke="#7fd4ff" stroke-width="3" stroke-dasharray=""/>
<path id="right_angle_marker" d="M 520 420 L 520 400 L 540 400" stroke="#7fd4ff" stroke-width="1.8" fill="none" stroke-dasharray=""/>
<text id="label_horizontal" x="360" y="448" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">m₀c²  (rest energy)</text>
<text id="label_vertical" x="590" y="296" font-size="13" fill="#7fd4ff" text-anchor="start" font-weight="600">pc</text>
<text id="label_vertical_sub" x="590" y="314" font-size="11" fill="#7fd4ff" text-anchor="start" font-weight="normal">(momentum × c)</text>
<text id="label_hypotenuse" x="328" y="272" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">E  (total energy)</text>
<text id="pythagorean_relation" x="340" y="510" font-size="17" fill="#e8e8ee" font-style="italic" text-anchor="middle">E^{2} = (m_0 c^{2})^{2} + (pc)^{2}</text>
<line id="divider" x1="640" y1="120" x2="640" y2="540" stroke="rgba(232,232,238,0.2)" stroke-width="1" stroke-dasharray="6 4"/>
<text id="photon_label" x="770" y="148" font-size="13" fill="#f5c842" text-anchor="middle" font-weight="600">Photon  (m₀ = 0)</text>
<line id="photon_hypotenuse" x1="690" y1="420" x2="850" y2="220" stroke="#f5c842" stroke-width="2.5" stroke-dasharray=""/>
<line id="photon_vertical" x1="850" y1="420" x2="850" y2="220" stroke="#f5c842" stroke-width="2.5" stroke-dasharray=""/>
<line id="photon_horizontal_zero" x1="690" y1="420" x2="850" y2="420" stroke="rgba(245,200,66,0.35)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text id="photon_zero_label" x="770" y="444" font-size="11" fill="rgba(245,200,66,0.6)" text-anchor="middle" font-weight="normal">m₀c² = 0</text>
<text id="photon_pc_label" x="866" y="326" font-size="12" fill="#f5c842" text-anchor="start" font-weight="600">pc = E</text>
<text id="photon_relation" x="770" y="490" font-size="15" fill="#f5c842" font-style="italic" text-anchor="middle">E = pc</text>
</svg>