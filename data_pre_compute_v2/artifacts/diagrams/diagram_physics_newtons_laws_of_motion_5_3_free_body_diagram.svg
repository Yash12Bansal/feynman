<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="fbd_title" x="450" y="36" font-size="21" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Free Body Diagram: Block Pulled at an Angle</text>
<text id="fbd_sub" x="450" y="58" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Step 3 in action — represent the system as a dot, draw every force as an arrow</text>
<text id="scene_label" x="185" y="90" font-size="14" fill="#4682b4" text-anchor="middle" font-weight="bold">The Situation</text>
<line id="table_line" x1="80" y1="260" x2="310" y2="260" stroke="#555" stroke-width="4" stroke-dasharray=""/>
<rect id="scene_block" x="155" y="210" width="70" height="50" rx="4" fill="#4682b4" stroke="#1a237e" stroke-width="2"/>
<text id="scene_block_label" x="190" y="241" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Block</text>
<defs><marker id="arrowhead_scene_rope" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="scene_rope" x1="225" y1="210" x2="295" y2="155" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_scene_rope)"/>
<text id="scene_rope_label" x="302" y="148" font-size="12" fill="#e65100" text-anchor="start" font-weight="normal">Rope (Tension T)</text>
<path id="scene_angle_arc" d="M 225.0 182.0 A 28.0 28.0 0 0 1 247.3617942813242 193.14917935174265" stroke="#9c27b0" stroke-width="1.5" fill="none"/>
<text id="scene_angle_label" x="248" y="196" font-size="14" fill="#9c27b0" font-style="italic" text-anchor="middle">\theta</text>
<defs><marker id="arrowhead_scene_accel" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="scene_accel" x1="190" y1="280" x2="260" y2="280" stroke="#D32F2F" stroke-width="2.5" marker-end="url(#arrowhead_scene_accel)"/>
<text id="scene_accel_label" x="270" y="284" font-size="14" fill="#D32F2F" font-style="italic" text-anchor="middle">a</text>
<line id="divider_vert" x1="340" y1="75" x2="340" y2="600" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
<text id="fbd_label" x="560" y="90" font-size="14" fill="#9c27b0" text-anchor="middle" font-weight="bold">Free Body Diagram</text>
<circle id="fbd_dot" cx="560" cy="270" r="14" fill="#4682b4" stroke="#1a237e" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_fbd_weight" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="fbd_weight" x1="560" y1="284" x2="560" y2="370" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_fbd_weight)"/>
<text id="fbd_weight_label" x="590" y="340" font-size="14" fill="#2e7d32" font-style="italic" text-anchor="middle">W = mg</text>
<defs><marker id="arrowhead_fbd_normal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4682b4"/></marker></defs><line id="fbd_normal" x1="560" y1="256" x2="560" y2="155" stroke="#4682b4" stroke-width="3" marker-end="url(#arrowhead_fbd_normal)"/>
<text id="fbd_normal_label" x="590" y="190" font-size="14" fill="#4682b4" font-style="italic" text-anchor="middle">N</text>
<text id="fbd_normal_text" x="608" y="190" font-size="11" fill="#4682b4" text-anchor="start" font-weight="normal">(Normal force)</text>
<defs><marker id="arrowhead_fbd_tension" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fbd_tension" x1="574" y1="258" x2="660" y2="190" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fbd_tension)"/>
<text id="fbd_tension_label" x="672" y="186" font-size="14" fill="#e65100" font-style="italic" text-anchor="middle">T</text>
<text id="fbd_tension_text" x="686" y="186" font-size="11" fill="#e65100" text-anchor="start" font-weight="normal">(Tension)</text>
<line id="fbd_tx_dashed" x1="660" y1="190" x2="660" y2="258" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,3"/>
<line id="fbd_ty_dashed" x1="574" y1="258" x2="660" y2="258" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,3"/>
<text id="fbd_tx_label" x="617" y="278" font-size="12" fill="#e65100" font-style="italic" text-anchor="middle">T\cos\theta</text>
<text id="fbd_ty_label" x="672" y="228" font-size="12" fill="#e65100" font-style="italic" text-anchor="middle">T\sin\theta</text>
<rect id="eq_box" x="355" y="415" width="520" height="175" rx="10" fill="#f9f9ff" stroke="#9c27b0" stroke-width="2"/>
<text id="eq_title" x="615" y="440" font-size="14" fill="#9c27b0" text-anchor="middle" font-weight="bold">Newton&#x27;s Second Law Equations</text>
<text id="eq_x_label" x="390" y="470" font-size="13" fill="#D32F2F" text-anchor="start" font-weight="bold">x-direction:</text>
<text id="eq_x" x="615" y="472" font-size="15" fill="#D32F2F" font-style="italic" text-anchor="middle">T\cos\theta = ma</text>
<text id="eq_y_label" x="390" y="515" font-size="13" fill="#4682b4" text-anchor="start" font-weight="bold">y-direction:</text>
<text id="eq_y" x="615" y="517" font-size="15" fill="#4682b4" font-style="italic" text-anchor="middle">N + T\sin\theta - mg = 0</text>
<text id="eq_y_note" x="615" y="540" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">(no vertical acceleration)</text>
<line id="eq_divider" x1="370" y1="555" x2="860" y2="555" stroke="#ccc" stroke-width="1" stroke-dasharray=""/>
<text id="eq_solve" x="615" y="574" font-size="12" fill="#1a1a2e" text-anchor="middle" font-weight="normal">Two equations, two unknowns: solve for T and N.</text>
<text id="scene_step1" x="185" y="320" font-size="12" fill="#1a1a2e" text-anchor="middle" font-weight="normal">System: the block</text>
<text id="scene_step2a" x="185" y="345" font-size="12" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Forces ON block:</text>
<text id="scene_step2b" x="185" y="363" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">Weight (down)</text>
<text id="scene_step2c" x="185" y="379" font-size="11" fill="#4682b4" text-anchor="middle" font-weight="normal">Normal force (up)</text>
<text id="scene_step2d" x="185" y="395" font-size="11" fill="#e65100" text-anchor="middle" font-weight="normal">Tension at angle</text>
</svg>