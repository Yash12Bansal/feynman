<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="axis" x1="60" y1="325" x2="840" y2="325" stroke="rgba(232,232,238,0.3)" stroke-width="1.5" stroke-dasharray="6,5"/>
<circle id="observer_A" cx="160" cy="325" r="18" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="label_A" x="160" y="329" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">A</text>
<text id="caption_A_stationary" x="160" y="358" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">at rest</text>
<circle id="observer_B" cx="430" cy="325" r="18" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="label_B" x="430" y="329" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">B</text>
<defs><marker id="arrowhead_B_velocity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="B_velocity" x1="452" y1="325" x2="530" y2="325" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_B_velocity)"/>
<text id="label_B_speed" x="490" y="308" font-size="12" fill="#9effc9" font-style="italic" text-anchor="middle">v = 0.5c</text>
<circle id="light_pulse" cx="720" cy="325" r="16" fill="none" stroke="#ffe066" stroke-width="2.5" stroke-dasharray=""/>
<text id="label_light" x="720" y="329" font-size="14" fill="#ffe066" text-anchor="middle" font-weight="600">⚡</text>
<text id="caption_light" x="720" y="358" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">light pulse</text>
<defs><marker id="arrowhead_dist_A_to_light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="dist_A_to_light" x1="178" y1="260" x2="702" y2="260" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrowhead_dist_A_to_light)"/>
<line id="tick_A_top" x1="178" y1="252" x2="178" y2="268" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="tick_light_top" x1="702" y1="252" x2="702" y2="268" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<text id="dist_A_label" x="440" y="243" font-size="14" fill="#7fd4ff" font-style="italic" text-anchor="middle">c \cdot t</text>
<defs><marker id="arrowhead_dist_B_to_light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="dist_B_to_light" x1="448" y1="390" x2="702" y2="390" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_dist_B_to_light)"/>
<line id="tick_B_bottom" x1="448" y1="382" x2="448" y2="398" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<line id="tick_light_bottom" x1="702" y1="382" x2="702" y2="398" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<text id="dist_B_label" x="575" y="410" font-size="14" fill="#9effc9" font-style="italic" text-anchor="middle">c \cdot t</text>
<line id="dashed_A_up" x1="178" y1="307" x2="178" y2="268" stroke="#7fd4ff" stroke-width="1" stroke-dasharray="4,4"/>
<line id="dashed_B_down" x1="448" y1="343" x2="448" y2="382" stroke="#9effc9" stroke-width="1" stroke-dasharray="4,4"/>
<line id="dashed_light_up" x1="702" y1="309" x2="702" y2="268" stroke="rgba(255,224,102,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
<line id="dashed_light_down" x1="702" y1="341" x2="702" y2="382" stroke="rgba(255,224,102,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
<text id="paradox_label" x="450" y="490" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">same distance — yet A and B are not in the same place</text>
<text id="equation_A" x="160" y="530" font-size="13" fill="#7fd4ff" font-style="italic" text-anchor="middle">d_A = c \cdot t</text>
<text id="equation_B" x="430" y="530" font-size="13" fill="#9effc9" font-style="italic" text-anchor="middle">d_B = c \cdot t</text>
<text id="not_equal" x="450" y="575" font-size="13" fill="#ff7a8a" font-style="italic" text-anchor="middle">d_A = d_B \quad \text{yet} \quad x_A \neq x_B</text>
</svg>