<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<rect id="fma_title_bg" x="250" y="18" width="400" height="52" rx="10" fill="#1a237e" stroke="none" stroke-width="2"/>
<text id="fma_title" x="450" y="38" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Newton&#x27;s Second Law of Motion</text>
<text id="fma_equation" x="450" y="52" font-size="28" fill="#1a237e" font-style="italic" text-anchor="middle">\vec{F}_{\text{net}} = m \vec{a}</text>
<rect id="fma_eq_box" x="330" y="82" width="240" height="58" rx="12" fill="#e8eaf6" stroke="#1a237e" stroke-width="3"/>
<text id="fma_eq_label" x="450" y="100" font-size="26" fill="#1a237e" font-style="italic" text-anchor="middle">a = \frac{F_{\text{net}}}{m}</text>
<text id="fma_section1_title" x="160" y="175" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">Same Mass, Different Force</text>
<line id="fma_divider1" x1="20" y1="182" x2="300" y2="182" stroke="#bbb" stroke-width="1.5" stroke-dasharray=""/>
<rect id="fma_box1a" x="60" y="205" width="60" height="40" rx="6" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
<text id="fma_box1a_label" x="90" y="230" font-size="13" fill="#1a237e" text-anchor="middle" font-weight="bold">5 kg</text>
<defs><marker id="arrowhead_fma_force1a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_force1a" x1="120" y1="225" x2="175" y2="225" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_force1a)"/>
<text id="fma_f1a_label" x="148" y="210" font-size="12" fill="#D32F2F" font-style="italic" text-anchor="middle">F = 10\text{ N}</text>
<defs><marker id="arrowhead_fma_accel1a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_accel1a" x1="175" y1="248" x2="210" y2="248" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_fma_accel1a)"/>
<text id="fma_a1a_label" x="192" y="265" font-size="12" fill="#FF9800" font-style="italic" text-anchor="middle">a = 2\text{ m/s}^2</text>
<rect id="fma_box1b" x="60" y="295" width="60" height="40" rx="6" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
<text id="fma_box1b_label" x="90" y="320" font-size="13" fill="#1a237e" text-anchor="middle" font-weight="bold">5 kg</text>
<defs><marker id="arrowhead_fma_force1b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_force1b" x1="120" y1="315" x2="215" y2="315" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_force1b)"/>
<text id="fma_f1b_label" x="168" y="300" font-size="12" fill="#D32F2F" font-style="italic" text-anchor="middle">F = 20\text{ N}</text>
<defs><marker id="arrowhead_fma_accel1b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_accel1b" x1="215" y1="338" x2="285" y2="338" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_fma_accel1b)"/>
<text id="fma_a1b_label" x="250" y="355" font-size="12" fill="#FF9800" font-style="italic" text-anchor="middle">a = 4\text{ m/s}^2</text>
<rect id="fma_insight1_bg" x="20" y="375" width="280" height="38" rx="8" fill="#fff8e1" stroke="#FF9800" stroke-width="1.5"/>
<text id="fma_insight1" x="160" y="390" font-size="13" fill="#e65100" text-anchor="middle" font-weight="normal">Double the force</text>
<text id="fma_insight1b" x="160" y="406" font-size="13" fill="#e65100" text-anchor="middle" font-weight="bold">→ double the acceleration</text>
<text id="fma_section2_title" x="450" y="175" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">Same Force, Different Mass</text>
<line id="fma_divider2" x1="320" y1="182" x2="580" y2="182" stroke="#bbb" stroke-width="1.5" stroke-dasharray=""/>
<rect id="fma_box2a" x="330" y="205" width="50" height="35" rx="6" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
<text id="fma_box2a_label" x="355" y="227" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">2 kg</text>
<defs><marker id="arrowhead_fma_force2a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_force2a" x1="380" y1="222" x2="430" y2="222" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_force2a)"/>
<text id="fma_f2a_label" x="405" y="208" font-size="12" fill="#D32F2F" font-style="italic" text-anchor="middle">F = 20\text{ N}</text>
<defs><marker id="arrowhead_fma_accel2a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_accel2a" x1="430" y1="245" x2="540" y2="245" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_fma_accel2a)"/>
<text id="fma_a2a_label" x="485" y="262" font-size="12" fill="#FF9800" font-style="italic" text-anchor="middle">a = 10\text{ m/s}^2</text>
<rect id="fma_box2b" x="320" y="295" width="80" height="50" rx="6" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
<text id="fma_box2b_label" x="360" y="325" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">10 kg</text>
<defs><marker id="arrowhead_fma_force2b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_force2b" x1="400" y1="320" x2="450" y2="320" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_force2b)"/>
<text id="fma_f2b_label" x="425" y="306" font-size="12" fill="#D32F2F" font-style="italic" text-anchor="middle">F = 20\text{ N}</text>
<defs><marker id="arrowhead_fma_accel2b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_accel2b" x1="450" y1="343" x2="472" y2="343" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_fma_accel2b)"/>
<text id="fma_a2b_label" x="461" y="360" font-size="12" fill="#FF9800" font-style="italic" text-anchor="middle">a = 2\text{ m/s}^2</text>
<rect id="fma_insight2_bg" x="320" y="375" width="260" height="38" rx="8" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
<text id="fma_insight2" x="450" y="390" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="normal">5x the mass</text>
<text id="fma_insight2b" x="450" y="406" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">→ 1/5 the acceleration</text>
<text id="fma_section3_title" x="760" y="175" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">Net Force = Vector Sum</text>
<line id="fma_divider3" x1="610" y1="182" x2="890" y2="182" stroke="#bbb" stroke-width="1.5" stroke-dasharray=""/>
<rect id="fma_box3" x="700" y="245" width="80" height="50" rx="6" fill="#ffe082" stroke="#f57f17" stroke-width="2"/>
<text id="fma_box3_label" x="740" y="275" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Box</text>
<defs><marker id="arrowhead_fma_push_force" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_push_force" x1="630" y1="270" x2="700" y2="270" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_push_force)"/>
<text id="fma_push_label" x="665" y="258" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">Push: 30 N</text>
<defs><marker id="arrowhead_fma_friction_force" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><line id="fma_friction_force" x1="850" y1="270" x2="780" y2="270" stroke="#555" stroke-width="3" marker-end="url(#arrowhead_fma_friction_force)"/>
<text id="fma_friction_label" x="855" y="258" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Friction: 10 N</text>
<line id="fma_net_line" x1="620" y1="315" x2="880" y2="315" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
<defs><marker id="arrowhead_fma_net_force" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_net_force" x1="700" y1="330" x2="780" y2="330" stroke="#D32F2F" stroke-width="4" marker-end="url(#arrowhead_fma_net_force)"/>
<text id="fma_net_label" x="740" y="350" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">F_{\text{net}} = 20\text{ N}</text>
<rect id="fma_insight3_bg" x="610" y="375" width="270" height="38" rx="8" fill="#fce4ec" stroke="#D32F2F" stroke-width="1.5"/>
<text id="fma_insight3" x="745" y="390" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="normal">Forces in opposite directions</text>
<text id="fma_insight3b" x="745" y="406" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">subtract to give net force</text>
<line id="fma_vert_div1" x1="310" y1="160" x2="310" y2="430" stroke="#ddd" stroke-width="2" stroke-dasharray=""/>
<line id="fma_vert_div2" x1="600" y1="160" x2="600" y2="430" stroke="#ddd" stroke-width="2" stroke-dasharray=""/>
<line id="fma_horiz_div" x1="20" y1="155" x2="880" y2="155" stroke="#ddd" stroke-width="2" stroke-dasharray=""/>
<rect id="fma_legend_bg" x="20" y="445" width="860" height="60" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1.5"/>
<text id="fma_legend_title" x="450" y="462" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Key:</text>
<defs><marker id="arrowhead_fma_leg_force_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_leg_force_arrow" x1="200" y1="475" x2="240" y2="475" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_leg_force_arrow)"/>
<text id="fma_leg_force_label" x="290" y="479" font-size="13" fill="#D32F2F" text-anchor="start" font-weight="normal">Applied Force (F)</text>
<defs><marker id="arrowhead_fma_leg_accel_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_leg_accel_arrow" x1="470" y1="475" x2="510" y2="475" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_leg_accel_arrow)"/>
<text id="fma_leg_accel_label" x="520" y="479" font-size="13" fill="#FF9800" text-anchor="start" font-weight="normal">Acceleration (a)</text>
<defs><marker id="arrowhead_fma_leg_fric_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><line id="fma_leg_fric_arrow" x1="690" y1="475" x2="730" y2="475" stroke="#555" stroke-width="3" marker-end="url(#arrowhead_fma_leg_fric_arrow)"/>
<text id="fma_leg_fric_label" x="740" y="479" font-size="13" fill="#555" text-anchor="start" font-weight="normal">Friction / Resistance</text>
<rect id="fma_summary_bg" x="20" y="525" width="860" height="100" rx="12" fill="#e8eaf6" stroke="#1a237e" stroke-width="2"/>
<text id="fma_summary_title" x="450" y="548" font-size="15" fill="#1a237e" text-anchor="middle" font-weight="bold">The Three Key Relationships</text>
<text id="fma_summary1" x="180" y="572" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Bigger Force</text>
<defs><marker id="arrowhead_fma_sum_arr1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><line id="fma_sum_arr1" x1="230" y1="572" x2="270" y2="572" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead_fma_sum_arr1)"/>
<text id="fma_summary1b" x="340" y="572" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">Bigger Acceleration</text>
<text id="fma_summary2" x="180" y="598" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Bigger Mass</text>
<defs><marker id="arrowhead_fma_sum_arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><line id="fma_sum_arr2" x1="230" y1="598" x2="270" y2="598" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead_fma_sum_arr2)"/>
<text id="fma_summary2b" x="340" y="598" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">Smaller Acceleration</text>
<text id="fma_summary3" x="630" y="572" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Force stops</text>
<defs><marker id="arrowhead_fma_sum_arr3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><line id="fma_sum_arr3" x1="680" y1="572" x2="720" y2="572" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead_fma_sum_arr3)"/>
<text id="fma_summary3b" x="800" y="572" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">Acceleration = 0 instantly</text>
<text id="fma_summary4" x="630" y="598" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Use net (total) force</text>
<defs><marker id="arrowhead_fma_sum_arr4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><line id="fma_sum_arr4" x1="710" y1="598" x2="750" y2="598" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead_fma_sum_arr4)"/>
<text id="fma_summary4b" x="820" y="598" font-size="13" fill="#1a237e" text-anchor="middle" font-weight="bold">including direction</text>
</svg>