<text id="boy_bag_force_label" x="145" y="418" font-size="10" fill="#D32F2F" text-anchor="end" font-weight="bold">Bag presses</text>
<text id="boy_bag_force_label2" x="145" y="432" font-size="10" fill="#D32F2F" text-anchor="end" font-weight="normal">down on boy</text>
<text id="boy_note" x="220" y="548" font-size="11" fill="#1a4a7a" text-anchor="middle" font-weight="bold">3 forces on the boy</text>
<rect id="fbd_bag_box" x="510" y="300" width="340" height="310" rx="12" fill="#fffbe6" stroke="#c8a000" stroke-width="2"/>
<rect id="fbd_bag_header" x="510" y="300" width="340" height="36" rx="12" fill="#c8a000" stroke="#c8a000" stroke-width="2"/>
<rect id="fbd_bag_header_fix" x="510" y="320" width="340" height="16" rx="0" fill="#c8a000" stroke="none" stroke-width="0"/>
<text id="fbd_bag_title" x="680" y="323" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">FBD: System = Bag</text>
<circle id="bag_dot" cx="680" cy="440" r="12" fill="#f5c842" stroke="#7a5a00" stroke-width="2" stroke-dasharray=""/>
<text id="bag_dot_label" x="680" y="468" font-size="10" fill="#7a5a00" text-anchor="middle" font-weight="normal">Bag (system)</text>
<defs><marker id="arrowhead_bag_N" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="bag_N" x1="680" y1="428" x2="680" y2="360" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_bag_N)"/>
<text id="bag_N_label" x="708" y="388" font-size="11" fill="#FF9800" text-anchor="start" font-weight="bold">N (boy&#x27;s head</text>
<text id="bag_N_label2" x="708" y="402" font-size="11" fill="#FF9800" text-anchor="start" font-weight="normal">pushes bag up)</text>
<defs><marker id="arrowhead_bag_W" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="bag_W" x1="680" y1="452" x2="680" y2="520" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arrowhead_bag_W)"/>
<text id="bag_W_label" x="708" y="492" font-size="11" fill="#4CAF50" text-anchor="start" font-weight="bold">W (gravity)</text>
<text id="bag_note" x="680" y="548" font-size="11" fill="#7a5a00" text-anchor="middle" font-weight="bold">Only 2 forces on the bag</text>
<rect id="key_insight_box" x="50" y="622" width="800" height="0" rx="0" fill="none" stroke="none" stroke-width="0"/>
</svg>