<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="underlying-asset" x="90" y="270" width="180" height="90" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="underlying-asset-label" x="180" y="310" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">Underlying asset</text>
<text id="underlying-asset-sub" x="180" y="330" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">(the van)</text>
<defs><marker id="arrowhead_finance-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="finance-branch" x1="270" y1="300" x2="560" y2="200" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_finance-branch)"/>
<text id="finance-branch-label" x="390" y="232" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="600">Finance lease</text>
<defs><marker id="arrowhead_operating-branch" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="operating-branch" x1="270" y1="330" x2="560" y2="440" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_operating-branch)"/>
<text id="operating-branch-label" x="390" y="418" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">Operating lease</text>
<rect id="lease-receivable" x="570" y="150" width="250" height="90" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="lease-receivable-label" x="695" y="188" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Lease receivable</text>
<text id="lease-receivable-sub" x="695" y="208" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">= net investment in lease</text>
<rect id="asset-stays" x="570" y="400" width="250" height="90" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="asset-stays-label" x="695" y="438" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Asset stays on books</text>
<text id="asset-stays-sub" x="695" y="458" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">+ depreciation</text>
</svg>
