<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="timeline" x1="120" y1="360" x2="820" y2="360" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<circle id="commencement-date" cx="130" cy="360" r="7" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="commencement-label" x="130" y="400" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">Commencement date</text>
<rect id="guaranteed-period" x="130" y="335" width="320" height="50" rx="4" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="guaranteed-label" x="290" y="320" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="600">Guaranteed (non-cancellable) years</text>
<rect id="optional-period" x="450" y="335" width="300" height="50" rx="4" fill="none" stroke="rgba(232,232,238,0.7)" stroke-width="2"/>
<text id="optional-label" x="600" y="320" font-size="12" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="600">Optional extension years</text>
<rect id="incentive-zone" x="450" y="325" width="300" height="70" rx="8" fill="none" stroke="#7fd4ff" stroke-width="1.5"/>
<text id="incentive-label" x="600" y="415" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="600">economic incentive?</text>
<defs><marker id="arrowhead_extend-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="extend-arrow" x1="130" y1="250" x2="750" y2="250" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_extend-arrow)"/>
<text id="extend-label" x="760" y="248" font-size="11" fill="#9effc9" text-anchor="start" font-weight="600">extend (reasonably certain)</text>
<defs><marker id="arrowhead_terminate-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="terminate-arrow" x1="130" y1="470" x2="330" y2="470" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_terminate-arrow)"/>
<line id="terminate-mark" x1="330" y1="335" x2="330" y2="470" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray="4 4"/>
<text id="terminate-label" x="340" y="490" font-size="11" fill="#ff7a8a" text-anchor="start" font-weight="600">terminate early (reasonably certain)</text>
</svg>
