<circle id="node-w" cx="450" cy="130" r="30" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="node-w-label" x="442" y="138" font-size="20" fill="#9effc9" font-style="italic" text-anchor="middle">w</text>
<defs><marker id="arrowhead_edge-x-y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="edge-x-y" x1="428" y1="510" x2="292" y2="352" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_edge-x-y)"/>
<defs><marker id="arrowhead_edge-x-z" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="edge-x-z" x1="472" y1="510" x2="608" y2="352" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_edge-x-z)"/>
<defs><marker id="arrowhead_edge-y-w" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="edge-y-w" x1="292" y1="308" x2="428" y2="150" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_edge-y-w)"/>
<defs><marker id="arrowhead_edge-z-w" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="edge-z-w" x1="608" y1="308" x2="472" y2="150" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_edge-z-w)"/>
<text id="edge-x-y-label" x="320" y="445" font-size="15" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">\frac{\partial y}{\partial x}</text>
<text id="edge-x-z-label" x="545" y="445" font-size="15" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">\frac{\partial z}{\partial x}</text>
<text id="edge-y-w-label" x="318" y="235" font-size="15" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">\frac{\partial w}{\partial y}</text>
<text id="edge-z-w-label" x="545" y="235" font-size="15" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">\frac{\partial w}{\partial z}</text>
<path id="shared-subexpr" d="M 450 575 L 250 380 L 250 320 L 450 490 L 650 320 L 650 380 Z" stroke="#ff7a8a" stroke-width="2" fill="none" stroke-dasharray="7 5"/>
<text id="chain-rule" x="560" y="600" font-size="16" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{\partial w}{\partial x} = \frac{\partial w}{\partial y}\frac{\partial y}{\partial x} + \frac{\partial w}{\partial z}\frac{\partial z}{\partial x}</text>
</svg>