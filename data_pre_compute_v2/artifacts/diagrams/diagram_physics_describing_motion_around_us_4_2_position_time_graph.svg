<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<defs><marker id="arrowhead_time-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="time-axis" x1="130" y1="520" x2="800" y2="520" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_time-axis)"/>
<defs><marker id="arrowhead_position-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="position-axis" x1="130" y1="520" x2="130" y2="110" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_position-axis)"/>
<text id="time-label" x="800" y="548" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="end" font-weight="normal">time (s)</text>
<text id="position-label" x="118" y="110" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="end" font-weight="normal">position (m)</text>
<line id="steady-line" x1="130" y1="520" x2="660" y2="300" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<line id="steep-line" x1="130" y1="520" x2="430" y2="160" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<line id="flat-segment" x1="540" y1="240" x2="760" y2="240" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<path id="slope-marker" d="M 330 437 L 530 437 L 530 354 Z" stroke="rgba(232,232,238,0.7)" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<text id="run-label" x="430" y="455" font-size="11" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">run (Δt)</text>
<text id="rise-label" x="542" y="400" font-size="11" fill="rgba(232,232,238,0.7)" text-anchor="start" font-weight="normal">rise (Δx)</text>
<text id="steady-tag" x="668" y="296" font-size="12" fill="#7fd4ff" text-anchor="start" font-weight="600">steady</text>
<text id="steep-tag" x="438" y="156" font-size="12" fill="#9effc9" text-anchor="start" font-weight="600">faster</text>
<text id="flat-tag" x="768" y="244" font-size="12" fill="#ff7a8a" text-anchor="start" font-weight="600">at rest</text>
<text id="slope-eq" x="300" y="500" font-size="14" fill="rgba(232,232,238,0.75)" font-style="italic" text-anchor="middle">\text{slope} = \frac{\Delta x}{\Delta t} = v</text>
</svg>