<line id="mirror-top-r" x1="630" y1="180" x2="710" y2="180" stroke="#7fd4ff" stroke-width="3" stroke-dasharray=""/>
<path id="light-diagonal" d="M 540 480 L 670 180 L 800 480" stroke="#9effc9" stroke-width="2.5" fill="none" stroke-dasharray=""/>
