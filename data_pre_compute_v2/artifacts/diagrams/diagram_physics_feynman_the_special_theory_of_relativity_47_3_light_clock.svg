<text id="rest-caption" x="230" y="575" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">tick = round trip</text>
<line id="mirror-bottom-r1" x1="500" y1="480" x2="580" y2="480" stroke="rgba(127,212,255,0.4)" stroke-width="2.5" stroke-dasharray=""/>
