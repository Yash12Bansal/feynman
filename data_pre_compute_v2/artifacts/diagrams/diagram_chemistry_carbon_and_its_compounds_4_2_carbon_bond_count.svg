<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="carbon-label" x="250" y="90" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Carbon</text>
<text id="silicon-label" x="670" y="90" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Silicon</text>
<circle id="central-carbon" cx="250" cy="320" r="34" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="carbon-symbol" x="242" y="328" font-size="22" fill="#7fd4ff" font-style="italic" text-anchor="middle">C</text>
<line id="four-arms" x1="250" y1="320" x2="250" y2="220" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<line id="arm-2" x1="250" y1="320" x2="250" y2="420" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<line id="arm-3" x1="250" y1="320" x2="150" y2="320" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<line id="arm-4" x1="250" y1="320" x2="350" y2="320" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<circle id="arm-tip-1" cx="250" cy="220" r="6" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<circle id="arm-tip-2" cx="250" cy="420" r="6" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<circle id="arm-tip-3" cx="150" cy="320" r="6" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<circle id="arm-tip-4" cx="350" cy="320" r="6" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<circle id="silicon-comparison" cx="670" cy="320" r="70" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="silicon-symbol" x="654" y="328" font-size="26" fill="#ff7a8a" font-style="italic" text-anchor="middle">Si</text>
<text id="carbon-caption" x="250" y="580" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">small → close, strong C–C bonds</text>
<text id="silicon-caption" x="670" y="580" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">large → distant, weaker Si–Si bonds</text>
</svg>