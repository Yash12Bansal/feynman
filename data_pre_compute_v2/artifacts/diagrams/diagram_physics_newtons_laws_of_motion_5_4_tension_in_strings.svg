<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
<rect x="0" y="0" width="900" height="660" fill="#ffffff"/>
<text id="ts_title" x="450" y="36" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Tension in Strings</text>
<line id="ts_divider_top" x1="40" y1="52" x2="860" y2="52" stroke="#ccc" stroke-width="1.5" stroke-dasharray=""/>
<text id="ts_left_title" x="220" y="76" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold">Massless String</text>
<text id="ts_left_sub" x="220" y="95" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Tension is the same everywhere</text>
<rect id="ts_ceiling_l" x="80" y="108" width="280" height="16" rx="2" fill="#78909c" stroke="#37474f" stroke-width="2"/>
<path id="ts_hatch_l1" d="M 100 108 L 88 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_l2" d="M 130 108 L 118 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_l3" d="M 160 108 L 148 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_l4" d="M 190 108 L 178 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_l5" d="M 220 108 L 208 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_l6" d="M 250 108 L 238 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_l7" d="M 280 108 L 268 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_l8" d="M 310 108 L 298 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<line id="ts_string_massless" x1="220" y1="124" x2="220" y2="370" stroke="#1565C0" stroke-width="5" stroke-dasharray=""/>
<text id="ts_t_top_l" x="155" y="160" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">T = Mg</text>
<line id="ts_t_top_l_line" x1="185" y1="157" x2="218" y2="157" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4,3"/>
<text id="ts_t_mid_l" x="155" y="250" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">T = Mg</text>
<line id="ts_t_mid_l_line" x1="185" y1="247" x2="218" y2="247" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4,3"/>
<text id="ts_t_bot_l" x="155" y="345" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="bold">T = Mg</text>
<line id="ts_t_bot_l_line" x1="185" y1="342" x2="218" y2="342" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect id="ts_block_l" x="180" y="370" width="80" height="65" rx="5" fill="#ffe082" stroke="#f57f17" stroke-width="2.5"/>
<text id="ts_block_l_label" x="220" y="398" font-size="13" fill="#f57f17" text-anchor="middle" font-weight="bold">Block</text>
<text id="ts_block_l_mass" x="220" y="420" font-size="14" fill="#f57f17" font-style="italic" text-anchor="middle">M</text>
<defs><marker id="arrowhead_ts_weight_l" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="ts_weight_l" x1="220" y1="435" x2="220" y2="468" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arrowhead_ts_weight_l)"/>
<text id="ts_weight_l_label" x="248" y="462" font-size="12" fill="#4CAF50" font-style="italic" text-anchor="middle">Mg</text>
<rect id="ts_uniform_box" x="80" y="490" width="280" height="44" rx="8" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
<text id="ts_uniform_note" x="220" y="508" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="normal">Massless string: tension is</text>
<text id="ts_uniform_note2" x="220" y="526" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">uniform throughout = Mg</text>
<line id="ts_divider_v" x1="450" y1="52" x2="450" y2="560" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
<text id="ts_right_title" x="680" y="76" font-size="16" fill="#7B1FA2" text-anchor="middle" font-weight="bold">Massive String</text>
<text id="ts_right_sub" x="680" y="95" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Tension increases toward the top</text>
<rect id="ts_ceiling_r" x="540" y="108" width="280" height="16" rx="2" fill="#78909c" stroke="#37474f" stroke-width="2"/>
<path id="ts_hatch_r1" d="M 560 108 L 548 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_r2" d="M 590 108 L 578 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_r3" d="M 620 108 L 608 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_r4" d="M 650 108 L 638 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_r5" d="M 680 108 L 668 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_r6" d="M 710 108 L 698 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_r7" d="M 740 108 L 728 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<path id="ts_hatch_r8" d="M 770 108 L 758 96" stroke="#37474f" stroke-width="1.5" fill="none" stroke-dasharray=""/>
<rect id="ts_string_massive" x="668" y="124" width="24" height="246" rx="4" fill="#ce93d8" stroke="#7B1FA2" stroke-width="2.5"/>
<text id="ts_string_mass_label" x="730" y="250" font-size="12" fill="#7B1FA2" text-anchor="start" font-weight="normal">String</text>
<text id="ts_string_mass_label2" x="730" y="265" font-size="12" fill="#7B1FA2" text-anchor="start" font-weight="normal">mass = m</text>
<text id="ts_t_top_r_label" x="620" y="148" font-size="12" fill="#D32F2F" text-anchor="end" font-weight="bold">TOP:</text>
<text id="ts_t_top_r" x="560" y="162" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">T_{top} = (M+m)g</text>
<line id="ts_t_top_r_line" x1="666" y1="148" x2="640" y2="148" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4,3"/>
<text id="ts_t_mid_r_label" x="620" y="248" font-size="12" fill="#D32F2F" text-anchor="end" font-weight="bold">MID:</text>
<text id="ts_t_mid_r" x="545" y="262" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">T_{mid} = (M + \frac{m}{2})g</text>
<line id="ts_t_mid_r_line" x1="666" y1="248" x2="640" y2="248" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4,3"/>
<text id="ts_t_bot_r_label" x="620" y="348" font-size="12" fill="#D32F2F" text-anchor="end" font-weight="bold">BOT:</text>
<text id="ts_t_bot_r" x="560" y="362" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">T_{bot} = Mg</text>
<line id="ts_t_bot_r_line" x1="666" y1="348" x2="640" y2="348" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect id="ts_block_r" x="640" y="370" width="80" height="65" rx="5" fill="#ffe082" stroke="#f57f17" stroke-width="2.5"/>
<text id="ts_block_r_label" x="680" y="398" font-size="13" fill="#f57f17" text-anchor="middle" font-weight="bold">Block</text>
<text id="ts_block_r_mass" x="680" y="420" font-size="14" fill="#f57f17" font-style="italic" text-anchor="middle">M</text>
<defs><marker id="arrowhead_ts_weight_r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="ts_weight_r" x1="680" y1="435" x2="680" y2="468" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arrowhead_ts_weight_r)"/>
<text id="ts_weight_r_label" x="708" y="462" font-size="12" fill="#4CAF50" font-style="italic" text-anchor="middle">Mg</text>
<rect id="ts_massive_box" x="540" y="490" width="280" height="44" rx="8" fill="#f3e5f5" stroke="#7B1FA2" stroke-width="1.5"/>
<text id="ts_massive_note" x="680" y="508" font-size="12" fill="#7B1FA2" text-anchor="middle" font-weight="normal">Massive string: tension is</text>
<text id="ts_massive_note2" x="680" y="526" font-size="12" fill="#7B1FA2" text-anchor="middle" font-weight="bold">greatest at top, least at bottom</text>
<line id="ts_divider_bot" x1="40" y1="560" x2="860" y2="560" stroke="#ccc" stroke-width="1.5" stroke-dasharray=""/>
<rect id="ts_insight_box" x="40" y="570" width="820" height="72" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text id="ts_insight_title" x="450" y="590" font-size="13" fill="#e65100" text-anchor="middle" font-weight="bold">Why does tension vary in a massive string?</text>
<text id="ts_insight_body" x="450" y="610" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Each point in the string must support the weight of everything below it (block + string below that point).</text>
<text id="ts_insight_body2" x="450" y="630" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">The top bears the most load; the bottom only supports the block. This is Newton&#x27;s 3rd Law applied at every slice!</text>
</svg>