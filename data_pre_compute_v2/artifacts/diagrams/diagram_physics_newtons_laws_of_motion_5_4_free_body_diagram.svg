<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
<rect x="0" y="0" width="900" height="660" fill="#ffffff"/>
<text id="fbd_title" x="450" y="36" font-size="19" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Free Body Diagrams: Forces Act on ONE Object at a Time</text>
<line id="fbd_divider_top" x1="40" y1="52" x2="860" y2="52" stroke="#ccc" stroke-width="1.5" stroke-dasharray=""/>
<text id="fbd_scene_label" x="450" y="74" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">Scene: Block resting on a table</text>
<rect id="fbd_scene_table" x="330" y="175" width="240" height="22" rx="2" fill="#a1887f" stroke="#5d4037" stroke-width="2"/>
<rect id="fbd_scene_leg1" x="345" y="197" width="18" height="50" rx="1" fill="#a1887f" stroke="#5d4037" stroke-width="1.5"/>
<rect id="fbd_scene_leg2" x="537" y="197" width="18" height="50" rx="1" fill="#a1887f" stroke="#5d4037" stroke-width="1.5"/>
<rect id="fbd_scene_block" x="390" y="115" width="120" height="60" rx="5" fill="#ffe082" stroke="#f57f17" stroke-width="2.5"/>
<text id="fbd_scene_block_label" x="450" y="150" font-size="13" fill="#f57f17" text-anchor="middle" font-weight="bold">Block (M)</text>
<text id="fbd_scene_table_label" x="450" y="260" font-size="13" fill="#5d4037" text-anchor="middle" font-weight="normal">Table</text>
<defs><marker id="arrowhead_fbd_scene_arrow_l" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#999"/></marker></defs><line id="fbd_scene_arrow_l" x1="380" y1="200" x2="240" y2="340" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead_fbd_scene_arrow_l)"/>
<defs><marker id="arrowhead_fbd_scene_arrow_r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#999"/></marker></defs><line id="fbd_scene_arrow_r" x1="520" y1="200" x2="660" y2="340" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead_fbd_scene_arrow_r)"/>
<line id="fbd_divider_mid" x1="40" y1="290" x2="860" y2="290" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
<text id="fbd_left_title" x="220" y="320" font-size="15" fill="#f57f17" text-anchor="middle" font-weight="bold">FBD of Block</text>
<text id="fbd_left_sub" x="220" y="338" font-size="12" fill="#888" text-anchor="middle" font-weight="normal">(forces ON the block only)</text>
<rect id="fbd_block_l" x="175" y="360" width="90" height="70" rx="5" fill="#ffe082" stroke="#f57f17" stroke-width="2.5"/>
<text id="fbd_block_l_label" x="220" y="400" font-size="13" fill="#f57f17" text-anchor="middle" font-weight="bold">Block</text>
<defs><marker id="arrowhead_fbd_normal_up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fbd_normal_up" x1="220" y1="358" x2="220" y2="300" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fbd_normal_up)"/>
<text id="fbd_normal_up_label" x="220" y="292" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">N (table on block)</text>
<defs><marker id="arrowhead_fbd_weight_down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="fbd_weight_down" x1="220" y1="432" x2="220" y2="490" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_fbd_weight_down)"/>
<text id="fbd_weight_label" x="220" y="510" font-size="12" fill="#4CAF50" font-style="italic" text-anchor="middle">Mg \text{ (gravity on block)}</text>
<rect id="fbd_block_result_box" x="100" y="530" width="240" height="50" rx="8" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
<text id="fbd_block_result1" x="220" y="550" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">Net force on block = 0</text>
<text id="fbd_block_result2" x="220" y="568" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="normal">N = Mg  (block doesn&#x27;t move)</text>
<line id="fbd_divider_v" x1="450" y1="290" x2="450" y2="620" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
<text id="fbd_right_title" x="680" y="320" font-size="15" fill="#5d4037" text-anchor="middle" font-weight="bold">FBD of Table</text>
<text id="fbd_right_sub" x="680" y="338" font-size="12" fill="#888" text-anchor="middle" font-weight="normal">(forces ON the table only)</text>
<rect id="fbd_table_r" x="600" y="390" width="160" height="22" rx="2" fill="#a1887f" stroke="#5d4037" stroke-width="2"/>
<rect id="fbd_table_r_leg1" x="612" y="412" width="14" height="40" rx="1" fill="#a1887f" stroke="#5d4037" stroke-width="1.5"/>
<rect id="fbd_table_r_leg2" x="734" y="412" width="14" height="40" rx="1" fill="#a1887f" stroke="#5d4037" stroke-width="1.5"/>
<text id="fbd_table_r_label" x="680" y="468" font-size="13" fill="#5d4037" text-anchor="middle" font-weight="bold">Table</text>
<defs><marker id="arrowhead_fbd_block_on_table" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="fbd_block_on_table" x1="680" y1="388" x2="680" y2="345" stroke="#1565C0" stroke-width="3" marker-end="url(#arrowhead_fbd_block_on_table)"/>
<text id="fbd_block_on_table_label" x="680" y="336" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">N (block on table)</text>
<defs><marker id="arrowhead_fbd_floor_on_table" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fbd_floor_on_table" x1="680" y1="452" x2="680" y2="395" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fbd_floor_on_table)"/>
<text id="fbd_floor_label" x="800" y="430" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">Floor pushes</text>
<text id="fbd_floor_label2" x="800" y="446" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">table up</text>
<defs><marker id="arrowhead_fbd_table_weight" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="fbd_table_weight" x1="680" y1="454" x2="680" y2="500" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_fbd_table_weight)"/>
<text id="fbd_table_weight_label" x="800" y="490" font-size="12" fill="#4CAF50" text-anchor="middle" font-weight="bold">Table weight</text>
<rect id="fbd_table_result_box" x="560" y="530" width="240" height="50" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text id="fbd_table_result1" x="680" y="550" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">Block pushing DOWN on table</text>
<text id="fbd_table_result2" x="680" y="568" font-size="12" fill="#c62828" text-anchor="middle" font-weight="normal">does NOT affect the block&#x27;s motion!</text>
<line id="fbd_divider_bot" x1="40" y1="620" x2="860" y2="620" stroke="#ccc" stroke-width="1.5" stroke-dasharray=""/>
<rect id="fbd_takeaway_box" x="40" y="628" width="820" height="26" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text id="fbd_takeaway" x="450" y="646" font-size="12" fill="#1a237e" text-anchor="middle" font-weight="bold">Cancellation only happens between forces on the SAME object. Action-reaction pairs live on DIFFERENT objects — they never cancel each other.</text>
</svg>