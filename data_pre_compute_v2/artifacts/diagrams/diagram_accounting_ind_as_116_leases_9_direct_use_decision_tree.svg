<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="root-question" x="290" y="30" width="320" height="60" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="root-question-l1" x="450" y="55" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">Does the customer have the right</text>
<text id="root-question-l2" x="450" y="72" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">to direct the use?</text>
<line id="link-root-left" x1="360" y1="90" x2="200" y2="150" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<line id="link-root-right" x1="540" y1="90" x2="690" y2="150" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<text id="route-one-tag" x="245" y="130" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Route 1</text>
<text id="route-two-tag" x="645" y="130" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Route 2</text>
<rect id="route-one-how-why" x="50" y="150" width="300" height="70" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="route-one-l1" x="200" y="175" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">Customer directs HOW and</text>
<text id="route-one-l2" x="200" y="191" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">FOR WHAT PURPOSE the asset</text>
<text id="route-one-l3" x="200" y="207" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">is used throughout the period.</text>
<rect id="route-two-predetermined" x="540" y="150" width="300" height="70" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="route-two-l1" x="690" y="180" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">How and why are</text>
<text id="route-two-l2" x="690" y="197" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">predetermined — then check:</text>
<line id="link-two-operate" x1="620" y1="220" x2="575" y2="290" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<line id="link-two-designed" x1="760" y1="220" x2="805" y2="290" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<rect id="sub-operate" x="470" y="290" width="210" height="80" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2"/>
<text id="sub-operate-l1" x="575" y="315" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Customer operates the asset</text>
<text id="sub-operate-l2" x="575" y="331" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">(or directs operation) and</text>
<text id="sub-operate-l3" x="575" y="347" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">lessor cannot change</text>
<text id="sub-operate-l4" x="575" y="363" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">the instructions.</text>
<rect id="sub-designed" x="700" y="290" width="210" height="80" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2"/>
<text id="sub-designed-l1" x="805" y="323" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Customer designed the</text>
<text id="sub-designed-l2" x="805" y="339" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">asset, predetermining</text>
<text id="sub-designed-l3" x="805" y="355" font-size="11" fill="#e8e8ee" text-anchor="middle" font-weight="normal">its use.</text>
<defs><marker id="arrowhead_converge-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="converge-left" x1="200" y1="220" x2="380" y2="540" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_converge-left)"/>
<defs><marker id="arrowhead_converge-operate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="converge-operate" x1="575" y1="370" x2="470" y2="540" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_converge-operate)"/>
<defs><marker id="arrowhead_converge-designed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="converge-designed" x1="805" y1="370" x2="530" y2="540" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_converge-designed)"/>
<rect id="control-result" x="300" y="540" width="300" height="70" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="control-result-l1" x="450" y="568" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Customer controls the use</text>
<text id="control-result-l2" x="395" y="585" font-size="14" fill="#9effc9" font-style="italic" text-anchor="middle">\Rightarrow \text{ this is a lease.}</text>
</svg>
