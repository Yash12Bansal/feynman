<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="contract-box" x="330" y="90" width="240" height="90" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="contract-label" x="450" y="140" font-size="16" fill="#e8e8ee" text-anchor="middle" font-weight="600">Contract</text>
<text id="total-payment" x="386" y="70" font-size="15" fill="#7fd4ff" font-style="italic" text-anchor="middle">\$1{,}000\,/\,\text{month}</text>
<defs><marker id="arrowhead_branch-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="branch-left" x1="400" y1="180" x2="250" y2="300" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_branch-left)"/>
<defs><marker id="arrowhead_branch-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="branch-right" x1="500" y1="180" x2="650" y2="300" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_branch-right)"/>
<rect id="lease-component" x="90" y="310" width="300" height="100" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="lease-label-1" x="240" y="350" font-size="14" fill="#9effc9" text-anchor="middle" font-weight="600">Lease component</text>
<text id="lease-label-2" x="240" y="372" font-size="11" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">right to use the van</text>
<rect id="nonlease-component" x="510" y="310" width="300" height="100" rx="6" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<text id="nonlease-label-1" x="660" y="350" font-size="14" fill="#ff7a8a" text-anchor="middle" font-weight="600">Non-lease component</text>
<text id="nonlease-label-2" x="660" y="372" font-size="11" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">maintenance service</text>
<path id="lease-tag-shape" d="M 170 470 L 270 470 L 300 500 L 270 530 L 170 530 Z" stroke="#9effc9" stroke-width="2" fill="none" stroke-dasharray=""/>
<circle id="lease-tag-hole" cx="282" cy="500" r="4" fill="none" stroke="#9effc9" stroke-width="1.5" stroke-dasharray=""/>
<text id="lease-price-tag" x="195" y="507" font-size="16" fill="#9effc9" font-style="italic" text-anchor="middle">\$700</text>
<path id="nonlease-tag-shape" d="M 590 470 L 690 470 L 720 500 L 690 530 L 590 530 Z" stroke="#ff7a8a" stroke-width="2" fill="none" stroke-dasharray=""/>
<circle id="nonlease-tag-hole" cx="702" cy="500" r="4" fill="none" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray=""/>
<text id="nonlease-price-tag" x="615" y="507" font-size="16" fill="#ff7a8a" font-style="italic" text-anchor="middle">\$300</text>
<defs><marker id="arrowhead_lease-tag-link" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(158,255,201,0.55)"/></marker></defs><line id="lease-tag-link" x1="240" y1="410" x2="240" y2="470" stroke="rgba(158,255,201,0.55)" stroke-width="1.5" marker-end="url(#arrowhead_lease-tag-link)"/>
<defs><marker id="arrowhead_nonlease-tag-link" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(255,122,138,0.55)"/></marker></defs><line id="nonlease-tag-link" x1="660" y1="410" x2="660" y2="470" stroke="rgba(255,122,138,0.55)" stroke-width="1.5" marker-end="url(#arrowhead_nonlease-tag-link)"/>
<rect id="expedient-banner" x="250" y="580" width="400" height="44" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2"/>
<text id="expedient-text" x="450" y="607" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Practical expedient: treat as ONE lease</text>
