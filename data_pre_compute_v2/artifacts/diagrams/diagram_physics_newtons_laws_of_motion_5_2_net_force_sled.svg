<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
<rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
<text id="net_title" x="450" y="40" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Net Force and Acceleration</text>
<line id="net_divider_top" x1="60" y1="58" x2="840" y2="58" stroke="#cccccc" stroke-width="1.5" stroke-dasharray=""/>
<text id="net_case1_label" x="450" y="88" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">Case 1: Unequal Forces — Net Force is NOT zero</text>
<rect id="net_sled1" x="370" y="108" width="160" height="80" rx="8" fill="#FFF9C4" stroke="#F9A825" stroke-width="2.5"/>
<text id="net_sled1_label" x="450" y="143" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="bold">SLED</text>
<text id="net_sled1_mass" x="450" y="163" font-size="12" fill="#5D4037" text-anchor="middle" font-weight="normal">m = 5 kg</text>
<defs><marker id="arrowhead_net_force1_left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="net_force1_left" x1="368" y1="148" x2="230" y2="148" stroke="#1565C0" stroke-width="3.5" marker-end="url(#arrowhead_net_force1_left)"/>
<text id="net_force1_left_label" x="298" y="135" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold">F = 6 N</text>
<text id="net_person1_label" x="200" y="148" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="normal">Person B</text>
<defs><marker id="arrowhead_net_force1_right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker></defs><line id="net_force1_right" x1="532" y1="148" x2="700" y2="148" stroke="#C62828" stroke-width="5" marker-end="url(#arrowhead_net_force1_right)"/>
<text id="net_force1_right_label" x="616" y="135" font-size="13" fill="#C62828" text-anchor="middle" font-weight="bold">F = 10 N</text>
<text id="net_person2_label" x="730" y="148" font-size="12" fill="#C62828" text-anchor="middle" font-weight="normal">Person A</text>
<rect id="net_calc1_box" x="270" y="205" width="360" height="60" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
<text id="net_calc1" x="450" y="228" font-size="14" fill="#7B1FA2" font-style="italic" text-anchor="middle">F_{net} = 10 - 6 = 4 \text{ N (rightward)}</text>
<text id="net_calc1b" x="450" y="252" font-size="14" fill="#D32F2F" font-style="italic" text-anchor="middle">a = \frac{F_{net}}{m} = \frac{4}{5} = 0.8 \text{ m/s}^2 \rightarrow</text>
<line id="net_divider_mid" x1="60" y1="285" x2="840" y2="285" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6,4"/>
<text id="net_case2_label" x="450" y="312" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">Case 2: Equal Forces — Net Force IS zero → No Acceleration</text>
<rect id="net_sled2" x="370" y="330" width="160" height="80" rx="8" fill="#FFF9C4" stroke="#F9A825" stroke-width="2.5"/>
<text id="net_sled2_label" x="450" y="365" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="bold">SLED</text>
<text id="net_sled2_mass" x="450" y="385" font-size="12" fill="#5D4037" text-anchor="middle" font-weight="normal">m = 5 kg</text>
<defs><marker id="arrowhead_net_force2_left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="net_force2_left" x1="368" y1="370" x2="230" y2="370" stroke="#1565C0" stroke-width="4" marker-end="url(#arrowhead_net_force2_left)"/>
<text id="net_force2_left_label" x="298" y="357" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold">F = 10 N</text>
<defs><marker id="arrowhead_net_force2_right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker></defs><line id="net_force2_right" x1="532" y1="370" x2="670" y2="370" stroke="#C62828" stroke-width="4" marker-end="url(#arrowhead_net_force2_right)"/>
<text id="net_force2_right_label" x="602" y="357" font-size="13" fill="#C62828" text-anchor="middle" font-weight="bold">F = 10 N</text>
<rect id="net_calc2_box" x="270" y="428" width="360" height="60" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text id="net_calc2" x="450" y="450" font-size="14" fill="#2E7D32" font-style="italic" text-anchor="middle">F_{net} = 10 - 10 = 0 \text{ N}</text>
<text id="net_calc2b" x="450" y="474" font-size="14" fill="#2E7D32" font-style="italic" text-anchor="middle">a = \frac{0}{5} = 0 \text{ m/s}^2 \quad \text{(constant velocity!)}</text>
<rect id="net_reminder_box" x="80" y="510" width="740" height="50" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
<text id="net_reminder" x="450" y="531" font-size="13" fill="#E65100" text-anchor="middle" font-weight="bold">Remember: It is always the NET (total) force that determines acceleration — not any single force alone.</text>
<text id="net_reminder2" x="450" y="550" font-size="12" fill="#BF360C" text-anchor="middle" font-weight="normal">The moment the net force becomes zero, acceleration instantly becomes zero too.</text>
</svg>