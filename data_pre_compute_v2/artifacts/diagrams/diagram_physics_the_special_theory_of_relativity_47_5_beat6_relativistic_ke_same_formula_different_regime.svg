<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="left-label" x="225" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Low speed (v ≪ c)</text>
<text id="right-label" x="675" y="55" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">High speed (v → c)</text>
<line id="divider" x1="450" y1="40" x2="450" y2="610" stroke="rgba(232,232,238,0.2)" stroke-width="1.5" stroke-dasharray="6,5"/>
<text id="full-formula-left" x="225" y="145" font-size="15" fill="#e8e8ee" font-style="italic" text-anchor="middle">KE = (\gamma - 1)m_0 c^2</text>
<text id="approx-arrow" x="225" y="195" font-size="18" fill="#9effc9" font-style="italic" text-anchor="middle">\approx</text>
<text id="classical-formula" x="225" y="245" font-size="17" fill="#9effc9" font-style="italic" text-anchor="middle">\tfrac{1}{2}m_0 v^2</text>
<text id="checkmark" x="225" y="310" font-size="28" fill="#9effc9" text-anchor="middle" font-weight="600">✓</text>
<text id="check-caption" x="225" y="338" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">classical limit</text>
<line id="low-v-line" x1="100" y1="430" x2="370" y2="430" stroke="rgba(232,232,238,0.2)" stroke-width="1" stroke-dasharray=""/>
<line id="low-v-axis-y" x1="100" y1="430" x2="100" y2="260" stroke="rgba(232,232,238,0.2)" stroke-width="1" stroke-dasharray=""/>
<path id="low-v-curve" d="M 100 430 Q 200 420 370 370" stroke="#9effc9" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<text id="low-v-xlabel" x="235" y="448" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">v</text>
<text id="low-v-ylabel" x="88" y="348" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">KE</text>
<text id="low-v-parabola-label" x="310" y="358" font-size="10" fill="#9effc9" text-anchor="start" font-weight="normal">≈ ½m₀v²</text>
<line id="high-v-axis-x" x1="530" y1="530" x2="840" y2="530" stroke="rgba(232,232,238,0.2)" stroke-width="1" stroke-dasharray=""/>
<line id="high-v-axis-y" x1="530" y1="530" x2="530" y2="130" stroke="rgba(232,232,238,0.2)" stroke-width="1" stroke-dasharray=""/>
<path id="high-v-curve" d="M 530 530 C 620 525 700 490 760 420 C 790 380 810 310 820 200 C 824 165 826 145 827 130" stroke="#ff7a8a" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<line id="asymptote" x1="830" y1="530" x2="830" y2="120" stroke="rgba(255,122,138,0.35)" stroke-width="1.5" stroke-dasharray="5,4"/>
<text id="asymptote-label" x="836" y="200" font-size="10" fill="rgba(255,122,138,0.7)" text-anchor="start" font-weight="normal">v = c</text>
<text id="high-v-xlabel" x="685" y="548" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">v</text>
<text id="high-v-ylabel" x="518" y="330" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">KE</text>
<text id="infinity-label" x="800" y="118" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">→ ∞</text>
<text id="full-formula-right" x="675" y="145" font-size="15" fill="#e8e8ee" font-style="italic" text-anchor="middle">KE = (\gamma - 1)m_0 c^2</text>
<defs><marker id="arrowhead_bridge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="bridge-arrow" x1="340" y1="590" x2="560" y2="590" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrowhead_bridge-arrow)"/>
<text id="bridge-label" x="450" y="580" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">same formula, different regime</text>
</svg>