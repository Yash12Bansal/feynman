<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="title" x="450" y="45" font-size="24" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s Laws: The 4-Step Method</text>
<rect id="step1_box" x="60" y="90" width="180" height="480" rx="12" fill="#e8f4fd" stroke="#2196F3" stroke-width="3"/>
<rect id="step1_header" x="60" y="90" width="180" height="50" rx="12" fill="#2196F3" stroke="#2196F3" stroke-width="3"/>
<rect id="step1_header_bottom" x="60" y="120" width="180" height="20" rx="0" fill="#2196F3" stroke="none" stroke-width="0"/>
<text id="step1_num" x="150" y="118" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 1</text>
<text id="step1_title" x="150" y="165" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">Choose Your</text>
<text id="step1_title2" x="150" y="183" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">System</text>
<rect id="step1_block1" x="105" y="205" width="50" height="35" rx="4" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/>
<text id="step1_block1_label" x="130" y="227" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">A</text>
<rect id="step1_block2" x="105" y="240" width="50" height="35" rx="4" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
<text id="step1_block2_label" x="130" y="262" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">B</text>
<line id="step1_floor" x1="90" y1="275" x2="170" y2="275" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<rect id="step1_bracket" x="165" y="205" width="8" height="70" rx="0" fill="none" stroke="#D32F2F" stroke-width="2"/>
<line id="step1_bracket_top" x1="165" y1="205" x2="173" y2="205" stroke="#D32F2F" stroke-width="2" stroke-dasharray=""/>
<line id="step1_bracket_bot" x1="165" y1="275" x2="173" y2="275" stroke="#D32F2F" stroke-width="2" stroke-dasharray=""/>
<text id="step1_rule_title" x="150" y="310" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">Golden Rule:</text>
<text id="step1_rule1" x="150" y="328" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">All parts must</text>
<text id="step1_rule2" x="150" y="344" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">share the same</text>
<text id="step1_rule3" x="150" y="360" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">acceleration</text>
<defs><marker id="arrowhead_step1_accel" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="step1_accel" x1="95" y1="395" x2="165" y2="395" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowhead_step1_accel)"/>
<defs><marker id="arrowhead_step1_accel2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="step1_accel2" x1="95" y1="415" x2="165" y2="415" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowhead_step1_accel2)"/>
<text id="step1_same" x="150" y="445" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">Same a</text>
<text id="step1_group" x="150" y="462" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">= can group!</text>
<rect id="step2_box" x="265" y="90" width="180" height="480" rx="12" fill="#f3e5f5" stroke="#9C27B0" stroke-width="3"/>
<rect id="step2_header" x="265" y="90" width="180" height="50" rx="12" fill="#9C27B0" stroke="#9C27B0" stroke-width="3"/>
<rect id="step2_header_bottom" x="265" y="120" width="180" height="20" rx="0" fill="#9C27B0" stroke="none" stroke-width="0"/>
<text id="step2_num" x="355" y="118" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 2</text>
<text id="step2_title" x="355" y="165" font-size="15" fill="#6A1B9A" text-anchor="middle" font-weight="bold">Identify</text>
<text id="step2_title2" x="355" y="183" font-size="15" fill="#6A1B9A" text-anchor="middle" font-weight="bold">The Forces</text>
<rect id="step2_system" x="320" y="210" width="70" height="45" rx="4" fill="#CE93D8" stroke="#6A1B9A" stroke-width="2"/>
<text id="step2_system_label" x="355" y="237" font-size="12" fill="#4A148C" text-anchor="middle" font-weight="bold">System</text>
<defs><marker id="arrowhead_step2_gravity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="step2_gravity" x1="355" y1="255" x2="355" y2="295" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead_step2_gravity)"/>
<text id="step2_gravity_label" x="375" y="280" font-size="12" fill="#4CAF50" text-anchor="start" font-weight="bold">W</text>
<defs><marker id="arrowhead_step2_normal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="step2_normal" x1="355" y1="210" x2="355" y2="170" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead_step2_normal)"/>
<text id="step2_normal_label" x="375" y="185" font-size="12" fill="#FF9800" text-anchor="start" font-weight="bold">N</text>
<defs><marker id="arrowhead_step2_tension" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/></marker></defs><line id="step2_tension" x1="320" y1="232" x2="280" y2="232" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowhead_step2_tension)"/>
<text id="step2_tension_label" x="285" y="222" font-size="12" fill="#2196F3" text-anchor="middle" font-weight="bold">T</text>
<text id="step2_key_title" x="355" y="325" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">Key Rule:</text>
<text id="step2_key1" x="355" y="343" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Only forces FROM</text>
<text id="step2_key2" x="355" y="359" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">outside acting ON</text>
<text id="step2_key3" x="355" y="375" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">your system!</text>
<line id="step2_cross_line1" x1="290" y1="405" x2="420" y2="425" stroke="#D32F2F" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step2_no_label" x="355" y="450" font-size="11" fill="#888" text-anchor="middle" font-weight="normal">NOT: forces your</text>
<text id="step2_no_label2" x="355" y="466" font-size="11" fill="#888" text-anchor="middle" font-weight="normal">system exerts on</text>
<text id="step2_no_label3" x="355" y="482" font-size="11" fill="#888" text-anchor="middle" font-weight="normal">other objects</text>
<rect id="step3_box" x="470" y="90" width="180" height="480" rx="12" fill="#fff8e1" stroke="#FF9800" stroke-width="3"/>
<rect id="step3_header" x="470" y="90" width="180" height="50" rx="12" fill="#FF9800" stroke="#FF9800" stroke-width="3"/>
<rect id="step3_header_bottom" x="470" y="120" width="180" height="20" rx="0" fill="#FF9800" stroke="none" stroke-width="0"/>
<text id="step3_num" x="560" y="118" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 3</text>
<text id="step3_title" x="560" y="165" font-size="15" fill="#E65100" text-anchor="middle" font-weight="bold">Free Body</text>
<text id="step3_title2" x="560" y="183" font-size="15" fill="#E65100" text-anchor="middle" font-weight="bold">Diagram</text>
<circle id="step3_dot" cx="560" cy="255" r="12" fill="#FF9800" stroke="#E65100" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_step3_up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="step3_up" x1="560" y1="243" x2="560" y2="195" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_step3_up)"/>
<text id="step3_up_label" x="578" y="215" font-size="13" fill="#E65100" text-anchor="start" font-weight="bold">N</text>
<defs><marker id="arrowhead_step3_down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="step3_down" x1="560" y1="267" x2="560" y2="315" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_step3_down)"/>
<text id="step3_down_label" x="578" y="300" font-size="13" fill="#4CAF50" text-anchor="start" font-weight="bold">W</text>
<defs><marker id="arrowhead_step3_right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/></marker></defs><line id="step3_right" x1="572" y1="255" x2="620" y2="255" stroke="#2196F3" stroke-width="3" marker-end="url(#arrowhead_step3_right)"/>
<text id="step3_right_label" x="625" y="250" font-size="13" fill="#2196F3" text-anchor="start" font-weight="bold">F</text>
<text id="step3_desc1" x="560" y="350" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Whole system</text>
<text id="step3_desc2" x="560" y="366" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">= one dot</text>
<text id="step3_desc3" x="560" y="395" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Arrows show every</text>
<text id="step3_desc4" x="560" y="411" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">force: direction</text>
<text id="step3_desc5" x="560" y="427" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">&amp; relative size</text>
<rect id="step4_box" x="675" y="90" width="180" height="480" rx="12" fill="#e8f5e9" stroke="#4CAF50" stroke-width="3"/>
<rect id="step4_header" x="675" y="90" width="180" height="50" rx="12" fill="#4CAF50" stroke="#4CAF50" stroke-width="3"/>
<rect id="step4_header_bottom" x="675" y="120" width="180" height="20" rx="0" fill="#4CAF50" stroke="none" stroke-width="0"/>
<text id="step4_num" x="765" y="118" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 4</text>
<text id="step4_title" x="765" y="165" font-size="15" fill="#1B5E20" text-anchor="middle" font-weight="bold">Axes &amp; Write</text>
<text id="step4_title2" x="765" y="183" font-size="15" fill="#1B5E20" text-anchor="middle" font-weight="bold">Equations</text>
<defs><marker id="arrowhead_step4_xaxis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><line id="step4_xaxis" x1="710" y1="255" x2="820" y2="255" stroke="#555" stroke-width="2" marker-end="url(#arrowhead_step4_xaxis)"/>
<defs><marker id="arrowhead_step4_yaxis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><line id="step4_yaxis" x1="765" y1="310" x2="765" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead_step4_yaxis)"/>
<text id="step4_xlabel" x="828" y="259" font-size="13" fill="#555" text-anchor="start" font-weight="bold">x</text>
<text id="step4_ylabel" x="769" y="196" font-size="13" fill="#555" text-anchor="start" font-weight="bold">y</text>
<text id="step4_eq1" x="765" y="345" font-size="14" fill="#D32F2F" font-style="italic" text-anchor="middle">\sum F_x = ma</text>
<text id="step4_eq2" x="765" y="385" font-size="14" fill="#1565C0" font-style="italic" text-anchor="middle">\sum F_y = 0</text>
<text id="step4_hint1" x="765" y="425" font-size="11" fill="#888" text-anchor="middle" font-weight="normal">(if no y-accel.)</text>
<text id="step4_hint2" x="765" y="455" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">Need more info?</text>
<text id="step4_hint3" x="765" y="472" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Repeat for a</text>
<text id="step4_hint4" x="765" y="488" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">different object!</text>
<defs><marker id="arrowhead_arrow_1_2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs><line id="arrow_1_2" x1="242" y1="330" x2="263" y2="330" stroke="#aaa" stroke-width="2" marker-end="url(#arrowhead_arrow_1_2)"/>
<defs><marker id="arrowhead_arrow_2_3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs><line id="arrow_2_3" x1="447" y1="330" x2="468" y2="330" stroke="#aaa" stroke-width="2" marker-end="url(#arrowhead_arrow_2_3)"/>
<defs><marker id="arrowhead_arrow_3_4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs><line id="arrow_3_4" x1="652" y1="330" x2="673" y2="330" stroke="#aaa" stroke-width="2" marker-end="url(#arrowhead_arrow_3_4)"/>
<text id="footer" x="450" y="620" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Repeat the process for each object if you need more equations.</text>
</svg>