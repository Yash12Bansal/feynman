<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="title" x="450" y="38" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s Laws: The Four-Step Method</text>
<rect id="step1_box" x="30" y="65" width="190" height="520" rx="10" fill="#e8f4fd" stroke="#4682b4" stroke-width="2"/>
<rect id="step1_header" x="30" y="65" width="190" height="44" rx="10" fill="#4682b4" stroke="#4682b4" stroke-width="2"/>
<text id="step1_num" x="125" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 1</text>
<text id="step1_title" x="125" y="100" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Choose Your System</text>
<rect id="step1_block1" x="75" y="130" width="50" height="35" rx="3" fill="#FF9800" stroke="#e65100" stroke-width="2"/>
<text id="step1_block1_label" x="100" y="153" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<rect id="step1_block2" x="75" y="165" width="50" height="35" rx="3" fill="#4CAF50" stroke="#1b5e20" stroke-width="2"/>
<text id="step1_block2_label" x="100" y="188" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<line id="step1_table" x1="55" y1="200" x2="145" y2="200" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<rect id="step1_highlight" x="62" y="126" width="76" height="78" rx="4" fill="none" stroke="#D32F2F" stroke-width="2.5"/>
<text id="step1_highlight_label" x="125" y="222" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="bold">System = A+B</text>
<text id="step1_rule1" x="125" y="248" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">Pick the object(s)</text>
<text id="step1_rule2" x="125" y="264" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">you want to study.</text>
<text id="step1_rule3" x="125" y="290" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="bold">KEY RULE:</text>
<text id="step1_rule4" x="125" y="308" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">Every part must</text>
<text id="step1_rule5" x="125" y="324" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">share the SAME</text>
<text id="step1_rule6" x="125" y="340" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">acceleration.</text>
<rect id="step2_box" x="240" y="65" width="190" height="520" rx="10" fill="#fff8e1" stroke="#FF9800" stroke-width="2"/>
<rect id="step2_header" x="240" y="65" width="190" height="44" rx="10" fill="#FF9800" stroke="#FF9800" stroke-width="2"/>
<text id="step2_num" x="335" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 2</text>
<text id="step2_title" x="335" y="100" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Identify the Forces</text>
<text id="step2_rule1" x="335" y="135" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">List ONLY forces</text>
<text id="step2_rule2" x="335" y="151" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">acting ON your system</text>
<text id="step2_rule3" x="335" y="167" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">from outside.</text>
<line id="step2_divider" x1="258" y1="182" x2="412" y2="182" stroke="#FF9800" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step2_yes_label" x="290" y="202" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">INCLUDE:</text>
<text id="step2_yes1" x="335" y="220" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">Gravity (weight)</text>
<text id="step2_yes2" x="335" y="236" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">Normal force</text>
<text id="step2_yes3" x="335" y="252" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="normal">Tension, friction</text>
<text id="step2_no_label" x="290" y="278" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="bold">EXCLUDE:</text>
<text id="step2_no1" x="335" y="296" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="normal">Forces your system</text>
<text id="step2_no2" x="335" y="312" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="normal">exerts on others!</text>
<rect id="step3_box" x="450" y="65" width="190" height="520" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<rect id="step3_header" x="450" y="65" width="190" height="44" rx="10" fill="#9c27b0" stroke="#9c27b0" stroke-width="2"/>
<text id="step3_num" x="545" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 3</text>
<text id="step3_title" x="545" y="100" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Free Body Diagram</text>
<circle id="step3_dot" cx="545" cy="200" r="12" fill="#9c27b0" stroke="#6a0080" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_step3_gravity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="step3_gravity" x1="545" y1="212" x2="545" y2="265" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arrowhead_step3_gravity)"/>
<text id="step3_gravity_label" x="572" y="248" font-size="10" fill="#2e7d32" text-anchor="start" font-weight="normal">Weight</text>
<defs><marker id="arrowhead_step3_normal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4682b4"/></marker></defs><line id="step3_normal" x1="545" y1="188" x2="545" y2="140" stroke="#4682b4" stroke-width="2.5" marker-end="url(#arrowhead_step3_normal)"/>
<text id="step3_normal_label" x="572" y="158" font-size="10" fill="#4682b4" text-anchor="start" font-weight="normal">Normal</text>
<defs><marker id="arrowhead_step3_tension" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="step3_tension" x1="557" y1="192" x2="610" y2="160" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_step3_tension)"/>
<text id="step3_tension_label" x="618" y="155" font-size="10" fill="#e65100" text-anchor="start" font-weight="normal">Tension</text>
<text id="step3_rule1" x="545" y="295" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">Draw system as a dot.</text>
<text id="step3_rule2" x="545" y="313" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">Each arrow = one force.</text>
<text id="step3_rule3" x="545" y="331" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">Label every arrow.</text>
<rect id="step4_box" x="660" y="65" width="210" height="520" rx="10" fill="#fce4ec" stroke="#D32F2F" stroke-width="2"/>
<rect id="step4_header" x="660" y="65" width="210" height="44" rx="10" fill="#D32F2F" stroke="#D32F2F" stroke-width="2"/>
<text id="step4_num" x="765" y="83" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">STEP 4</text>
<text id="step4_title" x="765" y="100" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Axes &amp; Equations</text>
<defs><marker id="arrowhead_step4_xaxis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="step4_xaxis" x1="700" y1="185" x2="760" y2="185" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowhead_step4_xaxis)"/>
<text id="step4_xlabel" x="768" y="189" font-size="13" fill="#D32F2F" text-anchor="start" font-weight="bold">x</text>
<defs><marker id="arrowhead_step4_yaxis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4682b4"/></marker></defs><line id="step4_yaxis" x1="700" y1="185" x2="700" y2="130" stroke="#4682b4" stroke-width="2" marker-end="url(#arrowhead_step4_yaxis)"/>
<text id="step4_ylabel" x="704" y="122" font-size="13" fill="#4682b4" text-anchor="start" font-weight="bold">y</text>
<text id="step4_rule1" x="765" y="218" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">x-axis: direction of</text>
<text id="step4_rule2" x="765" y="234" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">acceleration.</text>
<text id="step4_rule3" x="765" y="250" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">y-axis: perpendicular.</text>
<line id="step4_divider" x1="678" y1="265" x2="852" y2="265" stroke="#D32F2F" stroke-width="1" stroke-dasharray="4,3"/>
<text id="step4_eq_label" x="765" y="285" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="bold">Write equations:</text>
<text id="step4_eq_x" x="765" y="310" font-size="14" fill="#D32F2F" font-style="italic" text-anchor="middle">\sum F_x = ma</text>
<text id="step4_eq_y" x="765" y="345" font-size="14" fill="#4682b4" font-style="italic" text-anchor="middle">\sum F_y = 0</text>
<text id="step4_note" x="765" y="375" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">(if no y-acceleration)</text>
<text id="step4_solve" x="765" y="400" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">Then solve for</text>
<text id="step4_solve2" x="765" y="416" font-size="11" fill="#1a1a2e" text-anchor="middle" font-weight="normal">the unknown!</text>
<defs><marker id="arrowhead_arrow12" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#888"/></marker></defs><line id="arrow12" x1="222" y1="325" x2="238" y2="325" stroke="#888" stroke-width="2" marker-end="url(#arrowhead_arrow12)"/>
<defs><marker id="arrowhead_arrow23" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#888"/></marker></defs><line id="arrow23" x1="432" y1="325" x2="448" y2="325" stroke="#888" stroke-width="2" marker-end="url(#arrowhead_arrow23)"/>
<defs><marker id="arrowhead_arrow34" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#888"/></marker></defs><line id="arrow34" x1="642" y1="325" x2="658" y2="325" stroke="#888" stroke-width="2" marker-end="url(#arrowhead_arrow34)"/>
<rect id="tip_box" x="30" y="600" width="840" height="36" rx="8" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
<text id="tip_text" x="450" y="623" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="normal">Follow these steps in order every time — they work for almost any Newton&#x27;s law problem you will ever meet.</text>
</svg>