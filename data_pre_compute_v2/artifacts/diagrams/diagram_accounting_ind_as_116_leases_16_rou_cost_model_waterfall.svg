<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="baseline" x1="80" y1="540" x2="840" y2="540" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<rect id="original-cost-block" x="130" y="140" width="120" height="400" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="cost-label" x="190" y="125" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="600">Original cost of right-of-use asset</text>
<rect id="depreciation-cut" x="360" y="140" width="120" height="95" rx="3" fill="none" stroke="#ff7a8a" stroke-width="2"/>
<defs><marker id="arrowhead_depreciation-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="depreciation-arrow" x1="420" y1="160" x2="420" y2="225" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_depreciation-arrow)"/>
<text id="depreciation-label" x="490" y="188" font-size="10" fill="#ff7a8a" text-anchor="start" font-weight="normal">less accumulated depreciation (Ind AS 16)</text>
<rect id="impairment-cut" x="360" y="235" width="120" height="70" rx="3" fill="none" stroke="#ff7a8a" stroke-width="2"/>
<defs><marker id="arrowhead_impairment-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="impairment-arrow" x1="420" y1="250" x2="420" y2="295" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_impairment-arrow)"/>
<text id="impairment-label" x="490" y="274" font-size="10" fill="#ff7a8a" text-anchor="start" font-weight="normal">less accumulated impairment losses (Ind AS 36)</text>
<rect id="remaining-block" x="360" y="305" width="120" height="235" rx="3" fill="none" stroke="rgba(232,232,238,0.55)" stroke-width="1.8"/>
<defs><marker id="arrowhead_remeasurement-adjustment" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="remeasurement-adjustment" x1="520" y1="360" x2="520" y2="300" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_remeasurement-adjustment)"/>
<defs><marker id="arrowhead_remeasurement-adjustment-down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="remeasurement-adjustment-down" x1="520" y1="360" x2="520" y2="420" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_remeasurement-adjustment-down)"/>
<text id="remeasurement-label" x="545" y="364" font-size="10" fill="#9effc9" text-anchor="start" font-weight="normal">adjust for lease liability remeasurement (up or down)</text>
<rect id="carrying-amount-block" x="700" y="320" width="120" height="220" rx="3" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="carrying-label" x="760" y="305" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="600">net carrying amount</text>
<text id="balance-sheet-note" x="760" y="560" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">shown on balance sheet</text>
</svg>
