<line id="commencement-date" x1="130" y1="320" x2="130" y2="400" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="commencement-label" x="130" y="430" font-size="11" fill="#7fd4ff" text-anchor="start" font-weight="600">Commencement date — asset made available</text>
