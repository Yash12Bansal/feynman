<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="entity-y" x="60" y="250" width="170" height="100" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="entity-y-label" x="145" y="295" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">Entity Y</text>
<text id="entity-y-sub" x="145" y="315" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">(lessor / owner)</text>
<rect id="operator-x" x="365" y="250" width="170" height="100" rx="6" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
<text id="operator-x-label" x="450" y="295" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Operator X</text>
<text id="operator-x-sub" x="450" y="315" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">(runs the trains)</text>
<rect id="grantor-g" x="670" y="250" width="170" height="100" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="grantor-g-label" x="755" y="290" font-size="14" fill="#9effc9" text-anchor="middle" font-weight="600">Grantor G</text>
<text id="grantor-g-sub" x="755" y="310" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">(timetable + prices)</text>
<path id="rolling-stock" d="M 405 175 L 495 175 Q 505 175 505 185 L 505 205 Q 505 215 495 215 L 405 215 Q 395 215 395 205 L 395 185 Q 395 175 405 175 Z M 415 185 L 415 205 M 450 185 L 450 205 M 485 185 L 485 205" stroke="#e8e8ee" stroke-width="2" fill="none" stroke-dasharray=""/>
<circle id="rolling-stock-wheel1" cx="420" cy="222" r="6" fill="none" stroke="#e8e8ee" stroke-width="1.5" stroke-dasharray=""/>
<circle id="rolling-stock-wheel2" cx="480" cy="222" r="6" fill="none" stroke="#e8e8ee" stroke-width="1.5" stroke-dasharray=""/>
<text id="rolling-stock-label" x="450" y="162" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">rolling stock</text>
<defs><marker id="arrowhead_payment-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="payment-arrow" x1="405" y1="380" x2="190" y2="380" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_payment-arrow)"/>
<text id="payment-arrow-label" x="297" y="400" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">pays for use</text>
<defs><marker id="arrowhead_control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="control-arrow" x1="230" y1="240" x2="670" y2="240" stroke="#9effc9" stroke-width="4" marker-end="url(#arrowhead_control-arrow)"/>
<text id="control-arrow-label" x="450" y="225" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="600">right to direct use</text>
<rect id="no-lease-stamp" x="350" y="460" width="200" height="56" rx="4" fill="none" stroke="#ff7a8a" stroke-width="2"/>
<text id="no-lease-stamp-text" x="450" y="484" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">no right to control</text>
<text id="no-lease-stamp-text2" x="450" y="503" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">= no lease</text>
</svg>
