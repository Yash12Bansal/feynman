<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="bf_title" x="450" y="42" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s First Law: Balanced Forces</text>
<text id="bf_subtitle" x="450" y="70" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">Zero net force  →  Zero acceleration  →  Object stays still or moves at constant velocity</text>
<line id="bf_divider" x1="450" y1="90" x2="450" y2="610" stroke="#ddd" stroke-width="2" stroke-dasharray="6,4"/>
<text id="bf_ex1_title" x="225" y="108" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Example 1: Book on a Table</text>
<rect id="bf_table_surface" x="80" y="340" width="290" height="18" rx="3" fill="#8B6914" stroke="#5a4010" stroke-width="2"/>
<rect id="bf_table_leg1" x="100" y="358" width="18" height="80" rx="2" fill="#8B6914" stroke="#5a4010" stroke-width="1"/>
<rect id="bf_table_leg2" x="332" y="358" width="18" height="80" rx="2" fill="#8B6914" stroke="#5a4010" stroke-width="1"/>
<rect id="bf_book" x="170" y="295" width="110" height="45" rx="3" fill="#4a90d9" stroke="#2c5f8a" stroke-width="2"/>
<text id="bf_book_label" x="225" y="323" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Book</text>
<defs><marker id="arrowhead_bf_book_gravity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="bf_book_gravity" x1="225" y1="340" x2="225" y2="415" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_bf_book_gravity)"/>
<text id="bf_book_gravity_label" x="270" y="390" font-size="14" fill="#4CAF50" font-style="italic" text-anchor="middle">W = mg</text>
<text id="bf_book_gravity_word" x="270" y="410" font-size="11" fill="#4CAF50" text-anchor="middle" font-weight="normal">(Weight, down)</text>
<defs><marker id="arrowhead_bf_book_normal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="bf_book_normal" x1="225" y1="295" x2="225" y2="220" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_bf_book_normal)"/>
<text id="bf_book_normal_label" x="248" y="248" font-size="14" fill="#FF9800" font-style="italic" text-anchor="middle">N</text>
<text id="bf_book_normal_word" x="248" y="265" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="normal">(Normal, up)</text>
<rect id="bf_book_result_box" x="90" y="455" width="270" height="60" rx="8" fill="#f0f8ff" stroke="#4a90d9" stroke-width="1.5"/>
<text id="bf_book_result" x="225" y="478" font-size="15" fill="#1a1a2e" font-style="italic" text-anchor="middle">N = mg \Rightarrow a = 0</text>
<text id="bf_book_result2" x="225" y="503" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Forces cancel — book stays at rest</text>
<text id="bf_ex2_title" x="675" y="108" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Example 2: Ball on a String</text>
<rect id="bf_ceiling" x="560" y="130" width="230" height="18" rx="2" fill="#aaa" stroke="#777" stroke-width="2"/>
<line id="bf_string" x1="675" y1="148" x2="675" y2="290" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<circle id="bf_ball" cx="675" cy="325" r="38" fill="#e74c3c" stroke="#922b21" stroke-width="2.5" stroke-dasharray=""/>
<text id="bf_ball_label" x="675" y="330" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Ball</text>
<defs><marker id="arrowhead_bf_ball_tension" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="bf_ball_tension" x1="675" y1="287" x2="675" y2="205" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_bf_ball_tension)"/>
<text id="bf_ball_tension_label" x="700" y="235" font-size="14" fill="#FF9800" font-style="italic" text-anchor="middle">T</text>
<text id="bf_ball_tension_word" x="720" y="252" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="normal">(Tension, up)</text>
<defs><marker id="arrowhead_bf_ball_gravity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="bf_ball_gravity" x1="675" y1="363" x2="675" y2="445" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_bf_ball_gravity)"/>
<text id="bf_ball_gravity_label" x="720" y="415" font-size="14" fill="#4CAF50" font-style="italic" text-anchor="middle">W = mg</text>
<text id="bf_ball_gravity_word" x="720" y="432" font-size="11" fill="#4CAF50" text-anchor="middle" font-weight="normal">(Weight, down)</text>
<rect id="bf_ball_result_box" x="555" y="455" width="240" height="60" rx="8" fill="#fff5f5" stroke="#e74c3c" stroke-width="1.5"/>
<text id="bf_ball_result" x="675" y="478" font-size="15" fill="#1a1a2e" font-style="italic" text-anchor="middle">T = mg \Rightarrow a = 0</text>
<text id="bf_ball_result2" x="675" y="503" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Forces cancel — ball hangs at rest</text>
<rect id="bf_law_box" x="100" y="560" width="700" height="58" rx="10" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
<text id="bf_law_statement" x="450" y="582" font-size="17" fill="#ffffff" font-style="italic" text-anchor="middle">\text{Newton&#x27;s 1st Law: } \sum F = 0 \iff a = 0</text>
<text id="bf_law_words" x="450" y="606" font-size="12" fill="#aad4f5" text-anchor="middle" font-weight="normal">Object at rest stays at rest; object in motion stays in motion (at constant velocity)</text>
</svg>