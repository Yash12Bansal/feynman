<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<circle id="node-x" cx="160" cy="300" r="40" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="node-x-label" x="152" y="308" font-size="22" fill="#7fd4ff" font-style="italic" text-anchor="middle">x</text>
<circle id="node-y" cx="450" cy="300" r="40" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<text id="node-y-label" x="442" y="308" font-size="22" fill="#e8e8ee" font-style="italic" text-anchor="middle">y</text>
<circle id="node-z" cx="740" cy="300" r="40" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="node-z-label" x="732" y="308" font-size="22" fill="#9effc9" font-style="italic" text-anchor="middle">z</text>
<defs><marker id="arrowhead_edge-xy" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="edge-xy" x1="204" y1="290" x2="406" y2="290" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_edge-xy)"/>
<text id="edge-xy-label" x="270" y="270" font-size="15" fill="#e8e8ee" font-style="italic" text-anchor="middle">y = g(x)</text>
<defs><marker id="arrowhead_edge-yz" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="edge-yz" x1="494" y1="290" x2="696" y2="290" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_edge-yz)"/>
<text id="edge-yz-label" x="560" y="270" font-size="15" fill="#e8e8ee" font-style="italic" text-anchor="middle">z = f(y)</text>
<defs><marker id="arrowhead_backflow-zy" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="backflow-zy" x1="696" y1="345" x2="494" y2="345" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_backflow-zy)"/>
<text id="backflow-zy-label" x="568" y="392" font-size="17" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{dz}{dy}</text>
<defs><marker id="arrowhead_backflow-yx" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="backflow-yx" x1="406" y1="345" x2="204" y2="345" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_backflow-yx)"/>
<text id="backflow-yx-label" x="278" y="392" font-size="17" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{dy}{dx}</text>
<text id="product-rule" x="360" y="490" font-size="20" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{dz}{dx} = \frac{dz}{dy}\cdot\frac{dy}{dx}</text>
</svg>