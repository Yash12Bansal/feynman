<defs><marker id="arrowhead_hydrogen-pointer" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="hydrogen-pointer" x1="95" y1="360" x2="90" y2="330" stroke="#ff7a8a" stroke-width="2" marker-end="url(#arrowhead_hydrogen-pointer)"/>
<text id="hydrogen-atom-label" x="110" y="378" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">H = hydrogen</text>
<text id="chain-caption" x="230" y="470" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">carbons in a line</text>
<text id="ring-caption" x="670" y="470" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">carbons in a loop</text>
