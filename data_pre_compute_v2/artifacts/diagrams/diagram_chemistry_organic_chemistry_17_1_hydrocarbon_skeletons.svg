<defs><marker id="arrowhead_carbon-pointer" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="carbon-pointer" x1="160" y1="165" x2="160" y2="215" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_carbon-pointer)"/>
