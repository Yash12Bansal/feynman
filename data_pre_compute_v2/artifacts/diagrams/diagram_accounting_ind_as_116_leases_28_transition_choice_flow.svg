<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="contract-back" x="70" y="290" width="110" height="70" rx="4" fill="none" stroke="rgba(232,232,238,0.55)" stroke-width="1.5"/>
<rect id="contract-mid" x="60" y="300" width="110" height="70" rx="4" fill="none" stroke="rgba(232,232,238,0.7)" stroke-width="1.8"/>
<rect id="contract-pile" x="50" y="310" width="110" height="70" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2.2"/>
<text id="contract-label" x="105" y="400" font-size="12" fill="#e8e8ee" text-anchor="middle" font-weight="normal">Existing contracts</text>
<defs><marker id="arrowhead_feed-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="feed-arrow" x1="175" y1="345" x2="320" y2="325" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_feed-arrow)"/>
<path id="decision-fork" d="M 430 245 L 510 325 L 430 405 L 350 325 Z" stroke="#7fd4ff" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<text id="fork-label-1" x="430" y="318" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">Apply new definition</text>
<text id="fork-label-2" x="430" y="336" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">to all existing contracts?</text>
<defs><marker id="arrowhead_path-reassess" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="path-reassess" x1="430" y1="245" x2="430" y2="150" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_path-reassess)"/>
<text id="yes-label" x="445" y="200" font-size="12" fill="#9effc9" text-anchor="start" font-weight="600">Yes</text>
<defs><marker id="arrowhead_path-grandfather" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="path-grandfather" x1="510" y1="325" x2="640" y2="325" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_path-grandfather)"/>
<text id="no-label" x="575" y="312" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">No</text>
<rect id="reassess-box" x="290" y="70" width="280" height="70" rx="6" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="reassess-text-1" x="430" y="100" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Reassess all</text>
<text id="reassess-text-2" x="430" y="122" font-size="11" fill="rgba(158,255,201,0.75)" text-anchor="middle" font-weight="normal">heavy work, fresh eyes</text>
<rect id="grandfather-box" x="650" y="285" width="210" height="80" rx="6" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<text id="grandfather-text-1" x="755" y="312" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">Carry forward</text>
<text id="grandfather-text-2" x="755" y="330" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">old conclusions</text>
<text id="grandfather-text-3" x="755" y="350" font-size="11" fill="rgba(255,122,138,0.75)" text-anchor="middle" font-weight="normal">the practical expedient</text>
</svg>
