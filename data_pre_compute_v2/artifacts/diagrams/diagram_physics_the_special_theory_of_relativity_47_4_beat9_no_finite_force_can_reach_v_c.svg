<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>

<line id="c-barrier" x1="680" y1="80" x2="680" y2="540" stroke="#ff7a8a" stroke-width="2" stroke-dasharray="8 5"/>
<text id="c-barrier-label" x="688" y="100" font-size="12" fill="#ff7a8a" text-anchor="start" font-weight="600">v = c</text>
<text id="barrier-sublabel" x="688" y="116" font-size="11" fill="#ff7a8a" text-anchor="start" font-weight="normal">barrier</text>
<defs><marker id="arrowhead_p-diverge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="p-diverge-arrow" x1="660" y1="200" x2="660" y2="100" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_p-diverge-arrow)"/>
<text id="p-diverge-label" x="640" y="195" font-size="12" fill="#9effc9" text-anchor="end" font-weight="600">p → ∞</text>
<text id="momentum-formula" x="730" y="310" font-size="15" fill="#7fd4ff" font-style="italic" text-anchor="middle">p = \frac{m_0 v}{\sqrt{1 - v^2/c^2}}</text>
<text id="force-formula" x="730" y="370" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">F = \frac{dp}{dt} \to \infty</text>
<circle id="low-v-point" cx="218" cy="490" r="5" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<text id="low-v-label" x="218" y="510" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">low v: p ≈ m₀v</text>
<circle id="high-v-point" cx="636" cy="175" r="5" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<text id="high-v-label" x="600" y="165" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="normal">v → c: p → ∞</text>
</svg>