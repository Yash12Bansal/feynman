<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="n1_title" x="450" y="42" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s First Law — The Law of Inertia</text>
<rect id="n1_top_panel" x="40" y="65" width="820" height="240" rx="12" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
<text id="n1_top_label" x="450" y="92" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold">Case 1: Object at Rest — No Net Force</text>
<line id="n1_ground1" x1="80" y1="240" x2="860" y2="240" stroke="#888" stroke-width="2" stroke-dasharray=""/>
<rect id="n1_block_rest" x="370" y="190" width="80" height="50" rx="5" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/>
<text id="n1_block_rest_label" x="410" y="221" font-size="13" fill="#1B5E20" text-anchor="middle" font-weight="normal">Block</text>
<text id="n1_rest_v" x="410" y="170" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold">v = 0</text>
<text id="n1_rest_desc1" x="200" y="215" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">No force applied</text>
<text id="n1_rest_desc2" x="200" y="235" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold">Block stays at rest</text>
<text id="n1_rest_desc3" x="660" y="215" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">Inertia keeps it still</text>
<text id="n1_rest_desc4" x="660" y="235" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">until a force acts</text>
<text id="n1_rest_quote" x="450" y="278" font-size="14" fill="#388E3C" text-anchor="middle" font-weight="normal">&quot;An object at rest stays at rest.&quot;</text>
<rect id="n1_bottom_panel" x="40" y="330" width="820" height="240" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text id="n1_bottom_label" x="450" y="357" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold">Case 2: Object in Motion — No Net Force</text>
<line id="n1_ground2" x1="80" y1="505" x2="860" y2="505" stroke="#888" stroke-width="2" stroke-dasharray=""/>
<rect id="n1_block_move1" x="100" y="455" width="70" height="50" rx="5" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/>
<rect id="n1_block_move2" x="310" y="455" width="70" height="50" rx="5" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/>
<rect id="n1_block_move3" x="520" y="455" width="70" height="50" rx="5" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/>
<rect id="n1_block_move4" x="730" y="455" width="70" height="50" rx="5" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
<defs><marker id="arrowhead_n1_vel_arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="n1_vel_arrow1" x1="175" y1="480" x2="305" y2="480" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowhead_n1_vel_arrow1)"/>
<defs><marker id="arrowhead_n1_vel_arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="n1_vel_arrow2" x1="385" y1="480" x2="515" y2="480" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowhead_n1_vel_arrow2)"/>
<defs><marker id="arrowhead_n1_vel_arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="n1_vel_arrow3" x1="595" y1="480" x2="725" y2="480" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowhead_n1_vel_arrow3)"/>
<text id="n1_vel_v1" x="135" y="445" font-size="14" fill="#1565C0" font-style="italic" text-anchor="middle">v</text>
<text id="n1_vel_v2" x="345" y="445" font-size="14" fill="#1565C0" font-style="italic" text-anchor="middle">v</text>
<text id="n1_vel_v3" x="555" y="445" font-size="14" fill="#1565C0" font-style="italic" text-anchor="middle">v</text>
<text id="n1_vel_v4" x="765" y="445" font-size="14" fill="#1565C0" font-style="italic" text-anchor="middle">v</text>
<text id="n1_time_label" x="450" y="530" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Time passes — no friction, no force — velocity unchanged</text>
<text id="n1_motion_quote" x="450" y="553" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="normal">&quot;An object in motion stays in motion at the same speed and direction.&quot;</text>
<rect id="n1_footer_box" x="200" y="590" width="500" height="48" rx="10" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="2"/>
<text id="n1_footer_text" x="450" y="610" font-size="15" fill="#4A148C" text-anchor="middle" font-weight="bold">Inertia = resistance to change in motion</text>
<text id="n1_footer_text2" x="450" y="630" font-size="13" fill="#6A1B9A" text-anchor="middle" font-weight="normal">Measured by mass — more mass, more inertia</text>
</svg>