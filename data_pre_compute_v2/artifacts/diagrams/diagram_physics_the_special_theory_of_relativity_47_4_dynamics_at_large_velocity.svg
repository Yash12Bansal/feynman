<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>


<text id="speed-label" x="260" y="62" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">speed vs. momentum</text>
<text id="gamma-label" x="670" y="62" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">effective mass vs. speed</text>
<line id="divider" x1="450" y1="90" x2="450" y2="555" stroke="rgba(232,232,238,0.18)" stroke-width="1" stroke-dasharray="6 5"/>
<text id="c-limit-label" x="310" y="148" font-size="11" fill="#ff7a8a" text-anchor="start" font-weight="normal">v = c</text>
<text id="newtonian-caption" x="260" y="578" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">momentum grows → speed saturates at c</text>
<text id="gamma-caption" x="670" y="578" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">near c, γ → ∞ : effective mass diverges</text>
<text id="momentum-formula" x="260" y="610" font-size="15" fill="#9effc9" font-style="italic" text-anchor="middle">p = \gamma m_0 v</text>
<text id="gamma-formula" x="670" y="610" font-size="15" fill="#7fd4ff" font-style="italic" text-anchor="middle">\gamma = \frac{1}{\sqrt{1 - v^2/c^2}}</text>
</svg>