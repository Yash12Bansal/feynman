<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="before-label" x="230" y="110" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Before</text>
<text id="after-label" x="230" y="400" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">After</text>
