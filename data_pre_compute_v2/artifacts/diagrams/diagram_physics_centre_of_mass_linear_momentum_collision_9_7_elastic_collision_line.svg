<text id="approach-label" x="427" y="292" font-size="12" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">velocity of approach = v₁ − v₂</text>
<line id="track-line-after" x1="90" y1="480" x2="820" y2="480" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
