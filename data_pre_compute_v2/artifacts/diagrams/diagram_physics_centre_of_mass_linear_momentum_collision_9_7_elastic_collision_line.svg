<text id="a-after-label" x="290" y="486" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">A</text>
<circle id="body-b-after" cx="560" cy="480" r="22" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="b-after-label" x="560" y="486" font-size="14" fill="#9effc9" text-anchor="middle" font-weight="600">B</text>
<defs><marker id="arrowhead_v1p-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="v1p-arrow" x1="316" y1="480" x2="360" y2="480" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_v1p-arrow)"/>
