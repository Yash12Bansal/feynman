<text id="a-label" x="290" y="226" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">A</text>
<circle id="body-b" cx="560" cy="220" r="22" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
