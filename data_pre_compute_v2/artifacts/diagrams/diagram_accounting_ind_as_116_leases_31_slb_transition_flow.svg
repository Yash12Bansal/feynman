<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="slb-start" x="320" y="70" width="260" height="70" rx="8" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="slb-start-l1" x="450" y="98" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Sale-and-leaseback</text>
<text id="slb-start-l2" x="450" y="120" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">already on the books (old standard)</text>
<defs><marker id="arrowhead_edge-finance" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="edge-finance" x1="380" y1="140" x2="230" y2="250" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_edge-finance)"/>
<defs><marker id="arrowhead_edge-operating" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="edge-operating" x1="520" y1="140" x2="670" y2="250" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_edge-operating)"/>
<rect id="branch-finance" x="90" y="250" width="280" height="80" rx="8" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="branch-finance-l1" x="230" y="280" font-size="13" fill="#9effc9" text-anchor="middle" font-weight="600">Sale + finance lease</text>
<text id="branch-finance-l2" x="230" y="302" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">carry leaseback forward</text>
<text id="branch-finance-l3" x="230" y="318" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">as a finance lease</text>
<rect id="branch-operating" x="530" y="250" width="280" height="80" rx="8" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<text id="branch-operating-l1" x="670" y="280" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">Sale + operating lease</text>
<text id="branch-operating-l2" x="670" y="302" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">treat leaseback as</text>
<text id="branch-operating-l3" x="670" y="318" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">an operating lease</text>
<defs><marker id="arrowhead_edge-gain" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="edge-gain" x1="230" y1="330" x2="230" y2="440" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_edge-gain)"/>
<defs><marker id="arrowhead_edge-rou" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="edge-rou" x1="670" y1="330" x2="670" y2="440" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_edge-rou)"/>
<rect id="gain-amortise" x="100" y="440" width="260" height="64" rx="6" fill="none" stroke="#9effc9" stroke-width="1.8"/>
<text id="gain-amortise-l1" x="230" y="468" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">Gain continues to</text>
<text id="gain-amortise-l2" x="230" y="486" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">amortise over the lease term</text>
<rect id="rou-adjust" x="540" y="440" width="260" height="64" rx="6" fill="none" stroke="#ff7a8a" stroke-width="1.8"/>
<text id="rou-adjust-l1" x="670" y="468" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Adjust right-of-use asset</text>
<text id="rou-adjust-l2" x="670" y="486" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">for off-market terms</text>
</svg>
