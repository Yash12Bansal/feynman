<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="methanol-label" x="230" y="80" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Methanol</text>
<text id="ethanol-label" x="230" y="360" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Ethanol</text>
<g id="methanol-molecule" transform="translate(0,0)"><text id="m-c" x="200" y="165" font-size="22" fill="#e8e8ee" font-style="italic" text-anchor="middle">C</text><text id="m-h-top" x="205" y="115" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">H</text><text id="m-h-left" x="150" y="168" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">H</text><text id="m-h-bot" x="205" y="215" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">H</text><line id="m-bond-top" x1="212" y1="145" x2="212" y2="125" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/><line id="m-bond-left" x1="195" y1="160" x2="172" y2="160" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/><line id="m-bond-bot" x1="212" y1="175" x2="212" y2="200" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/><line id="m-bond-co" x1="230" y1="160" x2="270" y2="160" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/></g>
<g id="ethanol-molecule" transform="translate(0,0)"><text id="e-c1" x="130" y="445" font-size="22" fill="#e8e8ee" font-style="italic" text-anchor="middle">C</text><text id="e-c1-h-top" x="135" y="395" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">H</text><text id="e-c1-h-left" x="80" y="448" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">H</text><text id="e-c1-h-bot" x="135" y="495" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">H</text><line id="e-c1-bond-top" x1="142" y1="425" x2="142" y2="405" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/><line id="e-c1-bond-left" x1="125" y1="440" x2="102" y2="440" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/><line id="e-c1-bond-bot" x1="142" y1="455" x2="142" y2="480" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/><line id="e-cc-bond" x1="160" y1="440" x2="195" y2="440" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/></g>
<g id="added-carbon" transform="translate(0,0)"><text id="a-c2" x="200" y="445" font-size="22" fill="#9effc9" font-style="italic" text-anchor="middle">C</text><text id="a-c2-h-top" x="205" y="395" font-size="16" fill="#9effc9" font-style="italic" text-anchor="middle">H</text><text id="a-c2-h-bot" x="205" y="495" font-size="16" fill="#9effc9" font-style="italic" text-anchor="middle">H</text><line id="a-c2-bond-top" x1="212" y1="425" x2="212" y2="405" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/><line id="a-c2-bond-bot" x1="212" y1="455" x2="212" y2="480" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/><line id="a-c2-bond-co" x1="230" y1="440" x2="270" y2="440" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/></g>
<g id="carbon-chain" transform="translate(0,0)"><text id="chain-grow-arrow-label" x="230" y="300" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">+ CH₂</text><defs><marker id="arrowhead_chain-grow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="chain-grow-arrow" x1="230" y1="235" x2="230" y2="320" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_chain-grow-arrow)"/></g>
<g id="oh-group" transform="translate(0,0)"><text id="m-o" x="280" y="165" font-size="22" fill="#7fd4ff" font-style="italic" text-anchor="middle">O</text><text id="m-oh-h" x="320" y="165" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">H</text><line id="m-oh-bond" x1="298" y1="160" x2="318" y2="160" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/><text id="e-o" x="280" y="445" font-size="22" fill="#7fd4ff" font-style="italic" text-anchor="middle">O</text><text id="e-oh-h" x="320" y="445" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">H</text><line id="e-oh-bond" x1="298" y1="440" x2="318" y2="440" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/></g>
<text id="m-formula" x="480" y="165" font-size="18" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">CH_3OH</text>
<text id="e-formula" x="480" y="445" font-size="18" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">CH_3CH_2OH</text>
<text id="constant-note" x="670" y="300" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">O–H stays constant</text>
</svg>