<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="left-scene-label" x="225" y="58" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Slow ball</text>
<text id="right-scene-label" x="675" y="58" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Fast ball</text>
<line id="divider" x1="450" y1="80" x2="450" y2="580" stroke="rgba(232,232,238,0.18)" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle id="ball-slow" cx="185" cy="290" r="32" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_arrow-slow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="arrow-slow" x1="218" y1="290" x2="290" y2="290" stroke="#7fd4ff" stroke-width="2.5" marker-end="url(#arrowhead_arrow-slow)"/>
<text id="label-slow-speed" x="185" y="346" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">speed = v</text>
<rect id="energy-bar-slow" x="340" y="380" width="38" height="80" rx="3" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="label-ke-slow" x="359" y="478" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="normal">KE = 1 unit</text>
<line id="baseline-left" x1="100" y1="460" x2="420" y2="460" stroke="rgba(232,232,238,0.35)" stroke-width="1.5" stroke-dasharray=""/>
<circle id="ball-fast" cx="590" cy="290" r="32" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_arrow-fast" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="arrow-fast" x1="623" y1="290" x2="770" y2="290" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_arrow-fast)"/>
<text id="label-fast-speed" x="590" y="346" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">speed = 2v</text>
<rect id="energy-bar-fast" x="760" y="140" width="38" height="320" rx="3" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<text id="label-ke-fast" x="779" y="478" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="normal">KE = 4 units</text>
<line id="baseline-right" x1="480" y1="460" x2="860" y2="460" stroke="rgba(232,232,238,0.35)" stroke-width="1.5" stroke-dasharray=""/>
<text id="ke-formula" x="450" y="570" font-size="15" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">KE = \frac{1}{2}mv^{2}</text>
<text id="bar-scale-note" x="359" y="370" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">1×</text>
<text id="bar-scale-note-fast" x="779" y="130" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">4×</text>
</svg>