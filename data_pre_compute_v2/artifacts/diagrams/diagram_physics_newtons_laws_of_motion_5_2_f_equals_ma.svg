<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="fma_title" x="450" y="42" font-size="24" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s Second Law of Motion</text>
<text id="fma_equation" x="450" y="75" font-size="22" fill="#D32F2F" font-style="italic" text-anchor="middle">\vec{F}_{net} = m\vec{a}</text>
<line id="fma_divider" x1="50" y1="105" x2="850" y2="105" stroke="#cccccc" stroke-width="2" stroke-dasharray=""/>
<text id="fma_row1_label" x="450" y="135" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">Same Force, Different Mass → Different Acceleration</text>
<rect id="fma_small_block" x="160" y="155" width="60" height="60" rx="6" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/>
<text id="fma_small_mass_label" x="190" y="191" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">1 kg</text>
<defs><marker id="arrowhead_fma_force1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force1" x1="80" y1="185" x2="158" y2="185" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_force1)"/>
<text id="fma_force1_label" x="119" y="175" font-size="13" fill="#FF9800" text-anchor="middle" font-weight="normal">10 N</text>
<defs><marker id="arrowhead_fma_accel1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel1" x1="222" y1="185" x2="370" y2="185" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_accel1)"/>
<text id="fma_accel1_label" x="295" y="172" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 10 \text{ m/s}^2</text>
<text id="fma_accel1_word" x="295" y="215" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">Large acceleration!</text>
<rect id="fma_large_block" x="530" y="145" width="100" height="80" rx="6" fill="#4DB6AC" stroke="#00695C" stroke-width="2"/>
<text id="fma_large_mass_label" x="580" y="191" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">10 kg</text>
<defs><marker id="arrowhead_fma_force2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force2" x1="450" y1="185" x2="528" y2="185" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_force2)"/>
<text id="fma_force2_label" x="489" y="175" font-size="13" fill="#FF9800" text-anchor="middle" font-weight="normal">10 N</text>
<defs><marker id="arrowhead_fma_accel2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel2" x1="632" y1="185" x2="665" y2="185" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_accel2)"/>
<text id="fma_accel2_label" x="745" y="172" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 1 \text{ m/s}^2</text>
<text id="fma_accel2_word" x="745" y="215" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">Small acceleration!</text>
<line id="fma_divider2" x1="50" y1="240" x2="850" y2="240" stroke="#cccccc" stroke-width="2" stroke-dasharray=""/>
<text id="fma_row2_label" x="450" y="268" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">Same Mass, More Force → More Acceleration</text>
<rect id="fma_block_a" x="200" y="288" width="70" height="70" rx="6" fill="#CE93D8" stroke="#6A1B9A" stroke-width="2"/>
<text id="fma_block_a_label" x="235" y="329" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">5 kg</text>
<defs><marker id="arrowhead_fma_force_a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force_a" x1="110" y1="323" x2="198" y2="323" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_force_a)"/>
<text id="fma_force_a_label" x="154" y="313" font-size="13" fill="#FF9800" text-anchor="middle" font-weight="normal">5 N</text>
<defs><marker id="arrowhead_fma_accel_a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel_a" x1="272" y1="323" x2="330" y2="323" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_accel_a)"/>
<text id="fma_accel_a_label" x="235" y="375" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 1 \text{ m/s}^2</text>
<rect id="fma_block_b" x="570" y="288" width="70" height="70" rx="6" fill="#CE93D8" stroke="#6A1B9A" stroke-width="2"/>
<text id="fma_block_b_label" x="605" y="329" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">5 kg</text>
<defs><marker id="arrowhead_fma_force_b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force_b" x1="430" y1="323" x2="568" y2="323" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_force_b)"/>
<text id="fma_force_b_label" x="499" y="313" font-size="13" fill="#FF9800" text-anchor="middle" font-weight="normal">25 N</text>
<defs><marker id="arrowhead_fma_accel_b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel_b" x1="642" y1="323" x2="790" y2="323" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_accel_b)"/>
<text id="fma_accel_b_label" x="605" y="375" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 5 \text{ m/s}^2</text>
<line id="fma_divider3" x1="50" y1="405" x2="850" y2="405" stroke="#cccccc" stroke-width="2" stroke-dasharray=""/>
<text id="fma_netforce_title" x="450" y="433" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">Net Force = Vector Sum of ALL Forces</text>
<rect id="fma_tug_box" x="385" y="455" width="130" height="70" rx="6" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
<text id="fma_tug_box_label" x="450" y="496" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Rope / Box</text>
<defs><marker id="arrowhead_fma_tug_left_equal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/></marker></defs><line id="fma_tug_left_equal" x1="383" y1="490" x2="240" y2="490" stroke="#1565C0" stroke-width="3" marker-end="url(#arrowhead_fma_tug_left_equal)"/>
<text id="fma_tug_left_label" x="311" y="478" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="normal">30 N</text>
<defs><marker id="arrowhead_fma_tug_right_equal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C62828"/></marker></defs><line id="fma_tug_right_equal" x1="517" y1="490" x2="660" y2="490" stroke="#C62828" stroke-width="3" marker-end="url(#arrowhead_fma_tug_right_equal)"/>
<text id="fma_tug_right_label" x="589" y="478" font-size="13" fill="#C62828" text-anchor="middle" font-weight="normal">30 N</text>
<text id="fma_net_zero" x="450" y="548" font-size="14" fill="#2E7D32" font-style="italic" text-anchor="middle">F_{net} = 0 \Rightarrow a = 0</text>
<text id="fma_net_zero_word" x="450" y="575" font-size="13" fill="#555555" text-anchor="middle" font-weight="normal">Equal and opposite forces cancel — no acceleration!</text>
<rect id="fma_legend_box" x="50" y="600" width="800" height="38" rx="6" fill="#F5F5F5" stroke="#cccccc" stroke-width="1"/>
<defs><marker id="arrowhead_fma_legend_force_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_legend_force_arrow" x1="80" y1="619" x2="115" y2="619" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_legend_force_arrow)"/>
<text id="fma_legend_force_text" x="155" y="623" font-size="13" fill="#FF9800" text-anchor="middle" font-weight="normal">Applied Force</text>
<defs><marker id="arrowhead_fma_legend_accel_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_legend_accel_arrow" x1="270" y1="619" x2="305" y2="619" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_legend_accel_arrow)"/>
<text id="fma_legend_accel_text" x="355" y="623" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="normal">Acceleration</text>
<text id="fma_legend_note" x="620" y="623" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">Acceleration is ALWAYS in the direction of net force</text>
</svg>