<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="fma_title" x="450" y="42" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s Second Law of Motion</text>
<text id="fma_equation" x="450" y="78" font-size="22" fill="#D32F2F" font-style="italic" text-anchor="middle">\vec{F}_{net} = m\vec{a}</text>
<line id="fma_divider" x1="60" y1="100" x2="840" y2="100" stroke="#cccccc" stroke-width="1.5" stroke-dasharray=""/>
<text id="fma_scenario_label" x="450" y="128" font-size="15" fill="#444" text-anchor="middle" font-weight="normal">Same Force, Different Mass → Different Acceleration</text>
<rect id="fma_light_block" x="180" y="165" width="70" height="70" rx="6" fill="#BBDEFB" stroke="#1565C0" stroke-width="2.5"/>
<text id="fma_light_mass" x="215" y="196" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">m = 1 kg</text>
<text id="fma_light_mass2" x="215" y="213" font-size="11" fill="#1565C0" text-anchor="middle" font-weight="normal">(light)</text>
<defs><marker id="arrowhead_fma_force_light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force_light" x1="80" y1="200" x2="178" y2="200" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_force_light)"/>
<text id="fma_force_light_label" x="130" y="188" font-size="12" fill="#FF9800" text-anchor="middle" font-weight="bold">F = 10 N</text>
<defs><marker id="arrowhead_fma_accel_light" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel_light" x1="252" y1="200" x2="390" y2="200" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_accel_light)"/>
<text id="fma_accel_light_label" x="320" y="185" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 10 \text{ m/s}^2</text>
<text id="fma_accel_light_sub" x="320" y="222" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="normal">(large acceleration!)</text>
<rect id="fma_heavy_block" x="180" y="310" width="110" height="110" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2.5"/>
<text id="fma_heavy_mass" x="235" y="358" font-size="12" fill="#2E7D32" text-anchor="middle" font-weight="bold">m = 10 kg</text>
<text id="fma_heavy_mass2" x="235" y="376" font-size="11" fill="#2E7D32" text-anchor="middle" font-weight="normal">(heavy)</text>
<defs><marker id="arrowhead_fma_force_heavy" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force_heavy" x1="80" y1="365" x2="178" y2="365" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_fma_force_heavy)"/>
<text id="fma_force_heavy_label" x="130" y="353" font-size="12" fill="#FF9800" text-anchor="middle" font-weight="bold">F = 10 N</text>
<defs><marker id="arrowhead_fma_accel_heavy" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel_heavy" x1="292" y1="365" x2="320" y2="365" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_fma_accel_heavy)"/>
<text id="fma_accel_heavy_label" x="370" y="352" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 1 \text{ m/s}^2</text>
<text id="fma_accel_heavy_sub" x="370" y="385" font-size="11" fill="#D32F2F" text-anchor="middle" font-weight="normal">(small acceleration)</text>
<line id="fma_vertical_divider" x1="490" y1="108" x2="490" y2="490" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6,4"/>
<text id="fma_scenario2_label" x="700" y="128" font-size="15" fill="#444" text-anchor="middle" font-weight="normal">Same Mass, More Force → More Acceleration</text>
<rect id="fma_block_small_f" x="620" y="165" width="70" height="70" rx="6" fill="#EDE7F6" stroke="#512DA8" stroke-width="2.5"/>
<text id="fma_block_small_f_label" x="655" y="196" font-size="12" fill="#512DA8" text-anchor="middle" font-weight="bold">m = 2 kg</text>
<text id="fma_block_small_f_label2" x="655" y="213" font-size="11" fill="#512DA8" text-anchor="middle" font-weight="normal">F = 4 N</text>
<defs><marker id="arrowhead_fma_force_small" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force_small" x1="540" y1="200" x2="618" y2="200" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead_fma_force_small)"/>
<text id="fma_force_small_label" x="578" y="188" font-size="12" fill="#FF9800" text-anchor="middle" font-weight="bold">4 N</text>
<defs><marker id="arrowhead_fma_accel_small_f" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel_small_f" x1="692" y1="200" x2="730" y2="200" stroke="#D32F2F" stroke-width="2.5" marker-end="url(#arrowhead_fma_accel_small_f)"/>
<text id="fma_accel_small_f_label" x="780" y="188" font-size="12" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 2 \text{ m/s}^2</text>
<rect id="fma_block_large_f" x="620" y="310" width="70" height="70" rx="6" fill="#EDE7F6" stroke="#512DA8" stroke-width="2.5"/>
<text id="fma_block_large_f_label" x="655" y="341" font-size="12" fill="#512DA8" text-anchor="middle" font-weight="bold">m = 2 kg</text>
<text id="fma_block_large_f_label2" x="655" y="358" font-size="11" fill="#512DA8" text-anchor="middle" font-weight="normal">F = 12 N</text>
<defs><marker id="arrowhead_fma_force_large" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="fma_force_large" x1="510" y1="345" x2="618" y2="345" stroke="#FF9800" stroke-width="4" marker-end="url(#arrowhead_fma_force_large)"/>
<text id="fma_force_large_label" x="562" y="333" font-size="12" fill="#FF9800" text-anchor="middle" font-weight="bold">12 N</text>
<defs><marker id="arrowhead_fma_accel_large_f" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="fma_accel_large_f" x1="692" y1="345" x2="810" y2="345" stroke="#D32F2F" stroke-width="4" marker-end="url(#arrowhead_fma_accel_large_f)"/>
<text id="fma_accel_large_f_label" x="780" y="333" font-size="12" fill="#D32F2F" font-style="italic" text-anchor="middle">a = 6 \text{ m/s}^2</text>
<text id="fma_triple_note" x="700" y="395" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">3× the force → 3× the acceleration</text>
<line id="fma_bottom_divider" x1="60" y1="490" x2="840" y2="490" stroke="#cccccc" stroke-width="1.5" stroke-dasharray=""/>
<text id="fma_key_title" x="450" y="518" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">Key Relationships</text>
<rect id="fma_key_box1" x="80" y="530" width="220" height="88" rx="8" fill="#FFF8E1" stroke="#FF9800" stroke-width="1.5"/>
<text id="fma_key1_title" x="190" y="550" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Force doubles →</text>
<text id="fma_key1_body" x="190" y="570" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="normal">Acceleration doubles</text>
<text id="fma_key1_note" x="190" y="600" font-size="11" fill="#888" text-anchor="middle" font-weight="normal">(F and a are proportional)</text>
<rect id="fma_key_box2" x="340" y="530" width="220" height="88" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
<text id="fma_key2_title" x="450" y="550" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Mass doubles →</text>
<text id="fma_key2_body" x="450" y="570" font-size="13" fill="#D32F2F" text-anchor="middle" font-weight="normal">Acceleration halves</text>
<text id="fma_key2_note" x="450" y="600" font-size="11" fill="#888" text-anchor="middle" font-weight="normal">(m and a are inversely proportional)</text>
<rect id="fma_key_box3" x="600" y="530" width="220" height="88" rx="8" fill="#FCE4EC" stroke="#D32F2F" stroke-width="1.5"/>
<text id="fma_key3_title" x="710" y="550" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">Direction of acceleration</text>
<text id="fma_key3_body" x="710" y="572" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">always matches direction</text>
<text id="fma_key3_body2" x="710" y="590" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">of the net force</text>
<text id="fma_key3_note" x="710" y="608" font-size="11" fill="#888" text-anchor="middle" font-weight="normal">(both are vectors)</text>
<text id="fma_left_brace_top" x="60" y="200" font-size="13" fill="#999" text-anchor="middle" font-weight="normal">↑</text>
<text id="fma_same_force_note" x="40" y="285" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="bold">Same</text>
<text id="fma_same_force_note2" x="40" y="300" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="bold">Force</text>
<text id="fma_left_brace_bot" x="60" y="365" font-size="13" fill="#999" text-anchor="middle" font-weight="normal">↓</text>
</svg>