<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
<rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
<text id="n3_title" x="450" y="36" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">Action-Reaction Pairs: Who Feels What?</text>
<text id="n3_subtitle" x="450" y="60" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">Each pair is equal and opposite — but they act on DIFFERENT objects</text>
<line id="n3_top_divider" x1="50" y1="72" x2="850" y2="72" stroke="#ccc" stroke-width="1.5" stroke-dasharray=""/>
<rect id="n3_ground_rect" x="60" y="530" width="780" height="22" rx="0" fill="#c8a96e" stroke="#a07840" stroke-width="1.5"/>
<text id="n3_ground_label" x="450" y="546" font-size="12" fill="#5a3a00" text-anchor="middle" font-weight="bold">GROUND</text>
<rect id="n3_horse_box" x="130" y="200" width="160" height="90" rx="14" fill="#8B6914" stroke="#5a4010" stroke-width="2.5"/>
<text id="n3_horse_box_label" x="210" y="252" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">HORSE</text>
<line id="n3_horse_leg1" x1="175" y1="290" x2="168" y2="530" stroke="#5a4010" stroke-width="5" stroke-dasharray=""/>
<line id="n3_horse_leg2" x1="245" y1="290" x2="252" y2="530" stroke="#5a4010" stroke-width="5" stroke-dasharray=""/>
<rect id="n3_cart_box" x="580" y="210" width="170" height="80" rx="8" fill="#5b8dd9" stroke="#2a5ca8" stroke-width="2.5"/>
<text id="n3_cart_box_label" x="665" y="257" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">CART</text>
<circle id="n3_wheel1" cx="615" cy="510" r="22" fill="#ddd" stroke="#555" stroke-width="2.5" stroke-dasharray=""/>
<circle id="n3_wheel2" cx="715" cy="510" r="22" fill="#ddd" stroke="#555" stroke-width="2.5" stroke-dasharray=""/>
<line id="n3_cart_support1" x1="615" y1="290" x2="615" y2="488" stroke="#2a5ca8" stroke-width="4" stroke-dasharray=""/>
<line id="n3_cart_support2" x1="715" y1="290" x2="715" y2="488" stroke="#2a5ca8" stroke-width="4" stroke-dasharray=""/>
<line id="n3_rope_line" x1="290" y1="250" x2="580" y2="250" stroke="#8B4513" stroke-width="5" stroke-dasharray=""/>
<text id="n3_rope_label" x="435" y="238" font-size="12" fill="#8B4513" text-anchor="middle" font-weight="bold">rope</text>
<rect id="n3_pair1_bg" x="310" y="88" width="280" height="100" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
<text id="n3_pair1_title" x="450" y="108" font-size="13" fill="#880e4f" text-anchor="middle" font-weight="bold">PAIR 1: Horse-Cart via Rope</text>
<defs><marker id="arrowhead_n3_pair1_a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="n3_pair1_a" x1="380" y1="128" x2="330" y2="128" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_n3_pair1_a)"/>
<text id="n3_pair1_a_label" x="355" y="143" font-size="11" fill="#4CAF50" text-anchor="middle" font-weight="bold">on CART</text>
<defs><marker id="arrowhead_n3_pair1_b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="n3_pair1_b" x1="520" y1="128" x2="570" y2="128" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_n3_pair1_b)"/>
<text id="n3_pair1_b_label" x="545" y="143" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="bold">on HORSE</text>
<text id="n3_pair1_eq" x="450" y="175" font-size="12" fill="#880e4f" font-style="italic" text-anchor="middle">F_1 = F_2 \text{ (equal magnitude, opposite direction)}</text>
<defs><marker id="arrowhead_n3_horse_pull_cart" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="n3_horse_pull_cart" x1="290" y1="250" x2="390" y2="250" stroke="#4CAF50" stroke-width="4" marker-end="url(#arrowhead_n3_horse_pull_cart)"/>
<text id="n3_horse_pull_cart_label" x="340" y="268" font-size="11" fill="#4CAF50" text-anchor="middle" font-weight="bold">Horse pulls cart</text>
<text id="n3_F1_label" x="340" y="282" font-size="12" fill="#4CAF50" font-style="italic" text-anchor="middle">F_1 \rightarrow</text>
<defs><marker id="arrowhead_n3_cart_pull_horse" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="n3_cart_pull_horse" x1="580" y1="250" x2="480" y2="250" stroke="#FF9800" stroke-width="4" marker-end="url(#arrowhead_n3_cart_pull_horse)"/>
<text id="n3_cart_pull_horse_label" x="530" y="268" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="bold">Cart pulls horse</text>
<text id="n3_F2_label" x="530" y="282" font-size="12" fill="#FF9800" font-style="italic" text-anchor="middle">\leftarrow F_2</text>
<rect id="n3_pair2_bg" x="60" y="340" width="230" height="90" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
<text id="n3_pair2_title" x="175" y="360" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">PAIR 2: Horse-Ground</text>
<text id="n3_pair2_a" x="175" y="382" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Horse pushes ground BACK</text>
<text id="n3_pair2_b" x="175" y="400" font-size="11" fill="#4CAF50" text-anchor="middle" font-weight="bold">Ground pushes horse FORWARD</text>
<text id="n3_pair2_note" x="175" y="418" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">This force acts ON the horse!</text>
<defs><marker id="arrowhead_n3_ground_horse_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="n3_ground_horse_arrow" x1="210" y1="530" x2="210" y2="430" stroke="#4CAF50" stroke-width="4" marker-end="url(#arrowhead_n3_ground_horse_arrow)"/>
<text id="n3_ground_horse_arrow_label" x="155" y="480" font-size="12" fill="#4CAF50" text-anchor="middle" font-weight="bold">f_ground</text>
<rect id="n3_pair3_bg" x="610" y="340" width="240" height="90" rx="8" fill="#fff8e1" stroke="#f57c00" stroke-width="1.5"/>
<text id="n3_pair3_title" x="730" y="360" font-size="12" fill="#e65100" text-anchor="middle" font-weight="bold">PAIR 3: Cart-Ground</text>
<text id="n3_pair3_a" x="730" y="382" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Cart wheels push ground FORWARD</text>
<text id="n3_pair3_b" x="730" y="400" font-size="11" fill="#FF9800" text-anchor="middle" font-weight="bold">Ground pushes cart BACK (friction)</text>
<text id="n3_pair3_note" x="730" y="418" font-size="11" fill="#e65100" text-anchor="middle" font-weight="bold">This force acts ON the cart!</text>
<defs><marker id="arrowhead_n3_ground_cart_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="n3_ground_cart_arrow" x1="665" y1="488" x2="665" y2="430" stroke="#FF9800" stroke-width="4" marker-end="url(#arrowhead_n3_ground_cart_arrow)"/>
<text id="n3_ground_cart_label" x="730" y="460" font-size="12" fill="#FF9800" text-anchor="middle" font-weight="bold">f_road (back)</text>
<rect id="n3_rule_box" x="200" y="570" width="500" height="38" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text id="n3_rule_text" x="450" y="594" font-size="13" fill="#0d47a1" text-anchor="middle" font-weight="bold">RULE: Pick your system. Count ONLY forces acting ON it. Apply F = ma.</text>
</svg>