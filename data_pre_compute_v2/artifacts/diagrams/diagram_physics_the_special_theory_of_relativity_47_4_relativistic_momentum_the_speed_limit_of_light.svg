<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>

<line id="c-limit-line" x1="100" y1="410" x2="780" y2="410" stroke="#9effc9" stroke-width="1.5" stroke-dasharray="8,5"/>
<text id="c-limit-label" x="788" y="414" font-size="12" fill="#9effc9" text-anchor="start" font-weight="600">v = c</text>
<text id="relativistic-label" x="660" y="248" font-size="12" fill="#7fd4ff" text-anchor="start" font-weight="600">relativistic</text>
<text id="newtonian-label" x="530" y="178" font-size="12" fill="#ff7a8a" text-anchor="start" font-weight="600">Newtonian</text>
<defs><marker id="arrowhead_newtonian-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="newtonian-arrow" x1="527" y1="183" x2="510" y2="200" stroke="#ff7a8a" stroke-width="1.8" marker-end="url(#arrowhead_newtonian-arrow)"/>
<defs><marker id="arrowhead_relativistic-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="relativistic-arrow" x1="657" y1="253" x2="640" y2="265" stroke="#7fd4ff" stroke-width="1.8" marker-end="url(#arrowhead_relativistic-arrow)"/>
<text id="low-speed-note" x="200" y="530" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">low speed: curves agree</text>
<circle id="low-speed-marker" cx="168" cy="459" r="5" fill="none" stroke="#e8e8ee" stroke-width="1.8" stroke-dasharray=""/>
<line id="low-speed-tick-line" x1="168" y1="464" x2="185" y2="520" stroke="rgba(232,232,238,0.35)" stroke-width="1" stroke-dasharray="3,3"/>
<text id="momentum-formula" x="440" y="590" font-size="15" fill="#7fd4ff" font-style="italic" text-anchor="middle">p = \gamma m_0 v</text>
<text id="gamma-formula" x="660" y="590" font-size="14" fill="rgba(232,232,238,0.75)" font-style="italic" text-anchor="middle">\gamma = \frac{1}{\sqrt{1 - v^2/c^2}}</text>
</svg>