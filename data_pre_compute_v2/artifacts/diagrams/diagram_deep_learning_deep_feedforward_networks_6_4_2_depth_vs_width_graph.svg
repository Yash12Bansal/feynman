<text id="tick-20m" x="310" y="540" font-size="11" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">20\text{M}</text>
<text id="tick-60m" x="560" y="540" font-size="11" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">60\text{M}</text>
<text id="tick-100m" x="790" y="540" font-size="11" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">100\text{M}</text>
<text id="tick-91" x="96" y="524" font-size="11" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">91</text>
<text id="tick-97" x="96" y="134" font-size="11" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">97</text>
<rect id="deep-benefit-region" x="580" y="110" width="240" height="410" rx="4" fill="none" stroke="#9effc9" stroke-width="1.5"/>
<path id="deep-curve" d="M 140 470 Q 280 360 360 300 Q 480 220 580 195 Q 690 170 800 150" stroke="#9effc9" stroke-width="3" fill="none" stroke-dasharray=""/>
