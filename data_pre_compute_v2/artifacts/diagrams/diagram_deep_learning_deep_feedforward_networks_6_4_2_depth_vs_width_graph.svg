<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<defs><marker id="arrowhead_param-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="param-axis" x1="120" y1="520" x2="820" y2="520" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_param-axis)"/>
<defs><marker id="arrowhead_accuracy-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="accuracy-axis" x1="120" y1="520" x2="120" y2="110" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_accuracy-axis)"/>
<text id="param-axis-label" x="470" y="575" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">number of parameters</text>
