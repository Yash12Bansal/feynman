<text id="deep-label" x="805" y="148" font-size="13" fill="#9effc9" text-anchor="start" font-weight="600">deep</text>
<text id="shallow-label" x="805" y="403" font-size="13" fill="#ff7a8a" text-anchor="start" font-weight="600">shallow</text>
