<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="axis" x1="120" y1="320" x2="780" y2="320" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray="6 6"/>
<circle id="nucleus-body" cx="380" cy="320" r="46" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<circle id="alpha-body" cx="540" cy="320" r="18" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<circle id="centre-mass-dot" cx="450" cy="320" r="5" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_alpha-momentum-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="alpha-momentum-arrow" x1="558" y1="320" x2="700" y2="320" stroke="#9effc9" stroke-width="3" marker-end="url(#arrowhead_alpha-momentum-arrow)"/>
<defs><marker id="arrowhead_nucleus-momentum-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="nucleus-momentum-arrow" x1="334" y1="320" x2="192" y2="320" stroke="#ff7a8a" stroke-width="3" marker-end="url(#arrowhead_nucleus-momentum-arrow)"/>
<text id="nucleus-label" x="380" y="392" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">heavy nucleus</text>
<text id="alpha-label" x="540" y="286" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">alpha particle</text>
<text id="alpha-p-label" x="700" y="300" font-size="15" fill="#9effc9" font-style="italic" text-anchor="middle">+p</text>
<text id="nucleus-p-label" x="168" y="300" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">-p</text>
<text id="cm-label" x="450" y="300" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="normal">centre of mass (at rest)</text>
<text id="total-momentum-label" x="450" y="480" font-size="18" fill="#e8e8ee" font-style="italic" text-anchor="middle">\vec{p}_{\text{tot}} = (+p) + (-p) = 0</text>
</svg>