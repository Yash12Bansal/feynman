<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="title" x="450" y="38" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Newton&#x27;s Third Law: Action-Reaction Pairs</text>
<text id="subtitle" x="450" y="62" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Forces always come in pairs — equal in magnitude, opposite in direction, acting on DIFFERENT objects</text>
<line id="divider" x1="450" y1="80" x2="450" y2="620" stroke="#ddd" stroke-width="2" stroke-dasharray="6,4"/>
<text id="scenario1_title" x="225" y="100" font-size="15" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Scenario 1: Person Pushing a Wall</text>
<rect id="wall" x="340" y="130" width="40" height="200" rx="3" fill="#b0bec5" stroke="#555" stroke-width="2"/>
<text id="wall_label" x="360" y="350" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Wall</text>
<rect id="person_body" x="195" y="175" width="50" height="90" rx="6" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
<circle id="person_head" cx="220" cy="160" r="18" fill="#ffcc80" stroke="#e65100" stroke-width="2" stroke-dasharray=""/>
<line id="person_arm" x1="245" y1="205" x2="340" y2="215" stroke="#1565c0" stroke-width="4" stroke-dasharray=""/>
<line id="person_leg1" x1="210" y1="265" x2="200" y2="320" stroke="#1565c0" stroke-width="4" stroke-dasharray=""/>
<line id="person_leg2" x1="230" y1="265" x2="240" y2="320" stroke="#1565c0" stroke-width="4" stroke-dasharray=""/>
<line id="ground_s1" x1="100" y1="320" x2="390" y2="320" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<defs><marker id="arrowhead_push_on_wall" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="push_on_wall" x1="310" y1="215" x2="345" y2="215" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_push_on_wall)"/>
<defs><marker id="arrowhead_push_on_person" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="push_on_person" x1="375" y1="240" x2="310" y2="240" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_push_on_person)"/>
<rect id="label_box_push_wall" x="100" y="370" width="155" height="52" rx="6" fill="#ffebee" stroke="#D32F2F" stroke-width="1.5"/>
<text id="label_push_wall_1" x="178" y="388" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">Person pushes Wall</text>
<text id="label_push_wall_2" x="178" y="406" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">Force ON: Wall</text>
<text id="label_push_wall_3" x="178" y="418" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Direction: rightward</text>
<rect id="label_box_push_person" x="270" y="370" width="155" height="52" rx="6" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
<text id="label_push_person_1" x="348" y="388" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">Wall pushes Person</text>
<text id="label_push_person_2" x="348" y="406" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="normal">Force ON: Person</text>
<text id="label_push_person_3" x="348" y="418" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Direction: leftward</text>
<rect id="key_box_s1" x="100" y="445" width="325" height="44" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
<text id="key_s1_1" x="262" y="462" font-size="12" fill="#4a148c" text-anchor="middle" font-weight="bold">These forces are EQUAL in size,</text>
<text id="key_s1_2" x="262" y="480" font-size="12" fill="#4a148c" text-anchor="middle" font-weight="bold">OPPOSITE in direction, on DIFFERENT objects</text>
<text id="scenario2_title" x="675" y="100" font-size="15" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Scenario 2: Block on a Table</text>
<rect id="table_top" x="530" y="280" width="290" height="20" rx="2" fill="#a1887f" stroke="#4e342e" stroke-width="2"/>
<line id="table_leg1" x1="555" y1="300" x2="555" y2="360" stroke="#4e342e" stroke-width="5" stroke-dasharray=""/>
<line id="table_leg2" x1="795" y1="300" x2="795" y2="360" stroke="#4e342e" stroke-width="5" stroke-dasharray=""/>
<text id="table_label" x="675" y="378" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Table</text>
<rect id="block" x="630" y="215" width="90" height="65" rx="4" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
<text id="block_label" x="675" y="253" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">Block</text>
<defs><marker id="arrowhead_normal_on_block" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="normal_on_block" x1="675" y1="215" x2="675" y2="155" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_normal_on_block)"/>
<text id="normal_on_block_label" x="675" y="145" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">N (Table on Block)</text>
<defs><marker id="arrowhead_normal_on_table" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#D32F2F"/></marker></defs><line id="normal_on_table" x1="675" y1="280" x2="675" y2="340" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrowhead_normal_on_table)"/>
<text id="normal_on_table_label" x="675" y="358" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">N (Block on Table)</text>
<defs><marker id="arrowhead_gravity_on_block" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="gravity_on_block" x1="730" y1="215" x2="730" y2="290" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_gravity_on_block)"/>
<text id="gravity_label" x="760" y="260" font-size="12" fill="#e65100" text-anchor="start" font-weight="bold">mg</text>
<rect id="label_box_n_block" x="470" y="420" width="185" height="52" rx="6" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
<text id="label_n_block_1" x="562" y="438" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">Table pushes Block UP</text>
<text id="label_n_block_2" x="562" y="455" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="normal">Force ON: Block</text>
<text id="label_n_block_3" x="562" y="467" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Relevant to block&#x27;s motion</text>
<rect id="label_box_n_table" x="665" y="420" width="185" height="52" rx="6" fill="#ffebee" stroke="#D32F2F" stroke-width="1.5"/>
<text id="label_n_table_1" x="757" y="438" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="bold">Block pushes Table DOWN</text>
<text id="label_n_table_2" x="757" y="455" font-size="12" fill="#D32F2F" text-anchor="middle" font-weight="normal">Force ON: Table</text>
<text id="label_n_table_3" x="757" y="467" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Irrelevant to block&#x27;s motion</text>
<rect id="key_box_s2" x="470" y="490" width="380" height="44" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text id="key_s2_1" x="660" y="508" font-size="12" fill="#5d4037" text-anchor="middle" font-weight="bold">When analyzing the block, only include forces</text>
<text id="key_s2_2" x="660" y="526" font-size="12" fill="#5d4037" text-anchor="middle" font-weight="bold">acting ON the block — never its reaction partner!</text>
<rect id="bottom_banner" x="60" y="558" width="780" height="50" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<text id="bottom_text_1" x="450" y="577" font-size="13" fill="#1a237e" text-anchor="middle" font-weight="bold">Key Insight: Action-reaction pairs NEVER cancel each other out —</text>
<text id="bottom_text_2" x="450" y="597" font-size="13" fill="#1a237e" text-anchor="middle" font-weight="normal">they act on DIFFERENT objects, so they affect different equations of motion.</text>
</svg>