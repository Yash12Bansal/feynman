<text id="jac-z-y1" x="312" y="215" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{\partial z}{\partial y_1}</text>
<text id="jac-z-y2" x="530" y="215" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{\partial z}{\partial y_2}</text>
<text id="jac-y1-x" x="300" y="450" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{\partial y_1}{\partial x}</text>
<text id="jac-y2-x" x="540" y="450" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{\partial y_2}{\partial x}</text>
<text id="grad-seed" x="510" y="95" font-size="16" fill="#9effc9" font-style="italic" text-anchor="middle">\frac{\partial z}{\partial z}=1</text>
<text id="merge-sum" x="250" y="610" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">\frac{\partial z}{\partial x}=\frac{\partial z}{\partial y_1}\frac{\partial y_1}{\partial x}+\frac{\partial z}{\partial y_2}\frac{\partial y_2}{\partial x}</text>
