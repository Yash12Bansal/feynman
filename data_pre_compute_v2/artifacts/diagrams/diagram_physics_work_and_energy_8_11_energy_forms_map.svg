<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<circle id="conservation-ring" cx="450" cy="325" r="68" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray="6 3"/>
<text id="conservation-centre" x="450" y="318" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="700">Total Energy</text>
<text id="conservation-centre-sub" x="450" y="336" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="700">= Constant</text>
<g id="connecting-arrows" transform="translate(0,0)"><defs><marker id="arrowhead_arrow-mechanical" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="arrow-mechanical" x1="270" y1="190" x2="393" y2="278" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_arrow-mechanical)"/><defs><marker id="arrowhead_arrow-thermal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="arrow-thermal" x1="640" y1="200" x2="508" y2="278" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_arrow-thermal)"/><defs><marker id="arrowhead_arrow-chemical" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="arrow-chemical" x1="172" y1="360" x2="382" y2="340" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_arrow-chemical)"/><defs><marker id="arrowhead_arrow-lightsound" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="arrow-lightsound" x1="728" y1="360" x2="518" y2="340" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_arrow-lightsound)"/><defs><marker id="arrowhead_arrow-mass" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="arrow-mass" x1="450" y1="530" x2="450" y2="393" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_arrow-mass)"/></g>
<circle id="mechanical-energy-node" cx="230" cy="155" r="60" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="mechanical-label-1" x="230" y="148" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">Mechanical</text>
<text id="mechanical-label-2" x="230" y="163" font-size="10" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Energy (KE + PE)</text>
<circle id="thermal-energy-node" cx="680" cy="155" r="60" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="thermal-label-1" x="680" y="148" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">Thermal /</text>
<text id="thermal-label-2" x="680" y="163" font-size="10" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Internal Energy</text>
<circle id="chemical-energy-node" cx="120" cy="365" r="60" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="chemical-label-1" x="120" y="358" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">Chemical</text>
<text id="chemical-label-2" x="120" y="373" font-size="10" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Energy</text>
<circle id="light-sound-node" cx="780" cy="365" r="60" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="lightsound-label-1" x="780" y="358" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">Light &amp;</text>
<text id="lightsound-label-2" x="780" y="373" font-size="10" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Sound Energy</text>
<circle id="mass-energy-node" cx="450" cy="560" r="60" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="mass-label-1" x="450" y="553" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">Mass Energy</text>
<text id="mass-label-2" x="450" y="572" font-size="11" fill="#ff7a8a" font-style="italic" text-anchor="middle">E = mc^{2}</text>
</svg>