<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="beam" x1="150" y1="330" x2="750" y2="330" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<path id="tipping-point" d="M 450 330 L 430 400 L 470 400 Z" stroke="#7fd4ff" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<line id="pivot-base" x1="410" y1="400" x2="490" y2="400" stroke="rgba(232,232,238,0.55)" stroke-width="1.5" stroke-dasharray=""/>
<text id="tipping-caption" x="450" y="425" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">“substantially all” threshold</text>
<rect id="asset-box" x="412" y="270" width="76" height="50" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2.5"/>
