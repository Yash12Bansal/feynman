<text id="lessor-side" x="220" y="80" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Lessor</text>
<text id="lessee-side" x="680" y="80" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Lessee</text>
<rect id="risks-rewards-bundle" x="175" y="250" width="90" height="60" rx="4" fill="none" stroke="#9effc9" stroke-width="2.5"/>
<rect id="bundle-token-2" x="182" y="243" width="90" height="60" rx="4" fill="none" stroke="#9effc9" stroke-width="1.5"/>
<text id="bundle-label" x="220" y="333" font-size="10" fill="#9effc9" text-anchor="middle" font-weight="normal">risks &amp; rewards of ownership</text>
<defs><marker id="arrowhead_slide-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="rgba(232,232,238,0.55)"/></marker></defs><line id="slide-arrow" x1="300" y1="200" x2="600" y2="200" stroke="rgba(232,232,238,0.55)" stroke-width="2" marker-end="url(#arrowhead_slide-arrow)"/>
<text id="operating-lease-label" x="220" y="480" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Operating lease</text>
<text id="finance-lease-label" x="680" y="480" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">Finance lease</text>
