<text id="layer2-label" x="598" y="307" font-size="17" fill="#7fd4ff" font-style="italic" text-anchor="middle">h_2</text>
<text id="loss-label" x="814" y="307" font-size="18" fill="#9effc9" font-style="italic" text-anchor="middle">J</text>
<defs><marker id="arrowhead_edge-forward" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="edge-forward" x1="166" y1="288" x2="334" y2="288" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_edge-forward)"/>
<defs><marker id="arrowhead_edge-forward-2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="edge-forward-2" x1="406" y1="288" x2="574" y2="288" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_edge-forward-2)"/>
<defs><marker id="arrowhead_edge-forward-3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="edge-forward-3" x1="646" y1="288" x2="788" y2="288" stroke="#e8e8ee" stroke-width="2.5" marker-end="url(#arrowhead_edge-forward-3)"/>
<defs><marker id="arrowhead_edge-backward" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="edge-backward" x1="788" y1="320" x2="646" y2="320" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_edge-backward)"/>
