<defs><marker id="arrowhead_edge-backward-3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="edge-backward-3" x1="334" y1="320" x2="166" y2="320" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_edge-backward-3)"/>
<text id="fwd-op1" x="218" y="262" font-size="13" fill="rgba(232,232,238,0.7)" font-style="italic" text-anchor="middle">f(W_1 x)</text>
<text id="fwd-op2" x="452" y="262" font-size="13" fill="rgba(232,232,238,0.7)" font-style="italic" text-anchor="middle">f(W_2 h_1)</text>
<text id="bwd-op1" x="686" y="372" font-size="14" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{\partial J}{\partial h_2}</text>
<text id="bwd-op2" x="462" y="372" font-size="14" fill="#ff7a8a" font-style="italic" text-anchor="middle">\frac{\partial J}{\partial h_1}</text>
<text id="chain-rule" x="270" y="480" font-size="18" fill="#e8e8ee" font-style="italic" text-anchor="middle">\frac{\partial J}{\partial W_1} = \frac{\partial J}{\partial h_2}\,\frac{\partial h_2}{\partial h_1}\,\frac{\partial h_1}{\partial W_1}</text>
<text id="fwd-caption" x="450" y="175" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">forward pass</text>
<text id="bwd-caption" x="450" y="430" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">backward pass</text>
