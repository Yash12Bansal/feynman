<circle id="node-layer2" cx="610" cy="300" r="36" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<circle id="node-loss" cx="820" cy="300" r="32" fill="none" stroke="#9effc9" stroke-width="2.5" stroke-dasharray=""/>
<text id="input-label" x="124" y="307" font-size="18" fill="#e8e8ee" font-style="italic" text-anchor="middle">x</text>
