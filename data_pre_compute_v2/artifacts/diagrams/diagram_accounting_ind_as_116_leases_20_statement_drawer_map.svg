<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="balance-sheet-box" x="40" y="110" width="250" height="420" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="bs-label" x="165" y="95" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">Balance sheet</text>
<line id="bs-divider" x1="40" y1="320" x2="290" y2="320" stroke="rgba(232,232,238,0.55)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text id="bs-assets-label" x="165" y="145" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Assets</text>
<text id="bs-liab-label" x="165" y="355" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">Liabilities</text>
<rect id="rou-asset-slot" x="65" y="165" width="200" height="60" rx="4" fill="none" stroke="#9effc9" stroke-width="2"/>
<text id="rou-asset-text" x="165" y="200" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">Right-of-use asset</text>
<rect id="lease-liability-slot" x="65" y="375" width="200" height="60" rx="4" fill="none" stroke="#ff7a8a" stroke-width="2"/>
<text id="lease-liability-text" x="165" y="410" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Lease liability</text>
<rect id="pl-box" x="325" y="110" width="250" height="250" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="pl-label" x="450" y="95" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">Profit and loss</text>
<rect id="depreciation-slot" x="350" y="150" width="200" height="60" rx="4" fill="none" stroke="#9effc9" stroke-width="2"/>
<text id="depreciation-text" x="450" y="178" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="normal">Depreciation</text>
<text id="depreciation-sub" x="450" y="196" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">of ROU asset</text>
<rect id="interest-slot" x="350" y="240" width="200" height="60" rx="4" fill="none" stroke="#ff7a8a" stroke-width="2"/>
<text id="interest-text" x="450" y="268" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="normal">Interest expense</text>
<text id="interest-sub" x="450" y="286" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">(finance cost)</text>
<rect id="cashflow-box" x="610" y="110" width="250" height="420" rx="6" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<text id="cf-label" x="735" y="95" font-size="14" fill="#7fd4ff" text-anchor="middle" font-weight="600">Cash flows</text>
<line id="cf-divider" x1="610" y1="320" x2="860" y2="320" stroke="rgba(232,232,238,0.55)" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect id="financing-band" x="635" y="150" width="200" height="140" rx="4" fill="none" stroke="#9effc9" stroke-width="2"/>
<text id="financing-label" x="735" y="172" font-size="12" fill="#9effc9" text-anchor="middle" font-weight="600">Financing</text>
<text id="financing-item1" x="735" y="205" font-size="10" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">Principal portion</text>
<text id="financing-item2" x="735" y="232" font-size="10" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">Interest portion</text>
<text id="financing-item3" x="735" y="259" font-size="10" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">of lease payments</text>
<rect id="operating-band" x="635" y="350" width="200" height="160" rx="4" fill="none" stroke="#ff7a8a" stroke-width="2"/>
<text id="operating-label" x="735" y="372" font-size="12" fill="#ff7a8a" text-anchor="middle" font-weight="600">Operating</text>
<text id="operating-item1" x="735" y="405" font-size="10" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">Short-term leases</text>
<text id="operating-item2" x="735" y="432" font-size="10" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">Low-value leases</text>
<text id="operating-item3" x="735" y="459" font-size="10" fill="rgba(232,232,238,0.7)" text-anchor="middle" font-weight="normal">Variable payments</text>
</svg>
