<line id="rb-pos-terminal" x1="416" y1="63" x2="416" y2="93" stroke="#ff7a8a" stroke-width="3" stroke-dasharray=""/>
<line id="rb-neg-terminal" x1="428" y1="68" x2="428" y2="88" stroke="#ff7a8a" stroke-width="1.5" stroke-dasharray=""/>
<text id="rb-plus-label" x="449" y="72" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">+</text>
<text id="rb-minus-label" x="413" y="72" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">−</text>
<text id="rb-battery-label" x="435" y="50" font-size="10" fill="#ff7a8a" text-anchor="middle" font-weight="normal">V_CE</text>
<defs><marker id="arrowhead_electron-flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="electron-flow-arrow" x1="145" y1="300" x2="570" y2="300" stroke="#9effc9" stroke-width="3" marker-end="url(#arrowhead_electron-flow-arrow)"/>
<text id="electron-flow-label" x="357" y="286" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="600">electron flow</text>
<line id="base-terminal-wire" x1="340" y1="420" x2="340" y2="530" stroke="#e8e8ee" stroke-width="1.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_base-current-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="base-current-arrow" x1="340" y1="530" x2="260" y2="530" stroke="#ff7a8a" stroke-width="2" marker-end="url(#arrowhead_base-current-arrow)"/>
<text id="base-current-label" x="295" y="548" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="600">I_B (tiny)</text>
<line id="collector-terminal-wire" x1="600" y1="300" x2="660" y2="300" stroke="#e8e8ee" stroke-width="1.5" stroke-dasharray=""/>
<defs><marker id="arrowhead_collector-current-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fd4ff"/></marker></defs><line id="collector-current-arrow" x1="660" y1="300" x2="760" y2="300" stroke="#7fd4ff" stroke-width="3" marker-end="url(#arrowhead_collector-current-arrow)"/>
<text id="collector-current-label" x="710" y="286" font-size="11" fill="#7fd4ff" text-anchor="middle" font-weight="600">I_C (large)</text>
</svg>
