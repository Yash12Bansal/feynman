<line id="eb-junction" x1="300" y1="170" x2="300" y2="430" stroke="#9effc9" stroke-width="2.5" stroke-dasharray="6,3"/>
<line id="cb-junction" x1="380" y1="170" x2="380" y2="430" stroke="#9effc9" stroke-width="2.5" stroke-dasharray="6,3"/>
<text id="emitter-label" x="210" y="165" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Emitter (E)</text>
<text id="emitter-type-label" x="210" y="308" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">n-type</text>
<text id="emitter-doping-label" x="210" y="328" font-size="10" fill="rgba(127,212,255,0.7)" text-anchor="middle" font-weight="normal">(heavy doping)</text>
<text id="base-label" x="340" y="165" font-size="13" fill="#ff7a8a" text-anchor="middle" font-weight="600">Base (B)</text>
<text id="base-type-label" x="340" y="303" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">p-type</text>
<text id="base-doping-label" x="340" y="320" font-size="9" fill="rgba(255,122,138,0.7)" text-anchor="middle" font-weight="normal">(thin, light)</text>
<text id="collector-label" x="490" y="165" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Collector (C)</text>
<text id="collector-type-label" x="490" y="308" font-size="12" fill="#7fd4ff" text-anchor="middle" font-weight="normal">n-type</text>
<text id="collector-doping-label" x="490" y="328" font-size="10" fill="rgba(127,212,255,0.55)" text-anchor="middle" font-weight="normal">(moderate doping)</text>
<text id="eb-junction-label" x="300" y="448" font-size="10" fill="#9effc9" text-anchor="middle" font-weight="normal">EB junction</text>
