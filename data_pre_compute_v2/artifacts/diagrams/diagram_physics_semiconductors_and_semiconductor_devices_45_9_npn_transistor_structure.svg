<line id="rb-wire-top" x1="490" y1="180" x2="490" y2="100" stroke="#e8e8ee" stroke-width="1.5" stroke-dasharray=""/>
<line id="rb-wire-bottom" x1="490" y1="100" x2="340" y2="100" stroke="#e8e8ee" stroke-width="1.5" stroke-dasharray=""/>
