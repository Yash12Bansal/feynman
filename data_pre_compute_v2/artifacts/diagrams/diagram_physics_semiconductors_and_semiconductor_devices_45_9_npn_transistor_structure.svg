<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<rect id="emitter-region" x="120" y="180" width="180" height="240" rx="4" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
<rect id="emitter-fill" x="121" y="181" width="178" height="238" rx="3" fill="rgba(127,212,255,0.18)" stroke="none" stroke-width="0"/>
<rect id="base-region" x="300" y="180" width="80" height="240" rx="0" fill="none" stroke="#ff7a8a" stroke-width="2.5"/>
<rect id="base-fill" x="301" y="181" width="78" height="238" rx="0" fill="rgba(255,122,138,0.08)" stroke="none" stroke-width="0"/>
<rect id="collector-region" x="380" y="180" width="220" height="240" rx="4" fill="none" stroke="#7fd4ff" stroke-width="2.5"/>
