<text id="cb-junction-label" x="380" y="448" font-size="10" fill="#9effc9" text-anchor="middle" font-weight="normal">CB junction</text>
<text id="cb-junction-bias-label" x="380" y="462" font-size="9" fill="rgba(158,255,201,0.7)" text-anchor="middle" font-weight="normal">(reverse-biased)</text>
<line id="fb-wire-top" x1="210" y1="180" x2="210" y2="100" stroke="#e8e8ee" stroke-width="1.5" stroke-dasharray=""/>
