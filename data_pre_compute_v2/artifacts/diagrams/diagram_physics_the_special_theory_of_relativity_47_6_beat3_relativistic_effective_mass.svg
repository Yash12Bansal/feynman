<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>

<line id="c_wall" x1="720" y1="80" x2="720" y2="540" stroke="#ff7a8a" stroke-width="2" stroke-dasharray="8 5"/>
<text id="c_wall_label" x="726" y="104" font-size="12" fill="#ff7a8a" text-anchor="start" font-weight="600">v = c</text>
<text id="wall_barrier_label" x="726" y="120" font-size="10" fill="rgba(255,122,138,0.65)" text-anchor="start" font-weight="normal">(barrier)</text>
<circle id="rest_mass_dot" cx="100" cy="483" r="5" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<text id="rest_mass_label" x="108" y="496" font-size="11" fill="#7fd4ff" text-anchor="start" font-weight="normal">m₀  (v = 0)</text>
<text id="formula_main" x="760" y="260" font-size="17" fill="#9effc9" font-style="italic" text-anchor="middle">m_{\text{eff}} = \gamma m_0 = \dfrac{m_0}{\sqrt{1 - v^2/c^2}}</text>
<text id="formula_limit" x="760" y="320" font-size="15" fill="#ff7a8a" font-style="italic" text-anchor="middle">v \to c \implies m_{\text{eff}} \to \infty</text>
<defs><marker id="arrowhead_diverge_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="diverge_arrow" x1="700" y1="160" x2="716" y2="100" stroke="#9effc9" stroke-width="2" marker-end="url(#arrowhead_diverge_arrow)"/>
<text id="diverge_label" x="672" y="158" font-size="12" fill="#9effc9" text-anchor="end" font-weight="600">→ ∞</text>
<text id="gamma_label" x="760" y="390" font-size="13" fill="rgba(232,232,238,0.55)" font-style="italic" text-anchor="middle">\gamma = \dfrac{1}{\sqrt{1 - v^2/c^2}}</text>
</svg>