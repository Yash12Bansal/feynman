<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
<text id="main_title" x="450" y="40" font-size="22" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Free Body Diagrams in Action</text>
<line id="divider" x1="450" y1="60" x2="450" y2="620" stroke="#ddd" stroke-width="2" stroke-dasharray="6,4"/>
<text id="ex1_title" x="225" y="75" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">Example 1: Boy Carrying a Load</text>
<rect id="ex1_load" x="185" y="115" width="80" height="35" rx="4" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/>
<text id="ex1_load_label" x="225" y="137" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="normal">Load</text>
<rect id="ex1_boy_body" x="195" y="150" width="60" height="100" rx="6" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
<text id="ex1_boy_label" x="225" y="205" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold">Boy</text>
<line id="ex1_floor" x1="140" y1="250" x2="310" y2="250" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<line id="ex1_floor_h1" x1="140" y1="250" x2="150" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h2" x1="160" y1="250" x2="170" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h3" x1="180" y1="250" x2="190" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h4" x1="200" y1="250" x2="210" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h5" x1="220" y1="250" x2="230" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h6" x1="240" y1="250" x2="250" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h7" x1="260" y1="250" x2="270" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h8" x1="280" y1="250" x2="290" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<line id="ex1_floor_h9" x1="300" y1="250" x2="310" y2="262" stroke="#555" stroke-width="2" stroke-dasharray=""/>
<text id="ex1_system_label" x="225" y="285" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">System: The Boy</text>
<text id="ex1_accel_label" x="225" y="302" font-size="12" fill="#888" text-anchor="middle" font-weight="normal">a = 0 (standing still)</text>
<circle id="ex1_fbd_dot" cx="225" cy="390" r="10" fill="#1565C0" stroke="#0D47A1" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_ex1_fbd_N" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="ex1_fbd_N" x1="225" y1="380" x2="225" y2="320" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_ex1_fbd_N)"/>
<text id="ex1_fbd_N_label" x="245" y="340" font-size="12" fill="#E65100" text-anchor="start" font-weight="bold">N (floor)</text>
<defs><marker id="arrowhead_ex1_fbd_W" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="ex1_fbd_W" x1="225" y1="400" x2="225" y2="455" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_ex1_fbd_W)"/>
<text id="ex1_fbd_W_label" x="245" y="440" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">W (boy&#x27;s weight)</text>
<defs><marker id="arrowhead_ex1_fbd_L" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9C27B0"/></marker></defs><line id="ex1_fbd_L" x1="215" y1="380" x2="215" y2="435" stroke="#9C27B0" stroke-width="3" marker-end="url(#arrowhead_ex1_fbd_L)"/>
<text id="ex1_fbd_L_label" x="130" y="415" font-size="12" fill="#6A1B9A" text-anchor="start" font-weight="bold">F_load</text>
<line id="ex1_fbd_L_pointer" x1="175" y1="415" x2="213" y2="415" stroke="#9C27B0" stroke-width="1" stroke-dasharray="3,2"/>
<text id="ex1_fbd_title" x="225" y="360" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Free Body Diagram</text>
<text id="ex1_eq" x="225" y="510" font-size="14" fill="#D32F2F" font-style="italic" text-anchor="middle">N - W - F_{load} = 0</text>
<text id="ex1_eq2" x="225" y="548" font-size="14" fill="#1565C0" font-style="italic" text-anchor="middle">N = W + F_{load}</text>
<text id="ex1_insight" x="225" y="585" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Floor pushes harder than just body weight!</text>
<text id="ex2_title" x="675" y="75" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">Example 2: Block Pulled at an Angle</text>
<rect id="ex2_block" x="620" y="175" width="70" height="55" rx="4" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
<text id="ex2_block_label" x="655" y="207" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold">Block</text>
<line id="ex2_floor" x1="530" y1="230" x2="820" y2="230" stroke="#555" stroke-width="3" stroke-dasharray=""/>
<defs><marker id="arrowhead_ex2_tension_arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/></marker></defs><line id="ex2_tension_arrow" x1="690" y1="185" x2="760" y2="140" stroke="#2196F3" stroke-width="3" marker-end="url(#arrowhead_ex2_tension_arrow)"/>
<text id="ex2_tension_label" x="775" y="138" font-size="12" fill="#1565C0" text-anchor="start" font-weight="bold">T (at angle</text>
<text id="ex2_theta_label" x="775" y="158" font-size="13" fill="#1565C0" font-style="italic" text-anchor="middle">\theta</text>
<path id="ex2_angle_arc" d="M 662.0 185.0 A 28.0 28.0 0 0 1 667.0637427599082 168.9398597821707" stroke="#2196F3" stroke-width="1.5" fill="none"/>
<text id="ex2_system_label" x="675" y="260" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">System: The Block</text>
<text id="ex2_accel_label" x="675" y="277" font-size="12" fill="#888" text-anchor="middle" font-weight="normal">Accelerates horizontally</text>
<circle id="ex2_fbd_dot" cx="675" cy="370" r="10" fill="#1565C0" stroke="#0D47A1" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_ex2_fbd_N" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/></marker></defs><line id="ex2_fbd_N" x1="675" y1="360" x2="675" y2="305" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead_ex2_fbd_N)"/>
<text id="ex2_fbd_N_label" x="693" y="325" font-size="13" fill="#E65100" text-anchor="start" font-weight="bold">N</text>
<defs><marker id="arrowhead_ex2_fbd_W" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/></marker></defs><line id="ex2_fbd_W" x1="675" y1="380" x2="675" y2="435" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead_ex2_fbd_W)"/>
<text id="ex2_fbd_W_label" x="693" y="420" font-size="13" fill="#2E7D32" text-anchor="start" font-weight="bold">W</text>
<defs><marker id="arrowhead_ex2_fbd_Tx" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/></marker></defs><line id="ex2_fbd_Tx" x1="685" y1="370" x2="745" y2="370" stroke="#2196F3" stroke-width="3" marker-end="url(#arrowhead_ex2_fbd_Tx)"/>
<text id="ex2_fbd_Tx_label" x="750" y="365" font-size="12" fill="#1565C0" text-anchor="start" font-weight="bold">T cos</text>
<text id="ex2_fbd_Tx_theta" x="800" y="363" font-size="12" fill="#1565C0" font-style="italic" text-anchor="middle">\theta</text>
<defs><marker id="arrowhead_ex2_fbd_Ty" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9C27B0"/></marker></defs><line id="ex2_fbd_Ty" x1="665" y1="360" x2="665" y2="315" stroke="#9C27B0" stroke-width="3" marker-end="url(#arrowhead_ex2_fbd_Ty)"/>
<text id="ex2_fbd_Ty_label" x="590" y="335" font-size="12" fill="#6A1B9A" text-anchor="start" font-weight="bold">T sin</text>
<text id="ex2_fbd_Ty_theta" x="635" y="333" font-size="12" fill="#6A1B9A" font-style="italic" text-anchor="middle">\theta</text>
<text id="ex2_fbd_title" x="675" y="345" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Free Body Diagram</text>
<text id="ex2_eq_x" x="675" y="490" font-size="13" fill="#D32F2F" font-style="italic" text-anchor="middle">x:\; T\cos\theta = ma</text>
<text id="ex2_eq_y" x="675" y="528" font-size="13" fill="#1565C0" font-style="italic" text-anchor="middle">y:\; N + T\sin\theta - W = 0</text>
<text id="ex2_insight" x="675" y="575" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Two directions, two equations — solved!</text>
</svg>