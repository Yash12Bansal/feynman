<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<circle id="earth" cx="150" cy="330" r="38" fill="none" stroke="#7fd4ff" stroke-width="2.5" stroke-dasharray=""/>
<text id="earth-label" x="150" y="400" font-size="13" fill="#7fd4ff" text-anchor="middle" font-weight="600">Earth</text>
<circle id="planet" cx="750" cy="330" r="32" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<text id="planet-label" x="750" y="394" font-size="13" fill="#e8e8ee" text-anchor="middle" font-weight="600">Distant planet</text>
<defs><marker id="arrowhead_outbound-path" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="outbound-path" x1="200" y1="290" x2="700" y2="290" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_outbound-path)"/>
<text id="outbound-label" x="450" y="278" font-size="11" fill="#9effc9" text-anchor="middle" font-weight="normal">outbound (v near c)</text>
<defs><marker id="arrowhead_return-path" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="return-path" x1="700" y1="370" x2="200" y2="370" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_return-path)"/>
<text id="return-label" x="450" y="392" font-size="11" fill="#ff7a8a" text-anchor="middle" font-weight="normal">return (v near c)</text>
<path id="turnaround" d="M 775.0 286.69872981077805 A 50.0 50.0 0 0 1 775.0 373.30127018922195" stroke="#ff7a8a" stroke-width="2.5" fill="none"/>
<text id="turnaround-label" x="808" y="334" font-size="11" fill="#ff7a8a" text-anchor="start" font-weight="normal">turnaround</text>
<text id="ram-clock" x="360" y="480" font-size="16" fill="#9effc9" font-style="italic" text-anchor="middle">t_{\text{Ram}} = t/\gamma</text>
<text id="ram-clock-caption" x="450" y="510" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">travelling twin</text>
<text id="balram-clock" x="96" y="200" font-size="16" fill="#7fd4ff" font-style="italic" text-anchor="middle">t_{\text{Balram}} = t</text>
<text id="balram-clock-caption" x="150" y="220" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">stay-home twin</text>
</svg>