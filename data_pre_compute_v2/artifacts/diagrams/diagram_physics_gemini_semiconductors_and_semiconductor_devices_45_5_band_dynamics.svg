<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<defs><marker id="arrowhead_energy-axis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e8e8ee"/></marker></defs><line id="energy-axis" x1="160" y1="500" x2="160" y2="130" stroke="#e8e8ee" stroke-width="2" marker-end="url(#arrowhead_energy-axis)"/>
<text id="energy-label" x="160" y="105" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">E</text>
<rect id="conduction-band" x="250" y="150" width="400" height="80" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2"/>
<text id="cb-label" x="450" y="138" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Conduction Band</text>
<text id="ec-label" x="210" y="230" font-size="14" fill="#e8e8ee" font-style="italic" text-anchor="middle">E_c</text>
<rect id="valence-band" x="250" y="420" width="400" height="80" rx="4" fill="none" stroke="#e8e8ee" stroke-width="2"/>
<text id="vb-label" x="450" y="522" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Valence Band</text>
<text id="ev-label" x="210" y="420" font-size="14" fill="#e8e8ee" font-style="italic" text-anchor="middle">E_v</text>
<defs><marker id="arrowhead_generation-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9effc9"/></marker></defs><line id="generation-arrow" x1="350" y1="454" x2="350" y2="196" stroke="#9effc9" stroke-width="2.5" marker-end="url(#arrowhead_generation-arrow)"/>
<text id="generation-text" x="335" y="325" font-size="13" fill="#9effc9" text-anchor="end" font-weight="600">Generation</text>
<circle id="gen-hole" cx="350" cy="460" r="6" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray="3 2"/>
<text id="gen-h-tex" x="365" y="453" font-size="14" fill="#9effc9" font-style="italic" text-anchor="middle">h^{+}</text>
<circle id="gen-e" cx="350" cy="190" r="6" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<text id="gen-e-tex" x="365" y="183" font-size="14" fill="#9effc9" font-style="italic" text-anchor="middle">e^{-}</text>
<defs><marker id="arrowhead_recombination-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="recombination-arrow" x1="550" y1="196" x2="550" y2="454" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_recombination-arrow)"/>
<text id="recombination-text" x="565" y="325" font-size="13" fill="#ff7a8a" text-anchor="start" font-weight="600">Recombination</text>
<circle id="rec-e" cx="550" cy="190" r="6" fill="none" stroke="#ff7a8a" stroke-width="2" stroke-dasharray=""/>
<text id="rec-e-tex" x="565" y="183" font-size="14" fill="#ff7a8a" font-style="italic" text-anchor="middle">e^{-}</text>
<circle id="rec-hole" cx="550" cy="460" r="6" fill="none" stroke="#ff7a8a" stroke-width="2" stroke-dasharray="3 2"/>
<text id="rec-h-tex" x="565" y="453" font-size="14" fill="#ff7a8a" font-style="italic" text-anchor="middle">h^{+}</text>
</svg>