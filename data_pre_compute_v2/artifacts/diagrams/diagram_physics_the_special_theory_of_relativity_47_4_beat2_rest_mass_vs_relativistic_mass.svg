<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<text id="label-A" x="225" y="58" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Observer A</text>
<text id="label-B" x="675" y="58" font-size="14" fill="#e8e8ee" text-anchor="middle" font-weight="600">Observer B</text>
<circle id="observer-A" cx="225" cy="155" r="22" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-A-body" x1="225" y1="177" x2="225" y2="230" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-A-arms" x1="190" y1="200" x2="260" y2="200" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-A-leg-l" x1="225" y1="230" x2="205" y2="265" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<line id="observer-A-leg-r" x1="225" y1="230" x2="245" y2="265" stroke="#7fd4ff" stroke-width="2" stroke-dasharray=""/>
<text id="rest-label" x="225" y="292" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">at rest</text>
<circle id="particle-A" cx="225" cy="390" r="32" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<text id="m0-label" x="225" y="396" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">m_0</text>
<text id="measures-A" x="225" y="448" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">measures rest mass</text>
<text id="measures-A-math" x="225" y="472" font-size="14" fill="#7fd4ff" font-style="italic" text-anchor="middle">m_0</text>
<circle id="observer-B" cx="675" cy="155" r="22" fill="none" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<line id="observer-B-body" x1="675" y1="177" x2="675" y2="230" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<line id="observer-B-arms" x1="640" y1="200" x2="710" y2="200" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<line id="observer-B-leg-l" x1="675" y1="230" x2="655" y2="265" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<line id="observer-B-leg-r" x1="675" y1="230" x2="695" y2="265" stroke="#9effc9" stroke-width="2" stroke-dasharray=""/>
<defs><marker id="arrowhead_velocity-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="velocity-arrow" x1="760" y1="200" x2="820" y2="200" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_velocity-arrow)"/>
<text id="velocity-label" x="830" y="204" font-size="13" fill="#ff7a8a" font-style="italic" text-anchor="middle">v</text>
<text id="moving-label" x="675" y="292" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">moving at speed v</text>
<circle id="particle-B" cx="675" cy="390" r="42" fill="none" stroke="#e8e8ee" stroke-width="2.5" stroke-dasharray=""/>
<text id="m-label" x="675" y="396" font-size="16" fill="#e8e8ee" font-style="italic" text-anchor="middle">m</text>
<text id="measures-B" x="675" y="452" font-size="11" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">measures moving mass</text>
<text id="measures-B-math" x="675" y="476" font-size="14" fill="#9effc9" font-style="italic" text-anchor="middle">m = \gamma m_0</text>
<line id="divider" x1="450" y1="80" x2="450" y2="570" stroke="rgba(232,232,238,0.18)" stroke-width="1.5" stroke-dasharray="6 5"/>
<line id="bridge-line" x1="290" y1="390" x2="620" y2="390" stroke="rgba(232,232,238,0.25)" stroke-width="1.2" stroke-dasharray="4 4"/>
<text id="equals-bridge" x="450" y="396" font-size="22" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="600">=</text>
<text id="gamma-def" x="450" y="540" font-size="15" fill="rgba(232,232,238,0.70)" font-style="italic" text-anchor="middle">\gamma = \frac{1}{\sqrt{1 - v^2/c^2}}</text>
<text id="invariant-note" x="225" y="510" font-size="10" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">invariant — same for all</text>
<text id="dependent-note" x="675" y="510" font-size="10" fill="rgba(232,232,238,0.45)" text-anchor="middle" font-weight="normal">observer-dependent</text>
</svg>