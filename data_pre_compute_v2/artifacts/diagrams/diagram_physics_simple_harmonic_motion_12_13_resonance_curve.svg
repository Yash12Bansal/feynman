<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect x="0" y="0" width="900" height="650" fill="transparent"/>
<line id="freq-axis" x1="120" y1="520" x2="800" y2="520" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/>
<line id="amplitude-axis" x1="120" y1="520" x2="120" y2="100" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/>
<text id="freq-axis-label" x="460" y="565" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">driving frequency</text>
<text id="amplitude-axis-label" x="70" y="300" font-size="12" fill="rgba(232,232,238,0.55)" text-anchor="middle" font-weight="normal">amplitude</text>
<line id="natural-freq-tick" x1="460" y1="520" x2="460" y2="528" stroke="#e8e8ee" stroke-width="2" stroke-dasharray=""/>
<line id="natural-freq-line" x1="460" y1="520" x2="460" y2="130" stroke="rgba(232,232,238,0.4)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text id="natural-freq-symbol" x="450" y="545" font-size="14" fill="rgba(232,232,238,0.7)" font-style="italic" text-anchor="middle">\omega_0</text>
<path id="curve-heavy-damping" d="M 130 510 Q 300 480 460 400 Q 620 480 790 510" stroke="#7fd4ff" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<path id="curve-light-damping" d="M 130 500 C 360 490 430 480 460 150 C 490 480 560 490 790 500" stroke="#ff7a8a" stroke-width="2.5" fill="none" stroke-dasharray=""/>
<circle id="resonance-peak" cx="460" cy="150" r="5" fill="none" stroke="#ff7a8a" stroke-width="2.5" stroke-dasharray=""/>
<text id="heavy-label" x="600" y="460" font-size="11" fill="#7fd4ff" text-anchor="start" font-weight="normal">large damping</text>
<text id="light-label" x="475" y="145" font-size="11" fill="#ff7a8a" text-anchor="start" font-weight="normal">small damping</text>
</svg>