<defs><marker id="arrowhead_grad-arrow-shared" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a8a"/></marker></defs><line id="grad-arrow-shared" x1="512" y1="440" x2="562" y2="440" stroke="#ff7a8a" stroke-width="2.5" marker-end="url(#arrowhead_grad-arrow-shared)"/>
