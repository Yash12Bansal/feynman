# Curriculum Pipeline v2 Configuration

# ── LLM: the SINGLE switch for the whole ingestion authoring path ──────────
# Change `provider` + `model` here and EVERY authoring stage (skeleton, topics,
# prereqs, questions, lesson planner, diagram generator, book-example weaver,
# highlight aligner, semantic validation, vision diagram-QA) uses it.
#   provider: "anthropic" | "openai" | "gemini" | "ollama"
#   model:    a model id valid for that provider, e.g.
#             anthropic → "claude-sonnet-4-6"
#             openai    → "gpt-4o" (must support vision for DiagramQA)
#             gemini    → "gemini-2.5-pro" (or another vision-capable model)
# API key is read from the matching env var:
#   ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY (or GOOGLE_API_KEY).
# ollama is local + keyless (set `base_url` if not on the default port).
llm:
  provider: "anthropic"
  model: "claude-opus-4-8"
  temperature: 0.3
  max_tokens: 16384
  # base_url: "http://localhost:11434"   # for ollama / OpenAI-compatible endpoints

# Optional per-role overrides. Leave commented to follow the `llm` switch above.
# enrichment:
#   diagram_qa:
#     provider: "anthropic"          # vision QA — pin a strong vision model
#     model: "claude-sonnet-4-6"
#   lesson_pipeline:
#     judge_provider: "openai"       # judging with a DIFFERENT model than the
#     judge_model: "gpt-4o"          # author reduces correlated error

pdf:
  ocr_threshold: 50
  image_dpi: 200
  ocr_language: "eng"

tts:
  provider: "kokoro"
  model: "kokoro-v1.0"
  voice: "af_heart"
  sample_rate: 24000
  output_format: "mp3"
  pause_short_ms: 250
  pause_long_ms: 750

# Phase 3 — measured layout + pagination. The preview screen pins SplitBoard
# to these exact pixel dimensions via `.sb-root--preview`; live agent path
# remains responsive and ignores this block. Numbers from design doc §7.3.
layout:
  viewport:
    width: 1600
    height: 900
  slide:
    x: 30
    y: 50
    width: 900
    height: 800
    padding: 20
  notebook:
    x: 970
    y: 50
    width: 600
    height: 800
    padding: 30
  block_spacing_px: 12
  block_default_widths:
    SECTION: 540
    EQUATION: 540
    STEP: 520
    KEY: 540
    TEXT: 540
    ANSWER: 540
  diagram:
    max_scale: 1.0
    fit: "contain"
  measurement:
    mode: "headless_browser"
    cache_dir: "./artifacts/measurement_cache"
    page_path: "./tools/measurement_page.html"
    css_hash_path: "../frontend/src/engine/whiteboard/split/SplitBoard.css"
  pagination:
    lookahead_seconds: 20.0
    overflow_safety_margin_px: 8.0

validation:
  # Resource-constrained: one local judge. Add Claude back later if quality
  # demands it. Note: Ollama has no `qwen3.5:9b` — qwen3:8b is the closest
  # equivalent (≈5GB at 4-bit, fits comfortably on M4 Pro 24GB).
  judge_models:
    - provider: "ollama"
      model: "qwen3:8b"
  judge_agreement_threshold: 0.5
  tts_qa_drift_threshold: 0.05
  gap_fill_max_retries: 2

neo4j:
  # Matches the Neo4j service in ../docker-compose.yml at the project root.
  # Start it with:  docker compose up -d neo4j   (from project root)
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "password"
  database: "neo4j"

embedding:
  # Default: free, local, 384 dims. Switch to openai if you want 1536 dims
  # and have an OPENAI_API_KEY.
  provider: "sentence_transformers"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: 384
  batch_size: 64
  device: "auto" # auto-picks mps/cuda/cpu

artifacts:
  base_dir: "./artifacts"
  audio_dir: "audio"
  diagram_dir: "diagrams"
  animation_dir: "animations"
  runs_dir: "runs"
  url_prefix: "file://./artifacts"
